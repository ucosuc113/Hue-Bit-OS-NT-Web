<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Texto</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --green: #00ff88;
      --green-dim: #00aa55;
      --amber: #ffb300;
      --bg: #030a05;
      --glow-sm: 0 0 4px #00ff8888;
    }
    
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }
    
    body {
      display: flex;
      flex-direction: column;
    }
    
    /* ── Toolbar ── */
    .toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(0,255,136,0.18);
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(0,30,16,0.7);
      flex-shrink: 0;
    }
    
    .toolbar button {
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.18);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background 0.12s;
      letter-spacing: 0.05em;
    }
    
    .toolbar button:hover {
      background: rgba(0,255,136,0.18);
      box-shadow: var(--glow-sm);
    }
    
    .filename {
      font-size: 0.72rem;
      color: var(--green);
      flex: 1;
      letter-spacing: 0.05em;
    }
    
    .modified {
      font-size: 0.65rem;
      color: var(--amber);
      text-shadow: 0 0 4px #ffb30088;
      letter-spacing: 0.08em;
    }
    
    /* ── Editor ── */
    .editor-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .line-numbers {
      background: rgba(0,30,16,0.5);
      border-right: 1px solid rgba(0,255,136,0.12);
      padding: 8px 0;
      min-width: 48px;
      text-align: right;
      padding-right: 6px;
      font-size: 0.7rem;
      color: var(--green-dim);
      overflow: hidden;
      flex-shrink: 0;
      line-height: 1.5;
      user-select: none;
    }
    
    .editor-wrapper {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--green);
      font-family: inherit;
      font-size: 0.75rem;
      padding: 8px 10px;
      resize: none;
      outline: none;
      overflow: auto;
      line-height: 1.5;
      letter-spacing: 0.02em;
      caret-color: var(--green);
      tab-size: 2;
    }
    
    textarea::-webkit-scrollbar { width: 5px; height: 5px; }
    textarea::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 2px; }
    
    /* ── Status bar ── */
    .statusbar {
      padding: 6px 10px;
      border-top: 1px solid rgba(0,255,136,0.18);
      font-size: 0.65rem;
      color: var(--green-dim);
      background: rgba(0,30,16,0.5);
      flex-shrink: 0;
      display: flex;
      gap: 12px;
    }
    
    .stat { display: flex; gap: 6px; }
    .stat-label { color: var(--green-dim); }
    .stat-value { color: var(--green); letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="btn-open" title="Abrir archivo">📂 Abrir</button>
    <button id="btn-save" title="Guardar (Ctrl+S)">💾 Guardar</button>
    <span class="filename" id="filename">Sin título</span>
    <span class="modified" id="modified" style="display:none;">●  MODIFICADO</span>
  </div>

  <div class="editor-container">
    <div class="editor-wrapper">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="content" spellcheck="false" autocomplete="off"></textarea>
    </div>
  </div>

  <div class="statusbar">
    <div class="stat">
      <span class="stat-label">LÍN:</span>
      <span class="stat-value" id="stat-line">1</span>
    </div>
    <div class="stat">
      <span class="stat-label">COL:</span>
      <span class="stat-value" id="stat-col">1</span>
    </div>
    <div class="stat">
      <span class="stat-label">CARACTERES:</span>
      <span class="stat-value" id="stat-chars">0</span>
    </div>
  </div>

  <script>
    const Kernel = window.parent.Kernel;
    
    class TextEditor {
      constructor() {
        this.currentPath = null;
        this.content = '';
        this.modified = false;
        this.init();
      }
      
      init() {
        this.bindEvents();
        this.updateLineNumbers();
        
        // Escuchar petición de abrir archivo
        Kernel.on('app:open-editor', (data) => {
          if (data.path) this.openFile(data.path);
        });
      }
      
      bindEvents() {
        const textarea = document.getElementById('content');
        
        textarea.addEventListener('input', () => {
          this.content = textarea.value;
          this.setModified(true);
          this.updateStats();
          this.updateLineNumbers();
        });
        
        textarea.addEventListener('keydown', (e) => {
          // Tab
          if (e.key === 'Tab') {
            e.preventDefault();
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + '\t' + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + 1;
            this.content = textarea.value;
            this.setModified(true);
            this.updateLineNumbers();
          }
          
          // Ctrl+S o Cmd+S
          if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            this.save();
          }
        });
        
        textarea.addEventListener('scroll', () => {
          document.getElementById('line-numbers').scrollTop = textarea.scrollTop;
        });
        
        document.getElementById('btn-open').addEventListener('click', () => this.showOpenDialog());
        document.getElementById('btn-save').addEventListener('click', () => this.save());
        
        this.updateStats();
      }
      
      showOpenDialog() {
        // Emitir evento para que el File Manager abra un diálogo
        const path = prompt('Ruta del archivo:', '/home/docs/readme.txt');
        if (path) this.openFile(path);
      }
      
      async openFile(path) {
        try {
          const content = await Kernel.fs.read(path);
          const stat = await Kernel.fs.stat(path);
          
          this.currentPath = path;
          this.content = content;
          document.getElementById('content').value = content;
          
          this.setModified(false);
          this.updateStats();
          this.updateLineNumbers();
          this.updateFilename();
        } catch (err) {
          alert('Error al abrir archivo: ' + err.message);
        }
      }
      
      async save() {
        if (!this.currentPath) {
          alert('No hay archivo abierto. Selecciona uno primero.');
          return;
        }
        
        try {
          await Kernel.fs.write(this.currentPath, this.content);
          this.setModified(false);
          window.parent.Kernel.emit('toast', { 
            type: 'ok', 
            title: 'Guardado',
            message: `${this.currentPath} guardado exitosamente` 
          });
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        }
      }
      
      setModified(flag) {
        this.modified = flag;
        document.getElementById('modified').style.display = flag ? 'block' : 'none';
      }
      
      updateFilename() {
        const name = this.currentPath.split('/').pop();
        document.getElementById('filename').textContent = name || 'Sin título';
      }
      
      updateStats() {
        const textarea = document.getElementById('content');
        const content = textarea.value;
        const lines = content.split('\n').length;
        const col = content.substring(0, textarea.selectionStart).split('\n').pop().length + 1;
        
        document.getElementById('stat-line').textContent = lines;
        document.getElementById('stat-col').textContent = col;
        document.getElementById('stat-chars').textContent = content.length;
      }
      
      updateLineNumbers() {
        const textarea = document.getElementById('content');
        const lines = textarea.value.split('\n').length;
        const lineNumbers = document.getElementById('line-numbers');
        
        let html = '';
        for (let i = 1; i <= lines; i++) {
          html += i + '\n';
        }
        lineNumbers.textContent = html;
      }
    }
    
    if (Kernel.isReady) {
      new TextEditor();
    } else {
      Kernel.once('ready', () => new TextEditor());
    }
  </script>

</body>
</html>
