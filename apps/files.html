<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HuebOS · Archivos</title>
  <script type="application/json" id="wos-manifest">
  {
    "id":          "files",
    "name":        "Archivos",
    "version":     "1.0.1",
    "icon":        "./apps/public/Archivos.svg",
    "category":    "system",
    "singleton":   false,
    "description": "Explorador de archivos del sistema — pestañas, favoritos, portapapeles y vista previa",
    "winWidth":    600,
    "winHeight":   400,
    "author":      "HuebOS"
  }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00ff88; --green-dim: #00aa55; --green-faint: #003322;
      --green-dark: #001a0e; --amber: #ffb300; --red-err: #ff4444;
      --blue: #00ccff; --bg: #030a05; --border: rgba(0,255,136,0.18);
      --hover-bg: rgba(0,255,136,0.07); --sel-bg: rgba(0,255,136,0.14);
      --font: 'Share Tech Mono', monospace;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--green);
      font-family: var(--font); font-size: 13px;
      display: flex; flex-direction: column;
      user-select: none;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 5px 8px; border-bottom: 1px solid var(--border);
      background: var(--green-dark); flex-shrink: 0; row-gap: 4px;
    }
    .tb-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--green-dim); padding: 3px 7px; cursor: pointer;
      font-family: var(--font); font-size: 11px; border-radius: 2px;
      transition: all 0.12s; white-space: nowrap;
    }
    .tb-btn:hover { border-color: var(--green-dim); color: var(--green); background: var(--green-faint); }
    .tb-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .tb-btn.active { border-color: var(--green); color: var(--green); background: var(--green-faint); }
    .tb-sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
    .tb-select {
      background: var(--bg); border: 1px solid var(--border); color: var(--green-dim);
      font-family: var(--font); font-size: 11px; padding: 3px 4px; border-radius: 2px;
      cursor: pointer; outline: none;
    }
    .tb-select:hover, .tb-select:focus { border-color: var(--green-dim); color: var(--green); }
    .tb-search-wrap { position: relative; display: inline-flex; align-items: center; }
    .tb-search-icon {
      position: absolute; left: 6px; display: flex; color: var(--green-dim);
      opacity: 0.6; font-size: 11px; pointer-events: none;
    }
    .tb-search {
      background: var(--bg); border: 1px solid var(--border); color: var(--green);
      font-family: var(--font); font-size: 11px; padding: 3px 6px 3px 22px; border-radius: 2px;
      width: 130px; outline: none;
    }
    .tb-search::placeholder { color: var(--green-dim); opacity: 0.6; }
    .tb-search:focus { border-color: var(--green-dim); }

    /* ── Tab bar ── */
    #tabbar {
      display: none; align-items: center; gap: 2px; padding: 3px 6px 0;
      background: var(--green-dark); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0;
    }
    .tab-chip {
      display: flex; align-items: center; gap: 6px; padding: 4px 8px;
      font-size: 10px; color: var(--green-dim); background: rgba(0,255,136,0.03);
      border: 1px solid var(--border); border-bottom: none; border-radius: 3px 3px 0 0;
      cursor: pointer; white-space: nowrap; max-width: 140px;
    }
    .tab-chip:hover { color: var(--green); }
    .tab-chip.active { color: var(--green); background: var(--bg); border-color: var(--green-dim); }
    .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-close { opacity: 0.5; padding: 0 2px; }
    .tab-close:hover { opacity: 1; color: var(--red-err); }

    /* ── Breadcrumb ── */
    #breadcrumb {
      padding: 5px 10px; font-size: 11px; color: var(--green-dim);
      border-bottom: 1px solid var(--border); background: rgba(0,255,136,0.03);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex-shrink: 0; cursor: text;
    }
    .crumb { cursor: pointer; color: var(--green-dim); transition: color 0.1s; }
    .crumb:hover { color: var(--green); text-decoration: underline; }
    .crumb:last-child { color: var(--green); }
    .crumb.drag-over { color: var(--amber); text-decoration: underline; }
    .crumb-sep { margin: 0 3px; opacity: 0.4; }
    .path-input {
      background: var(--green-faint); border: 1px solid var(--green-dim);
      color: var(--green); font-family: var(--font); font-size: 11px;
      padding: 2px 5px; width: 100%; outline: none; border-radius: 1px;
    }

    /* ── Main layout ── */
    #main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

    /* ── Sidebar ── */
    #sidebar {
      width: 150px; flex-shrink: 0; overflow-y: auto; overflow-x: hidden;
      border-right: 1px solid var(--border); background: rgba(0,255,136,0.015);
      padding: 6px 0; display: flex; flex-direction: column;
    }
    .sb-label {
      font-size: 9px; color: var(--green-dim); opacity: 0.55; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 8px 10px 3px;
    }
    .sb-label:first-child { padding-top: 2px; }
    .sb-item {
      display: flex; align-items: center; gap: 7px; padding: 4px 10px;
      font-size: 11px; color: var(--green-dim); cursor: pointer; position: relative;
    }
    .sb-item:hover { background: var(--hover-bg); color: var(--green); }
    .sb-item.active { background: var(--sel-bg); color: var(--green); border-left: 2px solid var(--green); padding-left: 8px; }
    .sb-item.drag-over { background: rgba(255,179,0,0.12); outline: 1px dashed var(--amber); }
    .sb-icon { font-size: 12px; width: 16px; text-align: center; flex-shrink: 0; }
    .sb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-unpin { opacity: 0; font-size: 10px; padding: 0 2px; }
    .sb-item:hover .sb-unpin { opacity: 0.6; }
    .sb-unpin:hover { opacity: 1 !important; color: var(--red-err); }
    .sb-empty { font-size: 10px; color: var(--green-dim); opacity: 0.45; padding: 4px 10px; line-height: 1.4; }

    /* ── Content / file list ── */
    #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    #filelist { flex: 1; overflow-y: auto; overflow-x: hidden; }
    #filelist.grid-view { display: flex; flex-wrap: wrap; align-content: flex-start; padding: 10px; gap: 2px; }

    #empty-state {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--green-dim);
      opacity: 0.45; gap: 8px;
    }
    #empty-state.visible { display: flex; }
    #empty-state .ei { font-size: 28px; }
    #empty-state .et { font-size: 11px; }

    /* list rows */
    .file-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; cursor: pointer;
      border-bottom: 1px solid rgba(0,255,136,0.04);
      transition: background 0.1s;
    }
    .file-item:hover { background: var(--hover-bg); }
    .file-item.selected { background: var(--sel-bg); border-left: 2px solid var(--green); padding-left: 8px; }
    .file-item.drag-over { background: rgba(255,179,0,0.12); outline: 1px dashed var(--amber); outline-offset: -2px; }
    .file-item.pending { background: rgba(0,255,136,0.06); }
    .fi-icon { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; }
    .fi-name { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fi-name.is-dir { color: var(--green); }
    .fi-name.is-shortcut { color: var(--blue); }
    .fi-meta { display: flex; gap: 14px; font-size: 10px; color: var(--green-dim); opacity: 0.65; white-space: nowrap; }

    /* grid tiles */
    .grid-tile {
      width: 78px; display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 8px 4px; cursor: pointer; border-radius: 3px;
      border: 1px solid transparent;
    }
    .grid-tile:hover { background: var(--hover-bg); }
    .grid-tile.selected { background: var(--sel-bg); border-color: var(--green-dim); }
    .grid-tile.drag-over { background: rgba(255,179,0,0.12); outline: 1px dashed var(--amber); }
    .grid-tile.pending { background: rgba(0,255,136,0.06); }
    .gt-icon { font-size: 26px; margin-bottom: 4px; }
    .gt-name {
      font-size: 10px; color: var(--green-dim); line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word; width: 100%;
    }
    .grid-tile .gt-name.is-dir { color: var(--green); }

    .rename-input {
      background: var(--green-faint); border: 1px solid var(--green-dim);
      color: var(--green); font-family: var(--font); font-size: 12px;
      padding: 1px 4px; width: 140px; outline: none; border-radius: 1px;
    }
    .grid-tile .rename-input { width: 68px; font-size: 10px; text-align: center; padding: 1px 2px; }

    /* ── Preview panel ── */
    #preview-panel {
      display: none; width: 230px; flex-shrink: 0; overflow-y: auto;
      border-left: 1px solid var(--border); background: rgba(0,255,136,0.015);
      padding: 12px 10px; flex-direction: column; gap: 8px; font-size: 11px;
    }
    .panel-empty { color: var(--green-dim); opacity: 0.5; font-size: 11px; text-align: center; margin-top: 20px; line-height: 1.5; }
    .panel-header { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .panel-icon { font-size: 22px; }
    .panel-title { font-size: 12px; color: var(--green); word-break: break-word; }
    .panel-row { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--green-dim); }
    .panel-row span:first-child { opacity: 0.6; flex-shrink: 0; }
    .panel-row span:last-child { text-align: right; word-break: break-all; }
    .panel-path { font-size: 9px; }
    .panel-preview { margin-top: 6px; }
    .panel-text {
      font-size: 10px; color: var(--green-dim); white-space: pre-wrap; word-break: break-word;
      background: rgba(0,255,136,0.03); border: 1px solid var(--border); border-radius: 2px;
      padding: 6px; max-height: 220px; overflow-y: auto;
    }
    .panel-img { width: 100%; border: 1px solid var(--border); border-radius: 2px; }

    /* ── Status bar ── */
    #statusbar {
      display: flex; gap: 16px; padding: 3px 10px;
      border-top: 1px solid var(--border); background: var(--green-dark);
      font-size: 10px; color: var(--green-dim); flex-shrink: 0;
    }
    #status-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Context Menu ── */
    #ctx-menu {
      position: fixed; background: #020d06; border: 1px solid var(--border);
      z-index: 9999; min-width: 180px; display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .ctx-item {
      padding: 6px 14px; cursor: pointer; font-size: 11px;
      color: var(--green-dim); display: flex; align-items: center; gap: 8px;
    }
    .ctx-item:hover { background: var(--green-faint); color: var(--green); }
    .ctx-item .cx-icon { font-size: 12px; width: 14px; text-align: center; }
    .ctx-sep { height: 1px; background: var(--border); margin: 3px 0; }
    .ctx-label { padding: 4px 12px; font-size: 9px; color: var(--green-dim); opacity: 0.5; letter-spacing: 0.1em; text-transform: uppercase; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--green-faint); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

    /* llevo rato trabajdno en esto, traiganme un cafe, o borro su system32 >:D*/
  </style>
</head>
<body>



<div id="toolbar">
  <button class="tb-btn active" id="btn-sidebar" title="Mostrar/ocultar panel lateral"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.3"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>

  <button class="tb-btn" id="btn-home" title="Inicio"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg></button>

  <div class="tb-sep"></div>

  /* ═══════════════════════ KERNEL ACCESS ═══════════════════════ */

  let K = null;

  function getKernel() {
    if (window.parent && window.parent !== window && window.parent.Kernel && window.parent.Kernel.isReady) {
      return window.parent.Kernel;
    }
    if (window.Kernel && window.Kernel.isReady) {
      return window.Kernel;
    }
    return null;
  }

  function waitForKernel(cb) {
    const k = getKernel();
    if (k) { cb(k); return; }

    const check = () => {
      const nextKernel = getKernel();
      if (nextKernel) { cb(nextKernel); return; }
      setTimeout(check, 80);
    };

    if (window.parent !== window && window.parent.Kernel && window.parent.Kernel.once) {
      window.parent.Kernel.once('ready', () => cb(window.parent.Kernel));
      return;
    }
    setTimeout(check, 100);
  }

  function getStartPath() {
    const params = new URLSearchParams(window.location.search);
    return params.get('startPath') || params.get('path') || null;
  }

  function toast(msg, kind) {
    if (window.parent.__wos) window.parent.__wos.toast(msg, kind || 'info', 'FILES');
  }

  /* que sigues leyendo eh???, mas te vale traerme mi cafe... te estoy viendo 👀*/

  /* ═══════════════════════ STATE ═══════════════════════ */

  let tabs = [];
  let activeTabId = null;
  let tabCounter = 0;
  let pinned = [];          // array of paths
  let sidebarVisible = true;
  let panelVisible = false;
  let panelToken = 0;

  const QUICK_LOCATIONS = [
    { path: '/home',           name: 'Inicio',      icon: Icon.home },
    { path: '/home/desktop',   name: 'Escritorio',  icon: Icon.desktop },
    { path: '/home/docs',      name: 'Documentos',  icon: Icon.file },
    { path: '/home/media',     name: 'Multimedia',  icon: Icon.fileVideo },
    { path: '/home/downloads', name: 'Descargas',   icon: Icon.download },
    { path: '/temp',           name: 'Temporal',    icon: Icon.trash },
    { path: '/system',         name: 'Sistema',     icon: Icon.shield },
    { path: '/',                name: 'Raíz',        icon: '╱' },
  ];

  function createTab(path) {
    tabCounter++;
    return {
      id: 'tab' + tabCounter,
      cwd: path,
      history: [path],
      historyIndex: 0,
      viewMode: 'list',
      sortBy: 'name',
      sortDir: 'asc',
      search: '',
      selection: new Set(),
      anchorId: null,
      rawItems: [],
      displayItems: [],
      pendingCreate: null,
    };
  }

  function activeTab() { return tabs.find(t => t.id === activeTabId); }

  /* ═══════════════════════ DOM refs ═══════════════════════ */

  const toolbarEl   = document.getElementById('toolbar');
  const tabbarEl     = document.getElementById('tabbar');
  const breadcrumbEl = document.getElementById('breadcrumb');
  const sidebarEl    = document.getElementById('sidebar');
  const filelistEl   = document.getElementById('filelist');
  const emptyEl      = document.getElementById('empty-state');
  const emptyIcon    = document.getElementById('empty-icon');
  const emptyText    = document.getElementById('empty-text');
  const panelEl      = document.getElementById('preview-panel');
  const statusPath   = document.getElementById('status-path');
  const statusCount  = document.getElementById('status-count');
  const statusSel    = document.getElementById('status-sel');
  const ctxMenu      = document.getElementById('ctx-menu');
  const searchInput  = document.getElementById('search-input');
  const sortSelect   = document.getElementById('sort-select');
  const $ = sel => document.querySelector(sel);

  /* ═══════════════════════ NAVIGATION ═══════════════════════ */

  function navigate(path, opts = {}) {
    const tab = activeTab();
    const norm = K.fs.normalize(path) || '/';
    tab.cwd = norm;
    tab.selection.clear();
    tab.anchorId = null;
    tab.search = '';
    tab.pendingCreate = null;
    if (opts.pushHistory !== false) {
      tab.history = tab.history.slice(0, tab.historyIndex + 1);
      tab.history.push(norm);
      tab.historyIndex = tab.history.length - 1;
    }
    refresh();
  }

  function goBack() {
    const tab = activeTab();
    if (tab.historyIndex <= 0) return;
    tab.historyIndex--;
    tab.cwd = tab.history[tab.historyIndex];
    tab.selection.clear();
    refresh();
  }

  function goForward() {
    const tab = activeTab();
    if (tab.historyIndex >= tab.history.length - 1) return;
    tab.historyIndex++;
    tab.cwd = tab.history[tab.historyIndex];
    tab.selection.clear();
    refresh();
  }

  /* ═══════════════════════ TABS ═══════════════════════ */

  function addTab(path) {
    const norm = K.fs.normalize(path || '/home') || '/home';
    const t = createTab(norm);
    tabs.push(t);
    activeTabId = t.id;
    refresh();
  }

  function closeTab(tabId) {
    if (tabs.length <= 1) return;
    const idx = tabs.findIndex(t => t.id === tabId);
    if (idx === -1) return;
    tabs.splice(idx, 1);
    if (activeTabId === tabId) activeTabId = tabs[Math.max(0, idx - 1)].id;
    refresh();
  }

  function switchTab(tabId) {
    if (tabId === activeTabId) return;
    activeTabId = tabId;
    refresh();
  }

  function renderTabBar() {
    tabbarEl.innerHTML = '';
    tabbarEl.style.display = tabs.length > 1 ? 'flex' : 'none';
    if (tabs.length <= 1) return;
    tabs.forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'tab-chip' + (t.id === activeTabId ? ' active' : '');
      const label = t.cwd === '/home' ? 'Inicio' : (K.fs.basename(t.cwd) || t.cwd);
      chip.innerHTML = `<span class="tab-name">${escapeHtml(label)}</span><span class="tab-close" title="Cerrar pestaña">✕</span>`;
      chip.addEventListener('click', () => switchTab(t.id));
      chip.querySelector('.tab-close').addEventListener('click', e => { e.stopPropagation(); closeTab(t.id); });
      tabbarEl.appendChild(chip);
    });
  }

  /* ═══════════════════════ PINNED / FAVORITES ═══════════════════════ */

  async function loadPinned() {
    pinned = await K.prefs.get('files.pinned', []);
    if (!Array.isArray(pinned)) pinned = [];
  }

  async function savePinned() {
    await K.prefs.set('files.pinned', pinned);
  }

  async function togglePin(path) {
    const idx = pinned.indexOf(path);
    if (idx >= 0) pinned.splice(idx, 1);
    else pinned.push(path);
    await savePinned();
    renderSidebar();
    updateToolbarState();
  }

  /* ═══════════════════════ SIDEBAR ═══════════════════════ */

  function renderSidebar() {
    sidebarEl.style.display = sidebarVisible ? 'flex' : 'none';
    if (!sidebarVisible) return;
    const tab = activeTab();
    sidebarEl.innerHTML = '';

    const locLabel = document.createElement('div');
    locLabel.className = 'sb-label';
    locLabel.textContent = 'Ubicaciones';
    sidebarEl.appendChild(locLabel);

    QUICK_LOCATIONS.forEach(loc => {
      sidebarEl.appendChild(buildSidebarRow(loc.path, loc.name, loc.icon, tab.cwd === loc.path, false));
    });

    const favLabel = document.createElement('div');
    favLabel.className = 'sb-label';
    favLabel.textContent = 'Favoritos';
    sidebarEl.appendChild(favLabel);

    if (!pinned.length) {
      const empty = document.createElement('div');
      empty.className = 'sb-empty';
      empty.textContent = 'Ancla carpetas desde el menú contextual, o arrastra un elemento aquí.';
      sidebarEl.appendChild(empty);
    } else {
      pinned.forEach(path => {
        const name = K.fs.basename(path) || path;
        sidebarEl.appendChild(buildSidebarRow(path, name, Icon.starFilled, tab.cwd === path, true));
      });
    }
  }

  function buildSidebarRow(path, name, icon, active, unpinnable) {
    const row = document.createElement('div');
    row.className = 'sb-item' + (active ? ' active' : '');
    row.innerHTML = `<span class="sb-icon">${icon}</span><span class="sb-name" title="${escapeHtml(path)}">${escapeHtml(name)}</span>` +
      (unpinnable ? `<span class="sb-unpin" title="Quitar de favoritos">✕</span>` : '');
    row.addEventListener('click', () => navigate(path));
    row.addEventListener('dragover', e => {
      if (!e.dataTransfer.types.includes('text/x-huebos-paths')) return;
      e.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', async e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('text/x-huebos-paths');
      if (raw) await moveItemsTo(JSON.parse(raw), path);
    });
    if (unpinnable) {
      row.querySelector('.sb-unpin').addEventListener('click', e => { e.stopPropagation(); togglePin(path); });
    }
    return row;
  }

  /* ═══════════════════════ BREADCRUMB ═══════════════════════ */

  function renderBreadcrumb() {
    const tab = activeTab();
    if (tab.cwd === '/') {
      breadcrumbEl.innerHTML = `<span class="crumb" data-path="/">╱</span>`;
    } else {
      const parts = tab.cwd.split('/').filter(Boolean);
      let acc = '';
      let html = `<span class="crumb" data-path="/">╱</span>`;
      parts.forEach(p => {
        acc += '/' + p;
        html += `<span class="crumb-sep">›</span><span class="crumb" data-path="${escapeHtml(acc)}">${escapeHtml(p)}</span>`;
      });
      breadcrumbEl.innerHTML = html;
    }
    breadcrumbEl.querySelectorAll('.crumb').forEach(el => {
      const path = el.dataset.path;
      el.addEventListener('click', () => navigate(path));
      el.addEventListener('dragover', e => {
        if (!e.dataTransfer.types.includes('text/x-huebos-paths')) return;
        e.preventDefault();
        el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', async e => {
        e.preventDefault();
        el.classList.remove('drag-over');
        const raw = e.dataTransfer.getData('text/x-huebos-paths');
        if (raw) await moveItemsTo(JSON.parse(raw), path);
      });
    });
  }

  breadcrumbEl.addEventListener('dblclick', e => {
    if (e.target.classList.contains('crumb')) return;
    startPathEdit();
  });

  function startPathEdit() {
    const tab = activeTab();
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'path-input';
    input.value = tab.cwd;
    breadcrumbEl.innerHTML = '';
    breadcrumbEl.appendChild(input);
    input.focus();
    input.select();
    let committed = false;
    const commit = () => {
      if (committed) return;
      committed = true;
      const val = input.value.trim();
      if (val) navigate(val); else renderBreadcrumb();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { committed = true; e.preventDefault(); renderBreadcrumb(); }
    });
  }

  /* ═══════════════════════ REFRESH ═══════════════════════ */

  async function refresh() {
    const tab = activeTab();
    try {
      const stat = await K.fs.stat(tab.cwd);
      if (!stat || stat.type !== 'dir') tab.cwd = '/home';
      tab.rawItems = await K.fs.readdir(tab.cwd);
    } catch {
      tab.cwd = '/home';
      try { tab.rawItems = await K.fs.readdir(tab.cwd); }
      catch { tab.rawItems = []; }
    }

    searchInput.value = tab.search;
    sortSelect.value = tab.sortBy;
    $('#btn-sortdir').textContent = tab.sortDir === 'asc' ? '⬆' : '⬇';
    $('#btn-view').innerHTML = tab.viewMode === 'grid' ? Icon.listView : Icon.gridView;

    renderTabBar();
    renderBreadcrumb();
    renderSidebar();
    renderList();
    renderStatus();
    updateToolbarState();
    if (panelVisible) renderPanel();
  }

  /* ═══════════════════════ SORT / FILTER ═══════════════════════ */

  function extOf(name) {
    const i = name.lastIndexOf('.');
    return i > 0 ? name.slice(i + 1).toLowerCase() : '';
  }

  function sortItems(list, sortBy, sortDir) {
    const dir = sortDir === 'asc' ? 1 : -1;
    return [...list].sort((a, b) => {
      if (a.type !== b.type && (a.type === 'dir' || b.type === 'dir')) {
        return a.type === 'dir' ? -1 : 1;
      }
      let cmp = 0;
      switch (sortBy) {
        case 'size': cmp = (a.size || 0) - (b.size || 0); break;
        case 'date': cmp = (a.mtime || 0) - (b.mtime || 0); break;
        case 'type': cmp = extOf(a.name).localeCompare(extOf(b.name)) || a.name.localeCompare(b.name); break;
        default: cmp = a.name.localeCompare(b.name);
      }
      return cmp * dir;
    });
  }

  function getFiltered(tab) {
    let list = tab.rawItems;
    if (tab.search) {
      const q = tab.search.toLowerCase();
      list = list.filter(it => it.name.toLowerCase().includes(q));
    }
    return sortItems(list, tab.sortBy, tab.sortDir);
  }

  /* ═══════════════════════ RENDER LIST ═══════════════════════ */

  function renderList() {
    const tab = activeTab();
    const display = getFiltered(tab);
    tab.displayItems = display;

    filelistEl.className = 'filelist ' + (tab.viewMode === 'grid' ? 'grid-view' : 'list-view');
    filelistEl.innerHTML = '';

    let hasContent = false;

    if (tab.pendingCreate) {
      filelistEl.appendChild(buildPendingRow(tab.pendingCreate.type, tab.viewMode));
      hasContent = true;
    }

    if (display.length) {
      hasContent = true;
      display.forEach(item => {
        const el = tab.viewMode === 'grid' ? buildGridTile(item) : buildListRow(item);
        attachItemEvents(el, item);
        filelistEl.appendChild(el);
      });
    }

    if (!hasContent) {
      filelistEl.style.display = 'none';
      emptyEl.classList.add('visible');
      emptyIcon.innerHTML = tab.search ? Icon.search : Icon.folderOpen;
      emptyText.textContent = tab.search
        ? `Sin resultados para "${tab.search}"`
        : 'Directorio vacío — clic derecho para crear algo aquí';
    } else {
      filelistEl.style.display = tab.viewMode === 'grid' ? 'flex' : 'block';
      emptyEl.classList.remove('visible');
    }

    applySelectionClasses();
  }

  function buildListRow(item) {
    const row = document.createElement('div');
    row.className = 'file-item entry';
    row.dataset.id = item.id;
    row.draggable = true;
    const isShortcut = item.type === 'shortcut' || item.meta?.isDesktopShortcut;
    const icon = item.type === 'dir' ? Icon.folder : isShortcut ? Icon.link : getIcon(item.name);
    const sizeStr = item.type !== 'dir' ? fmtSize(item.size) : '—';
    const dateStr = fmtDate(item.mtime);
    const pinMark = pinned.includes(item.id) ? ' ' + Icon.starFilled : '';
    row.innerHTML = `
      <span class="fi-icon">${icon}</span>
      <span class="fi-name ${item.type === 'dir' ? 'is-dir' : ''} ${isShortcut ? 'is-shortcut' : ''}" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}${item.type === 'dir' ? '/' : ''}${isShortcut ? ' ' + Icon.bolt : ''}${pinMark}</span>
      <div class="fi-meta">
        <span>${sizeStr}</span>
        <span>${dateStr}</span>
      </div>
    `;
    return row;
  }

  function buildGridTile(item) {
    const tile = document.createElement('div');
    tile.className = 'grid-tile entry';
    tile.dataset.id = item.id;
    tile.draggable = true;
    const isShortcut = item.type === 'shortcut' || item.meta?.isDesktopShortcut;
    const icon = item.type === 'dir' ? Icon.folder : isShortcut ? Icon.link : getIcon(item.name);
    const pinMark = pinned.includes(item.id) ? ' ' + Icon.starFilled : '';
    tile.title = `${item.name}${item.type === 'dir' ? '' : ' — ' + fmtSize(item.size)}`;
    tile.innerHTML = `
      <span class="gt-icon">${icon}</span>
      <span class="gt-name ${item.type === 'dir' ? 'is-dir' : ''}">${escapeHtml(item.name)}${pinMark}</span>
    `;
    return tile;
  }

  function attachItemEvents(el, item) {
    el.addEventListener('click', e => { e.stopPropagation(); handleItemClick(item, e); });
    el.addEventListener('dblclick', () => openItem(item));
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      e.stopPropagation();
      const tab = activeTab();
      if (!tab.selection.has(item.id)) {
        tab.selection.clear();
        tab.selection.add(item.id);
        tab.anchorId = item.id;
        applySelectionClasses();
        renderStatus();
        updateToolbarState();
        if (panelVisible) renderPanel();
      }
      showCtx(e.clientX, e.clientY, item);
    });
    el.addEventListener('dragstart', e => {
      const tab = activeTab();
      const ids = (tab.selection.has(item.id) && tab.selection.size > 1) ? [...tab.selection] : [item.id];
      e.dataTransfer.setData('text/x-huebos-paths', JSON.stringify(ids));
      e.dataTransfer.effectAllowed = 'move';
    });
    if (item.type === 'dir') {
      el.addEventListener('dragover', e => {
        if (!e.dataTransfer.types.includes('text/x-huebos-paths')) return;
        e.preventDefault();
        el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', async e => {
        e.preventDefault();
        el.classList.remove('drag-over');
        const raw = e.dataTransfer.getData('text/x-huebos-paths');
        if (!raw) return;
        await moveItemsTo(JSON.parse(raw), item.id);
      });
    }
  }

  function handleItemClick(item, e) {
    const tab = activeTab();
    if (e.shiftKey && tab.anchorId) {
      const ids = tab.displayItems.map(i => i.id);
      const a = ids.indexOf(tab.anchorId);
      const b = ids.indexOf(item.id);
      if (a !== -1 && b !== -1) {
        const [from, to] = a < b ? [a, b] : [b, a];
        tab.selection.clear();
        for (let i = from; i <= to; i++) tab.selection.add(ids[i]);
      }
    } else if (e.ctrlKey || e.metaKey) {
      if (tab.selection.has(item.id)) tab.selection.delete(item.id);
      else tab.selection.add(item.id);
      tab.anchorId = item.id;
    } else {
      tab.selection.clear();
      tab.selection.add(item.id);
      tab.anchorId = item.id;
    }
    applySelectionClasses();
    renderStatus();
    updateToolbarState();
    if (panelVisible) renderPanel();
  }

  function applySelectionClasses() {
    const tab = activeTab();
    filelistEl.querySelectorAll('.entry').forEach(el => {
      el.classList.toggle('selected', tab.selection.has(el.dataset.id));
    });
  }

  filelistEl.addEventListener('click', e => {
    if (e.target !== filelistEl) return;
    const tab = activeTab();
    tab.selection.clear();
    applySelectionClasses();
    renderStatus();
    updateToolbarState();
    if (panelVisible) renderPanel();
  });

  filelistEl.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('text/x-huebos-paths')) return;
    if (e.target.closest('.entry')) return; // el propio item ya gestiona su drop
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  filelistEl.addEventListener('drop', async e => {
    if (e.target.closest('.entry')) return;
    const raw = e.dataTransfer.getData('text/x-huebos-paths');
    if (!raw) return;
    e.preventDefault();
    await moveItemsTo(JSON.parse(raw), activeTab().cwd);
  });

  function selectAll() {
    const tab = activeTab();
    tab.selection = new Set(tab.displayItems.map(i => i.id));
    tab.anchorId = tab.displayItems.length ? tab.displayItems[tab.displayItems.length - 1].id : null;
    applySelectionClasses();
    renderStatus();
    updateToolbarState();
    if (panelVisible) renderPanel();
  }

  /* ═══════════════════════ OPEN ITEM ═══════════════════════ */

  async function openItem(item) {
    if (item.type === 'dir') { navigate(item.id); return; }
    if (item.type === 'shortcut' && item.meta?.appId) {
      const app = await K.apps.get(item.meta.appId);
if (app) {
  window.parent.__wos?.launch(item.meta.appId, { startPath: item.id });
} else {
  toast(`La app "${item.meta.appId}" ya no está disponible.`, 'warn');
}
      return;
    }
    const ext = item.name.split('.').pop().toLowerCase();
    const textExts = new Set(['txt','md','js','ts','html','css','json','csv','log','sh','py','xml','yaml','yml','ini','cfg','conf','env','gitignore']);
    if (textExts.has(ext)) { launchEditor(item.id); return; }

    if (K.openFile) {
      try {
        const result = await K.openFile(item.id);
        if (result && result.ok) return;
      } catch { /* fall through to details panel */ }
    }
    const tab = activeTab();
    tab.selection.clear();
    tab.selection.add(item.id);
    applySelectionClasses();
    panelVisible = true;
    renderPanelUI();
    renderPanel();
  }

  function launchEditor(filePath) {
    if (window.parent.__wos) window.parent.__wos.launch('text-editor', { filePath });
    else K.emit('shell:launch', { appId: 'text-editor', filePath });
  }

  /* ═══════════════════════ CLIPBOARD (COPIAR/CORTAR/PEGAR) ═══════════════════════ */

  function copySelection() {
    const tab = activeTab();
    if (!tab.selection.size) return;
    const isProtectedId = id => id === '/system' || id.startsWith('/system/');
    const ids = [...tab.selection];
    const blocked = ids.filter(isProtectedId);
    const allowed = ids.filter(id => !isProtectedId(id));
    if (blocked.length) toast('Los elementos de /system no se pueden copiar — usa "Copiar acceso directo".', 'warn');
    if (!allowed.length) return;
    cleanupPendingShortcutTemp().catch(() => {});
    const { paths } = K.clipboard.copy(allowed);
    renderStatus();
    updateToolbarState();
    toast(`${paths.length} elemento(s) copiados`);
  }

  function cutSelection() {
    const tab = activeTab();
    if (!tab.selection.size) return;
    cleanupPendingShortcutTemp().catch(() => {});
    const { paths } = K.clipboard.cut([...tab.selection]);
    renderStatus();
    updateToolbarState();
    toast(`${paths.length} elemento(s) listos para mover`);
  }

  function splitNameExt(name) {
    const idx = name.lastIndexOf('.');
    if (idx <= 0) return [name, ''];
    return [name.slice(0, idx), name.slice(idx)];
  }

  function appendCopySuffix(name) {
    const [base, ext] = splitNameExt(name);
    return `${base} (copia)${ext}`;
  }

  async function uniqueName(dirPath, name) {
    if (!(await K.fs.exists(dirPath + '/' + name))) return name;
    const [base, ext] = splitNameExt(name);
    let n = 2, candidate;
    do {
      candidate = `${base} (${n})${ext}`;
      n++;
    } while (await K.fs.exists(dirPath + '/' + candidate));
    return candidate;
  }

  async function copyRecursive(srcPath, destPath) {
    const stat = await K.fs.stat(srcPath);
    if (!stat) throw new Error('Origen no encontrado');
    if (stat.type === 'dir') {
      await K.fs.mkdir(destPath);
      const children = await K.fs.readdir(srcPath);
      for (const child of children) {
        await copyRecursive(child.id, destPath + '/' + child.name);
      }
      return;
    }
    if (stat.type === 'shortcut') {
      await K.fs.createShortcut(destPath, {
        appId: stat.meta?.appId,
        name: stat.name,
        icon: stat.icon,
        entry: stat.meta?.entry ?? null,
        metadata: { ...(stat.meta || {}) },
      });
      return;
    }
    if (await K.fs.isBinary(srcPath)) {
      const blob = await K.fs.readBlob(srcPath);
      const mime = await K.fs.getMime(srcPath);
      await K.fs.writeBinary(destPath, blob, mime);
    } else {
      const content = await K.fs.read(srcPath);
      await K.fs.write(destPath, content);
    }
  }

  async function pasteClipboard() {
    const { op, paths } = K.clipboard.get();
    if (!op || !paths.length) return;
    const tab = activeTab();
    const destDir = tab.cwd;
    let errors = 0;
    const succeeded = [];
    for (const srcPath of paths) {
      const srcDir = K.fs.dirname(srcPath);
      const name = K.fs.basename(srcPath);
      try {
        if (op === 'copy') {
          let targetName = name;
          if (srcDir === destDir || await K.fs.exists(destDir + '/' + targetName)) {
            targetName = await uniqueName(destDir, appendCopySuffix(name));
          }
          await copyRecursive(srcPath, destDir + '/' + targetName);
        } else {
          if (srcDir === destDir) continue;
          let targetName = name;
          if (await K.fs.exists(destDir + '/' + targetName)) {
            targetName = await uniqueName(destDir, targetName);
          }
          await K.fs.move(srcPath, destDir + '/' + targetName);
        }
        succeeded.push(srcPath);
      } catch (e) { errors++; }
    }
    if (op === 'cut') K.clipboard.clear();
if (errors) toast(`${errors} elemento(s) no se pudieron pegar.`, 'error');
else toast('Pegado correctamente', 'ok');
    if (op === 'copy') await cleanupPastedTempShortcuts(succeeded);
    refresh();
  }

  async function duplicateSelection() {
    const tab = activeTab();
    if (!tab.selection.size) return;
    let errors = 0;
    for (const id of tab.selection) {
      const it = tab.rawItems.find(i => i.id === id);
      if (!it) continue;
      const targetName = await uniqueName(tab.cwd, appendCopySuffix(it.name));
      try { await copyRecursive(it.id, tab.cwd + '/' + targetName); }
      catch (e) { errors++; }
    }
    if (errors) toast(`${errors} elemento(s) no se pudieron duplicar.`, 'error');
    refresh();
  }

  async function moveItemsTo(ids, destDir) {
    let errors = 0, moved = 0;
    for (const id of ids) {
      if (id === destDir) continue;
      const srcDir = K.fs.dirname(id);
      if (srcDir === destDir) continue;
      const name = K.fs.basename(id);
      try {
        let targetName = name;
        if (await K.fs.exists(destDir + '/' + targetName)) {
          targetName = await uniqueName(destDir, targetName);
        }
        await K.fs.move(id, destDir + '/' + targetName);
        moved++;
      } catch (e) { errors++; }
    }
if (errors) toast(`${errors} elemento(s) no se pudieron mover.`, 'error');
else if (moved) toast(`${moved} elemento(s) movidos`, 'ok');
    refresh();
  }

  /* ═══════════════════════ DESKTOP SHORTCUTS ═══════════════════════ */

  function isSysItem(it) {
    return !!it && it.type !== 'dir' && (it.name || '').toLowerCase().endsWith('.sys');
  }

  function iconForShortcutItem(item) {
    const isShortcut = item.type === 'shortcut' || item.meta?.isDesktopShortcut;
    if (item.type === 'dir') return Icon.folder;
    if (isShortcut) return Icon.link;
    return getIcon(item.name);
  }

  async function buildShortcutTarget(p, destDir) {
    const item = await K.fs.stat(p);
    if (!item) return null;
    if (isSysItem(item)) return null;
    const isShortcut = item.type === 'shortcut' || item.meta?.isDesktopShortcut;
    const isExe = !isShortcut && item.type === 'file' && (item.name || '').endsWith('.exe') && !!item.meta?.appId;
    let appId, entry = null, filePath = null, startPath = null;
    const icon = item.meta?.icon || item.icon || iconForShortcutItem(item);
    const name = item.name || p.split('/').pop();
    if (isShortcut || isExe) {
      appId = item.meta?.appId; entry = item.meta?.entry || null;
    } else if (item.type === 'dir') {
      appId = 'files'; startPath = p;
    } else {
      const ext = K.extensions.getExtension(p);
      const resolved = K.extensions.resolve(ext);
      if (!resolved) return { error: `Sin app asociada a "${name}"` };
      appId = resolved.handler; filePath = p;
    }
    if (!appId) return { error: `No se pudo crear acceso a "${name}"` };
    let target = `${destDir}/${name} - acceso directo`;
    let n = 1;
    while (await K.fs.exists(target)) { target = `${destDir}/${name} - acceso directo (${++n})`; }
    return { target, appId, name, icon, entry, filePath, startPath };
  }

  async function createShortcutsAt(ids, destDir) {
    if (!ids || !ids.length) return 0;
    let count = 0, skipped = 0;
    for (const p of ids) {
      try {
        const spec = await buildShortcutTarget(p, destDir);
        if (!spec) { skipped++; continue; }
        if (spec.error) { toast(spec.error, 'warn'); skipped++; continue; }
        await K.fs.createShortcut(spec.target, {
          appId: spec.appId, name: spec.name, icon: spec.icon, entry: spec.entry,
          metadata: { isDesktopShortcut: true, protected: false, systemApp: false, filePath: spec.filePath, startPath: spec.startPath },
        });
        count++;
      } catch (err) {
        toast(err.message || 'No se pudo crear el acceso directo', 'error');
      }
    }
    if (!count && skipped) toast('No se pudo crear ningún acceso directo (¿archivos .sys?)', 'warn');
    return count;
  }

  async function createDesktopShortcuts(ids) {
    const count = await createShortcutsAt(ids, '/home/desktop');
    if (count) toast(`${count} acceso(s) directo(s) creado(s) en el escritorio`, 'ok');
  }

  async function getPendingShortcutTemp() {
    const list = await K.prefs.get('files.pendingShortcutTemp', []);
    return Array.isArray(list) ? list : [];
  }

  async function cleanupPendingShortcutTemp() {
    const list = await getPendingShortcutTemp();
    if (!list.length) return;
    for (const p of list) { try { await K.fs.remove(p); } catch (e) {} }
    await K.prefs.set('files.pendingShortcutTemp', []);
  }

  async function cleanupPastedTempShortcuts(pastedPaths) {
    if (!pastedPaths || !pastedPaths.length) return;
    const pending = await getPendingShortcutTemp();
    if (!pending.length) return;
    const matched = pastedPaths.filter(p => pending.includes(p));
    if (!matched.length) return;
    for (const p of matched) { try { await K.fs.remove(p); } catch (e) {} }
    const remaining = pending.filter(p => !matched.includes(p));
    await K.prefs.set('files.pendingShortcutTemp', remaining);
  }

  async function copyShortcutSelection(ids) {
    const validIds = (ids || []).filter(Boolean);
    if (!validIds.length) return;
    await cleanupPendingShortcutTemp();
    const tempDir = '/temp';
    try { if (!(await K.fs.exists(tempDir))) await K.fs.mkdir(tempDir); } catch (e) {}

    const tempPaths = [];
    let skipped = 0;
    for (const p of validIds) {
      const item = await K.fs.stat(p).catch(() => null);
      if (!item || isSysItem(item)) { skipped++; continue; }
      const spec = await buildShortcutTarget(p, tempDir);
      if (!spec) { skipped++; continue; }
      if (spec.error) { toast(spec.error, 'warn'); skipped++; continue; }
      try {
        await K.fs.createShortcut(spec.target, {
          appId: spec.appId, name: spec.name, icon: spec.icon, entry: spec.entry,
          metadata: { isDesktopShortcut: true, protected: false, systemApp: false, filePath: spec.filePath, startPath: spec.startPath },
        });
        tempPaths.push(spec.target);
      } catch (err) {
        toast(err.message || 'No se pudo crear el acceso directo', 'error');
      }
    }
    if (!tempPaths.length) {
      toast('No se pudo crear ningún acceso directo (¿archivos .sys?)', 'warn');
      return;
    }
    await K.prefs.set('files.pendingShortcutTemp', tempPaths);
    K.clipboard.copy(tempPaths);
    renderStatus();
    updateToolbarState();
    toast(`${tempPaths.length} acceso(s) directo(s) listo(s) para pegar`, 'ok');
  }

  /* ═══════════════════════ CREATE / RENAME / DELETE ═══════════════════════ */

  function startCreate(type) {
    const tab = activeTab();
    tab.pendingCreate = { type };
    renderList();
  }

  function buildPendingRow(type, mode) {
    const isGrid = mode === 'grid';
    const el = document.createElement('div');
    el.className = isGrid ? 'grid-tile pending' : 'file-item pending';
    const icon = type === 'dir' ? Icon.folder : Icon.file;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename-input';
    input.value = type === 'dir' ? 'Nueva carpeta' : 'nuevo-archivo.txt';

    if (isGrid) {
      const iconSpan = document.createElement('span');
      iconSpan.className = 'gt-icon';
      iconSpan.innerHTML = icon;
      const wrap = document.createElement('span');
      wrap.className = 'gt-name';
      wrap.appendChild(input);
      el.append(iconSpan, wrap);
    } else {
      const iconSpan = document.createElement('span');
      iconSpan.className = 'fi-icon';
      iconSpan.innerHTML = icon;
      const wrap = document.createElement('span');
      wrap.className = 'fi-name';
      wrap.appendChild(input);
      const meta = document.createElement('div');
      meta.className = 'fi-meta';
      el.append(iconSpan, wrap, meta);
    }

    requestAnimationFrame(() => {
      input.focus();
      const dotIdx = input.value.lastIndexOf('.');
      if (type !== 'dir' && dotIdx > 0) input.setSelectionRange(0, dotIdx);
      else input.select();
    });

    let committed = false;
    const commit = async () => {
      if (committed) return;
      committed = true;
      const tab = activeTab();
      const name = input.value.trim().replace(/\//g, '');
      tab.pendingCreate = null;
      if (!name) { refresh(); return; }
      const target = tab.cwd + '/' + name;
      try {
if (await K.fs.exists(target)) { toast(`Ya existe "${name}" en esta carpeta.`, 'warn'); refresh(); return; }
        if (type === 'dir') await K.fs.mkdir(target);
        else await K.fs.write(target, '');
        refresh();
} catch (e) {
  toast('Error: ' + e.message, 'error');
  refresh();
}
    };
    const cancel = () => {
      if (committed) return;
      committed = true;
      activeTab().pendingCreate = null;
      refresh();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    return el;
  }

  function startRename(item) {
    const row = filelistEl.querySelector(`[data-id="${item.id}"]`);
    if (!row) return;
    const nameEl = row.querySelector('.fi-name, .gt-name');
    if (!nameEl) return;
    const oldName = item.name;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename-input';
    input.value = oldName;
    nameEl.innerHTML = '';
    nameEl.appendChild(input);
    input.focus();
    const dotIdx = oldName.lastIndexOf('.');
    if (item.type !== 'dir' && dotIdx > 0) input.setSelectionRange(0, dotIdx);
    else input.select();

    let committed = false;
    const commit = async () => {
      if (committed) return;
      committed = true;
      const newName = input.value.trim().replace(/\//g, '');
      if (newName && newName !== oldName) {
        const parentDir = K.fs.dirname(item.id);
        const newPath = parentDir === '/' ? '/' + newName : parentDir + '/' + newName;
        try {
          const collision = await K.fs.stat(newPath);
if (collision && collision.type !== item.type) {
  toast(`Ya existe "${newName}" y es de otro tipo (${collision.type === 'dir' ? 'carpeta' : 'archivo'}). No se puede renombrar.`, 'warn');
  refresh();
  return;
}
if (collision) {
  const ok = await window.parent.__wos?.confirm(`Ya existe "${newName}" en esta carpeta. ¿Sobrescribirlo?`, { title: 'Sobrescribir' });
  if (!ok) { refresh(); return; }
}
          await K.fs.move(item.id, newPath);
        } catch (e) { toast('Error al renombrar: ' + e.message, 'error'); }
      }
      refresh();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') { committed = true; refresh(); }
    });
  }

  async function deleteSelected() {
    const tab = activeTab();
    if (!tab.selection.size) return;
    const ids = [...tab.selection];
    const isProtected = id => id === '/system' || id.startsWith('/system/');
if (ids.some(isProtected)) {
  toast('Uno o más elementos están protegidos por el sistema y no se pueden eliminar.', 'warn');
  return;
}
    const names = ids.map(id => tab.rawItems.find(i => i.id === id)?.name || id);
const msg = ids.length === 1
  ? `¿Eliminar "${names[0]}"?`
  : `¿Eliminar ${ids.length} elementos?<br>${names.slice(0, 5).join(', ')}${names.length > 5 ? '…' : ''}`;
const ok = await window.parent.__wos?.confirm(msg, { title: 'Eliminar' });
if (!ok) return;

    let errors = 0;
    for (const id of ids) {
      const it = tab.rawItems.find(i => i.id === id);
      try { await K.fs.remove(id, { recursive: it?.type === 'dir' }); }
      catch (e) { errors++; }
    }
    tab.selection.clear();
if (errors) toast(`${errors} elemento(s) no se pudieron eliminar.`, 'error');
else toast(`${ids.length} elemento(s) eliminado(s)`, 'ok');
    refresh();
  }

  function copyPath(path) {
    if (navigator.clipboard) navigator.clipboard.writeText(path).catch(() => {});
    toast(`Ruta copiada: ${path}`);
  }

  /* ═══════════════════════ CONTEXT MENUS ═══════════════════════ */

  function renderCtxMenu(x, y, menuItems, labelText) {
    ctxMenu.innerHTML = '';
    ctxMenu.appendChild(Object.assign(document.createElement('div'), { className: 'ctx-label', textContent: labelText }));
    menuItems.forEach(mi => {
      if (mi === 'sep') { ctxMenu.appendChild(document.createElement('div')).className = 'ctx-sep'; return; }
      const d = document.createElement('div');
      d.className = 'ctx-item';
      d.innerHTML = `<span class="cx-icon">${mi.icon}</span>${mi.text}`;
      d.addEventListener('click', () => { hideCtx(); mi.action(); });
      ctxMenu.appendChild(d);
    });
    ctxMenu.style.display = 'block';
    const vw = window.innerWidth, vh = window.innerHeight;
    let lx = x, ly = y;
    if (lx + 200 > vw) lx = vw - 202;
    if (ly + ctxMenu.offsetHeight + 10 > vh) ly = Math.max(0, vh - ctxMenu.offsetHeight - 10);
    ctxMenu.style.left = lx + 'px';
    ctxMenu.style.top = ly + 'px';
  }

  function showCtx(x, y, item) {
    const tab = activeTab();
    const multi = tab.selection.size > 1;
    const isProtected = item.id === '/system' || item.id.startsWith('/system/');
    const menuItems = [];

    if (!multi) {
      if (item.type === 'dir') {
        menuItems.push({ icon: Icon.folderOpen, text: 'Abrir', action: () => navigate(item.id) });
        menuItems.push({ icon: Icon.newWindow, text: 'Abrir en pestaña nueva', action: () => addTab(item.id) });
      } else if (item.type === 'shortcut' && item.meta?.appId) {
        menuItems.push({ icon: Icon.rocket, text: 'Abrir acceso', action: () => openItem(item) });
      } else {
        const ext = item.name.split('.').pop().toLowerCase();
        const editorExts = new Set(['txt','md','js','html','css','json','sh','py','xml','yaml','yml','log','ini','cfg','env']);
        if (editorExts.has(ext)) {
          menuItems.push({ icon: Icon.fileEdit, text: 'Abrir en Editor', action: () => launchEditor(item.id) });
        }
        menuItems.push({ icon: Icon.eye, text: 'Ver contenido', action: () => { panelVisible = true; renderPanelUI(); renderPanel(); } });
      }
      menuItems.push('sep');
    }

    if (!isProtected) menuItems.push({ icon: Icon.clipboard, text: 'Copiar', action: () => copySelection() });
    if (!isProtected) menuItems.push({ icon: Icon.scissors, text: 'Cortar', action: () => cutSelection() });
    if (K.clipboard.get().paths.length) menuItems.push({ icon: Icon.paste, text: 'Pegar aquí', action: () => pasteClipboard() });
    if (!multi && !isProtected) menuItems.push({ icon: Icon.duplicate, text: 'Duplicar', action: () => duplicateSelection() });

    const shortcutIds = multi
      ? [...tab.selection].filter(id => !isSysItem(tab.rawItems.find(i => i.id === id)))
      : (!isSysItem(item) ? [item.id] : []);
    if (shortcutIds.length) {
      menuItems.push({
        icon: Icon.bolt,
        text: multi ? 'Crear accesos directos en escritorio' : 'Crear acceso directo en escritorio',
        action: () => createDesktopShortcuts(shortcutIds),
      });
      menuItems.push({
        icon: Icon.link,
        text: multi ? 'Copiar accesos directos' : 'Copiar acceso directo',
        action: () => copyShortcutSelection(shortcutIds),
      });
    }

    menuItems.push('sep');
    if (isProtected) {
      menuItems.push({ icon: Icon.shield, text: 'Protegido del sistema', action: () => alert('Este elemento está protegido por el sistema.') });
    } else {
      if (!multi) menuItems.push({ icon: Icon.pencil, text: 'Renombrar', action: () => startRename(item) });
      menuItems.push({ icon: Icon.trash, text: 'Eliminar', action: () => deleteSelected() });
    }

    if (item.type === 'dir' && !multi) {
      menuItems.push('sep');
      const isPin = pinned.includes(item.id);
      menuItems.push({ icon: isPin ? Icon.starFilled : Icon.star, text: isPin ? 'Quitar de favoritos' : 'Anclar a favoritos', action: () => togglePin(item.id) });
    }

    menuItems.push('sep');
    menuItems.push({ icon: Icon.paperclip, text: 'Copiar ruta', action: () => copyPath(item.id) });
    if (!multi) menuItems.push({ icon: Icon.info, text: 'Propiedades', action: () => { panelVisible = true; renderPanelUI(); renderPanel(); } });

    renderCtxMenu(x, y, menuItems, multi ? `${tab.selection.size} elementos` : item.name);
  }

  function showEmptyCtx(x, y) {
    const tab = activeTab();
    const menuItems = [
      { icon: Icon.folder, text: 'Nueva carpeta', action: () => startCreate('dir') },
      { icon: Icon.file, text: 'Nuevo archivo', action: () => startCreate('file') },
    ];
    if (K.clipboard.get().paths.length) {
      menuItems.push('sep');
      menuItems.push({ icon: Icon.paste, text: 'Pegar', action: () => pasteClipboard() });
    }
    menuItems.push('sep');
    menuItems.push({ icon: Icon.selectAll, text: 'Seleccionar todo', action: () => selectAll() });
    menuItems.push({ icon: Icon.refresh, text: 'Actualizar', action: () => refresh() });
    renderCtxMenu(x, y, menuItems, tab.cwd);
  }

  function hideCtx() { ctxMenu.style.display = 'none'; }
  document.addEventListener('click', hideCtx);

  /* ═══════════════════════ PREVIEW PANEL ═══════════════════════ */

  function renderPanelUI() {
    panelEl.style.display = panelVisible ? 'flex' : 'none';
    $('#btn-panel').classList.toggle('active', panelVisible);
  }

  function togglePanel() {
    panelVisible = !panelVisible;
    renderPanelUI();
    if (panelVisible) renderPanel();
  }

  async function renderPanel() {
    const myToken = ++panelToken;
    const tab = activeTab();
    const ids = [...tab.selection];

    if (!ids.length) {
      panelEl.innerHTML = `<div class="panel-empty">Selecciona un elemento<br>para ver sus detalles</div>`;
      return;
    }
    if (ids.length > 1) {
      let totalSize = 0, dirs = 0, files = 0;
      ids.forEach(id => {
        const it = tab.rawItems.find(i => i.id === id);
        if (!it) return;
        if (it.type === 'dir') dirs++; else { files++; totalSize += it.size || 0; }
      });
            panelEl.innerHTML = `
        <div class="panel-header"><span class="panel-icon">${Icon.selectAll}</span><span class="panel-title">${ids.length} elementos</span></div>
        <div class="panel-row"><span>Carpetas</span><span>${dirs}</span></div>
        <div class="panel-row"><span>Archivos</span><span>${files}</span></div>
        <div class="panel-row"><span>Tamaño</span><span>${fmtSize(totalSize)}</span></div>
      `;
      return;
    }

    const item = tab.rawItems.find(i => i.id === ids[0]);
    if (!item) { panelEl.innerHTML = `<div class="panel-empty">Elemento no disponible</div>`; return; }
    const isShortcut = item.type === 'shortcut' || item.meta?.isDesktopShortcut;
    const icon = item.type === 'dir' ? Icon.folder : isShortcut ? Icon.link : getIcon(item.name);

    panelEl.innerHTML = `
      <div class="panel-header"><span class="panel-icon">${icon}</span><span class="panel-title">${escapeHtml(item.name)}</span></div>
      <div class="panel-row"><span>Tipo</span><span>${item.type === 'dir' ? 'Directorio' : isShortcut ? 'Acceso directo' : 'Archivo'}</span></div>
      <div class="panel-row"><span>Ruta</span><span class="panel-path" title="${escapeHtml(item.id)}">${escapeHtml(item.id)}</span></div>
      <div class="panel-row"><span>Tamaño</span><span>${item.type === 'dir' ? '—' : fmtSize(item.size)}</span></div>
      <div class="panel-row"><span>Creado</span><span>${item.ctime ? new Date(item.ctime).toLocaleString('es') : '—'}</span></div>
      <div class="panel-row"><span>Modificado</span><span>${item.mtime ? new Date(item.mtime).toLocaleString('es') : '—'}</span></div>
      <div id="panel-preview" class="panel-preview"></div>
    `;

    if (item.type === 'dir' || isShortcut) return;
    const previewEl = panelEl.querySelector('#panel-preview');
    previewEl.textContent = 'Cargando vista previa…';

    const imageExts = new Set(['png','jpg','jpeg','gif','svg','webp']);
    const ext = item.name.split('.').pop().toLowerCase();
    try {
      if (imageExts.has(ext)) {
        const dataUrl = await K.fs.readDataURL(item.id);
        if (myToken !== panelToken) return;
        previewEl.innerHTML = `<img src="${dataUrl}" class="panel-img" alt="">`;
      } else if (await K.fs.isBinary(item.id)) {
        if (myToken !== panelToken) return;
        previewEl.textContent = 'Vista previa no disponible para este tipo de archivo.';
      } else {
        const content = await K.fs.read(item.id);
        if (myToken !== panelToken) return;
        const truncated = content.length > 3000;
        const pre = document.createElement('pre');
        pre.className = 'panel-text';
        pre.textContent = content.slice(0, 3000) + (truncated ? '\n…' : '');
        previewEl.innerHTML = '';
        previewEl.appendChild(pre);
      }
    } catch (e) {
      if (myToken !== panelToken) return;
      previewEl.textContent = 'No se pudo cargar la vista previa.';
    }
  }

  /* ═══════════════════════ STATUS BAR / TOOLBAR STATE ═══════════════════════ */

  function renderStatus() {
    const tab = activeTab();
    statusPath.textContent = tab.cwd;
    const total = tab.rawItems.length;
    const shown = tab.displayItems.length;
    statusCount.textContent = tab.search
      ? `${shown} de ${total} elemento${total !== 1 ? 's' : ''}`
      : `${total} elemento${total !== 1 ? 's' : ''}`;

    if (tab.selection.size === 0) {
      const cb = K.clipboard.get();
      statusSel.innerHTML = cb.paths.length
        ? `${Icon.clipboard} ${cb.paths.length} en portapapeles (${cb.op === 'cut' ? 'cortar' : 'copiar'})`
        : '';
    } else if (tab.selection.size === 1) {
      const item = tab.rawItems.find(i => i.id === [...tab.selection][0]);
      statusSel.textContent = item ? item.name : '';
    } else {
      let totalSize = 0;
      tab.selection.forEach(id => {
        const it = tab.rawItems.find(i => i.id === id);
        if (it && it.type !== 'dir') totalSize += (it.size || 0);
      });
      statusSel.textContent = `${tab.selection.size} seleccionados (${fmtSize(totalSize)})`;
    }
  }

  function updateToolbarState() {
    const tab = activeTab();
    const n = tab.selection.size;
    $('#btn-rename').disabled = n !== 1;
    $('#btn-delete').disabled = n === 0;
    $('#btn-cut').disabled = n === 0;
    $('#btn-copy').disabled = n === 0 || ![...tab.selection].some(id => !(id === '/system' || id.startsWith('/system/')));
    $('#btn-paste').disabled = !K.clipboard.get().paths.length;
    $('#btn-shortcut').disabled = n === 0 || ![...tab.selection].some(id => !isSysItem(tab.rawItems.find(i => i.id === id)));
    $('#btn-back').disabled = tab.historyIndex <= 0;
    $('#btn-forward').disabled = tab.historyIndex >= tab.history.length - 1;
    $('#btn-up').disabled = tab.cwd === '/';
    const isPinned = pinned.includes(tab.cwd);
    $('#btn-pin').innerHTML = isPinned ? Icon.starFilled : Icon.star;
    $('#btn-pin').classList.toggle('active', isPinned);
  }

  /* ═══════════════════════ TOOLBAR WIRING ═══════════════════════ */

  $('#btn-back').addEventListener('click', goBack);
  $('#btn-forward').addEventListener('click', goForward);
  $('#btn-up').addEventListener('click', () => {
    const tab = activeTab();
    const p = K.fs.dirname(tab.cwd);
    navigate((p && p !== tab.cwd) ? p : '/');
  });
  $('#btn-home').addEventListener('click', () => navigate('/home'));
  $('#btn-refresh').addEventListener('click', refresh);
  $('#btn-newdir').addEventListener('click', () => startCreate('dir'));
  $('#btn-newfile').addEventListener('click', () => startCreate('file'));
  $('#btn-cut').addEventListener('click', cutSelection);
  $('#btn-copy').addEventListener('click', copySelection);
  $('#btn-paste').addEventListener('click', pasteClipboard);
  $('#btn-rename').addEventListener('click', () => {
    const tab = activeTab();
    if (tab.selection.size !== 1) return;
    const item = tab.rawItems.find(i => i.id === [...tab.selection][0]);
    if (item) startRename(item);
  });
  $('#btn-delete').addEventListener('click', deleteSelected);
  $('#btn-pin').addEventListener('click', () => togglePin(activeTab().cwd));
  $('#btn-shortcut').addEventListener('click', () => {
    const tab = activeTab();
    const ids = [...tab.selection].filter(id => !isSysItem(tab.rawItems.find(i => i.id === id)));
    createDesktopShortcuts(ids);
  });
  $('#btn-view').addEventListener('click', () => {
    const tab = activeTab();
    tab.viewMode = tab.viewMode === 'grid' ? 'list' : 'grid';
    $('#btn-view').innerHTML = tab.viewMode === 'grid' ? Icon.listView : Icon.gridView;
    renderList();
  });
  $('#btn-sortdir').addEventListener('click', () => {
    const tab = activeTab();
    tab.sortDir = tab.sortDir === 'asc' ? 'desc' : 'asc';
    $('#btn-sortdir').textContent = tab.sortDir === 'asc' ? '⬆' : '⬇';
    renderList();
  });
  sortSelect.addEventListener('change', e => {
    activeTab().sortBy = e.target.value;
    renderList();
  });
  searchInput.addEventListener('input', e => {
    activeTab().search = e.target.value;
    renderList();
    renderStatus();
  });
  searchInput.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Escape') { searchInput.value = ''; activeTab().search = ''; renderList(); renderStatus(); searchInput.blur(); }
  });
  $('#btn-sidebar').addEventListener('click', () => {
    sidebarVisible = !sidebarVisible;
    $('#btn-sidebar').classList.toggle('active', sidebarVisible);
    renderSidebar();
  });
  $('#btn-panel').addEventListener('click', togglePanel);
  $('#btn-newtab').addEventListener('click', () => addTab('/home'));

  /* ═══════════════════════ KEYBOARD SHORTCUTS ═══════════════════════ */

  document.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    const tab = activeTab();
    const key = e.key.toLowerCase();
    const mod = e.ctrlKey || e.metaKey;

    if (e.key === 'F5') { e.preventDefault(); refresh(); }
    else if (e.key === 'Delete' && tab.selection.size) deleteSelected();
    else if (e.key === 'F2' && tab.selection.size === 1) {
      const item = tab.rawItems.find(i => i.id === [...tab.selection][0]);
      if (item) startRename(item);
    }
    else if (e.key === 'Backspace') { e.preventDefault(); $('#btn-up').click(); }
    else if (e.key === 'Enter' && tab.selection.size === 1) {
      const item = tab.rawItems.find(i => i.id === [...tab.selection][0]);
      if (item) openItem(item);
    }
    else if (mod && key === 'a') { e.preventDefault(); selectAll(); }
    else if (mod && key === 'c') { copySelection(); }
    else if (mod && key === 'x') { cutSelection(); }
    else if (mod && key === 'v') { pasteClipboard(); }
    else if (mod && key === 'd') { e.preventDefault(); duplicateSelection(); }
    else if (mod && key === 'f') { e.preventDefault(); searchInput.focus(); }
    else if (mod && key === 't') { e.preventDefault(); addTab('/home'); }
    else if (mod && key === 'w') { e.preventDefault(); closeTab(activeTabId); }
    else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
  });

  /* ═══════════════════════ HELPERS ═══════════════════════ */

  const EXT_ICON = {
    txt: Icon.file, md: Icon.file,
    js: Icon.fileCode, ts: Icon.fileCode, jsx: Icon.fileCode, tsx: Icon.fileCode, py: Icon.fileCode,
    html: Icon.fileWeb, css: Icon.filePalette,
    json: Icon.fileData, xml: Icon.fileData, yaml: Icon.fileData, yml: Icon.fileData, log: Icon.fileData,
    sh: Icon.fileConfig, ini: Icon.fileConfig, cfg: Icon.fileConfig, env: Icon.fileConfig, exe: Icon.fileConfig, sys: Icon.fileConfig,
    png: Icon.fileImage, jpg: Icon.fileImage, jpeg: Icon.fileImage, gif: Icon.fileImage, svg: Icon.fileImage, webp: Icon.fileImage,
    mp3: Icon.fileAudio, wav: Icon.fileAudio, ogg: Icon.fileAudio,
    mp4: Icon.fileVideo, mov: Icon.fileVideo, avi: Icon.fileVideo,
    pdf: Icon.fileDoc, doc: Icon.fileDoc, docx: Icon.fileDoc,
    xls: Icon.fileSheet, xlsx: Icon.fileSheet,
    ppt: Icon.fileSlides, pptx: Icon.fileSlides,
    zip: Icon.fileArchive, tar: Icon.fileArchive, gz: Icon.fileArchive, rar: Icon.fileArchive,
    ttf: Icon.fileFont, woff: Icon.fileFont, woff2: Icon.fileFont,
  };

  function getIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    return EXT_ICON[ext] || Icon.file;
  }

  function fmtSize(b) {
    if (!b || b === 0) return '0B';
    if (b < 1024) return b + 'B';
    if (b < 1048576) return (b / 1024).toFixed(1) + 'KB';
    return (b / 1048576).toFixed(1) + 'MB';
  }

  function fmtDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    const mo = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()];
    const day = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${mo} ${day}, ${hh}:${mm}`;
  }

  /* ═══════════════════════ FS EVENT LISTENERS ═══════════════════════ */

  function bindKernelEvents() {
    K.on('fs:write',  () => refresh());
    K.on('fs:remove', () => refresh());
    K.on('fs:mkdir',  () => refresh());
    K.on('fs:move',   () => refresh());
    K.on('clipboard:change', () => { renderStatus(); updateToolbarState(); });
  }

  let filesReady = false;
  const pendingMsgs = [];

function handleAppMessage(data) {
    if (data.type === 'files:navigate' && data.path) navigate(data.path);
    else if (data.type === 'app:init' && data.opts && data.opts.pickerMode) {
      enablePickerMode(data.pid, data.opts.pickerTarget);
    }
  }

  window.addEventListener('message', e => {
    const data = e.data || {};
    if (data.type !== 'files:navigate' && data.type !== 'app:init') return;
    if (!filesReady) { pendingMsgs.push(data); return; }
    handleAppMessage(data);
  });

  function enablePickerMode(pid, targetFile) {
    console.log('[FILES] Modo picker activado. PID:', pid, 'Target:', targetFile);
    if (document.getElementById('picker-select-btn')) return;
    const btn = document.createElement('button');
    btn.id = 'picker-select-btn';
    btn.className = 'tb-btn';
    btn.style.background = '#00ff88';
    btn.style.color = '#000';
    btn.style.fontWeight = 'bold';
    btn.style.marginLeft = 'auto';
    btn.textContent = '✓ Seleccionar esta carpeta';
    btn.addEventListener('click', async () => {
      const tab = activeTab();
      const path = tab.cwd;
      const outputPath = targetFile || '/temp/ide_picker_result.txt';
      console.log('[FILES] Botón clickeado. Guardando ruta en:', outputPath, '| Ruta:', path);
      try {
        await K.fs.write(outputPath, path);
        console.log('[FILES] Archivo escrito correctamente. Cerrando ventana...');
      } catch (e) {
        console.error('[FILES] Error al guardar la selección:', e);
        toast('Error al guardar la selección', 'error');
        return;
      }
      setTimeout(() => {
        if (window.parent.__wos && pid != null) {
          window.parent.__wos.closeWindow(Number(pid));
        }
      }, 150);
    });
    toolbarEl.appendChild(btn);
  }

  /* ═══════════════════════ INIT ═══════════════════════ */

waitForKernel(kernel => {
    K = kernel;

    (async () => {
      await loadPinned();
      await cleanupPendingShortcutTemp();
      const startPath = getStartPath();
      const initial = startPath ? (K.fs.normalize(startPath) || '/home') : '/home';
      tabs = [createTab(initial)];
      activeTabId = tabs[0].id;
      bindKernelEvents();
      await refresh();

filesReady = true;
      
      if (window.__APP_OPTS && window.__APP_OPTS.pickerMode) {
        console.log('[FILES] Detectado modo picker por variable inyectada.');
        enablePickerMode(window.__APP_PID ?? 0, window.__APP_OPTS.pickerTarget);
      }
      
      while (pendingMsgs.length) handleAppMessage(pendingMsgs.shift());
    })();
  });

})();
</script>
</body>
</html>
