<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archivos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --green: #00ff88;
      --green-dim: #00aa55;
      --green-faint: #003322;
      --red-err: #ff4444;
      --bg: #030a05;
      --glass: rgba(3, 18, 10, 0.82);
      --glow-sm: 0 0 4px #00ff8888;
    }
    
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }
    
    body {
      display: flex;
      flex-direction: column;
    }
    
    /* ── Toolbar ── */
    .toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(0,255,136,0.18);
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(0,30,16,0.7);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    
    .toolbar button {
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.18);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background 0.12s;
      letter-spacing: 0.05em;
    }
    
    .toolbar button:hover {
      background: rgba(0,255,136,0.18);
      box-shadow: var(--glow-sm);
    }
    
    .breadcrumb {
      font-size: 0.7rem;
      color: var(--green-dim);
      letter-spacing: 0.05em;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    /* ── Main content ── */
    .files-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.1s;
      font-size: 0.73rem;
      border: 1px solid transparent;
      user-select: none;
    }
    
    .file-item:hover {
      background: rgba(0,255,136,0.10);
    }
    
    .file-item.selected {
      background: rgba(0,255,136,0.18);
      border-color: rgba(0,255,136,0.3);
    }
    
    .file-item .icon {
      font-size: 1rem;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    
    .file-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--green);
    }
    
    .file-item .size {
      font-size: 0.65rem;
      color: var(--green-dim);
      min-width: 60px;
      text-align: right;
    }
    
    /* ── Scrollbar ── */
    .files-container::-webkit-scrollbar { width: 6px; }
    .files-container::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 3px; }
    
    /* ── Status bar ── */
    .statusbar {
      padding: 6px 10px;
      border-top: 1px solid rgba(0,255,136,0.18);
      font-size: 0.65rem;
      color: var(--green-dim);
      background: rgba(0,30,16,0.5);
      flex-shrink: 0;
    }
    
    /* Context menu */
    .ctx-menu {
      position: fixed;
      background: rgba(2, 18, 10, 0.97);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 3px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      z-index: 1000;
      overflow: hidden;
      display: none;
      flex-direction: column;
      min-width: 140px;
    }
    
    .ctx-menu.show { display: flex; }
    
    .ctx-menu-item {
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.7rem;
      color: var(--green-dim);
      transition: background 0.1s;
      border: none;
      background: none;
      text-align: left;
      font-family: inherit;
    }
    
    .ctx-menu-item:hover {
      background: rgba(0,255,136,0.12);
      color: var(--green);
    }
    
    .ctx-sep {
      height: 1px;
      background: rgba(0,255,136,0.12);
      margin: 2px 0;
    }
    
    /* Input dialogs */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    
    .modal.show { display: flex; }
    
    .modal-content {
      background: var(--glass);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 6px;
      padding: 16px;
      min-width: 280px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }
    
    .modal-title {
      font-size: 0.8rem;
      color: var(--green);
      margin-bottom: 10px;
      letter-spacing: 0.08em;
      text-shadow: var(--glow-sm);
    }
    
    .modal-input {
      width: 100%;
      padding: 6px 8px;
      background: rgba(0,255,136,0.06);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 3px;
      color: var(--green);
      font-family: inherit;
      font-size: 0.73rem;
      margin-bottom: 10px;
      outline: none;
    }
    
    .modal-input:focus { border-color: rgba(0,255,136,0.4); }
    
    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    
    .modal-btn {
      padding: 5px 12px;
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.18);
      color: var(--green);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: background 0.1s;
    }
    
    .modal-btn:hover { background: rgba(0,255,136,0.18); }
    .modal-btn.danger { background: rgba(255,68,68,0.12); border-color: rgba(255,68,68,0.3); color: #ff4444; }
    .modal-btn.danger:hover { background: rgba(255,68,68,0.22); }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="btn-back" title="Atrás">← Atrás</button>
    <button id="btn-forward" title="Adelante">Adelante →</button>
    <button id="btn-refresh" title="Actualizar">🔄 Actualizar</button>
    <span class="breadcrumb" id="breadcrumb">/home</span>
  </div>

  <div class="files-container">
    <div class="file-list" id="file-list"></div>
  </div>

  <div class="statusbar" id="statusbar">Listo</div>

  <!-- Context menu -->
  <div class="ctx-menu" id="ctx-menu">
    <button class="ctx-menu-item" id="ctx-open">Abrir</button>
    <button class="ctx-menu-item" id="ctx-edit">Editar</button>
    <div class="ctx-sep"></div>
    <button class="ctx-menu-item" id="ctx-rename">Renombrar</button>
    <button class="ctx-menu-item" id="ctx-delete">Eliminar</button>
    <div class="ctx-sep"></div>
    <button class="ctx-menu-item" id="ctx-new-file">Nuevo archivo</button>
    <button class="ctx-menu-item" id="ctx-new-folder">Nueva carpeta</button>
  </div>

  <!-- Modals -->
  <div class="modal" id="rename-modal">
    <div class="modal-content">
      <div class="modal-title">RENOMBRAR</div>
      <input class="modal-input" id="rename-input" type="text" />
      <div class="modal-buttons">
        <button class="modal-btn" id="rename-cancel">Cancelar</button>
        <button class="modal-btn" id="rename-ok">OK</button>
      </div>
    </div>
  </div>

  <div class="modal" id="new-file-modal">
    <div class="modal-content">
      <div class="modal-title">NUEVO ARCHIVO</div>
      <input class="modal-input" id="new-file-input" type="text" placeholder="nombre.txt" />
      <div class="modal-buttons">
        <button class="modal-btn" id="new-file-cancel">Cancelar</button>
        <button class="modal-btn" id="new-file-ok">Crear</button>
      </div>
    </div>
  </div>

  <div class="modal" id="new-folder-modal">
    <div class="modal-content">
      <div class="modal-title">NUEVA CARPETA</div>
      <input class="modal-input" id="new-folder-input" type="text" placeholder="nueva_carpeta" />
      <div class="modal-buttons">
        <button class="modal-btn" id="new-folder-cancel">Cancelar</button>
        <button class="modal-btn" id="new-folder-ok">Crear</button>
      </div>
    </div>
  </div>

  <script>
    // Acceder al Kernel desde el parent
    const Kernel = window.parent.Kernel;
    
    class FileManager {
      constructor() {
        this.currentPath = '/home';
        this.history = ['/home'];
        this.historyIndex = 0;
        this.selectedItem = null;
        this.init();
      }
      
      init() {
        this.bindEvents();
        this.loadDirectory();
        
        // Escuchar cambios en FS
        Kernel.on('fs:change', () => this.loadDirectory());
      }
      
      bindEvents() {
        document.getElementById('btn-back').addEventListener('click', () => this.goBack());
        document.getElementById('btn-forward').addEventListener('click', () => this.goForward());
        document.getElementById('btn-refresh').addEventListener('click', () => this.loadDirectory());
        
        // Context menu
        document.getElementById('ctx-open').addEventListener('click', () => this.openItem());
        document.getElementById('ctx-edit').addEventListener('click', () => this.editItem());
        document.getElementById('ctx-rename').addEventListener('click', () => this.showRenameModal());
        document.getElementById('ctx-delete').addEventListener('click', () => this.deleteItem());
        document.getElementById('ctx-new-file').addEventListener('click', () => this.showNewFileModal());
        document.getElementById('ctx-new-folder').addEventListener('click', () => this.showNewFolderModal());
        
        // Modals
        document.getElementById('rename-cancel').addEventListener('click', () => this.hideModal('rename-modal'));
        document.getElementById('rename-ok').addEventListener('click', () => this.confirmRename());
        document.getElementById('new-file-cancel').addEventListener('click', () => this.hideModal('new-file-modal'));
        document.getElementById('new-file-ok').addEventListener('click', () => this.confirmNewFile());
        document.getElementById('new-folder-cancel').addEventListener('click', () => this.hideModal('new-folder-modal'));
        document.getElementById('new-folder-ok').addEventListener('click', () => this.confirmNewFolder());
        
        // Right click para context menu
        document.addEventListener('contextmenu', (e) => this.showContextMenu(e));
        document.addEventListener('click', () => this.hideContextMenu());
      }
      
      async loadDirectory() {
        try {
          const items = await Kernel.fs.readdir(this.currentPath);
          this.renderItems(items);
          this.updateBreadcrumb();
          this.updateStatus();
        } catch (err) {
          console.error('Error cargando directorio:', err);
          this.setStatus(`Error: ${err.message}`);
        }
      }
      
      renderItems(items) {
        const list = document.getElementById('file-list');
        list.innerHTML = '';
        
        // Agregar carpeta ".."
        if (this.currentPath !== '/') {
          const parent = this.currentPath === '/' ? '/' : this.currentPath.split('/').slice(0, -1).join('/') || '/';
          const parentItem = document.createElement('div');
          parentItem.className = 'file-item';
          parentItem.innerHTML = `
            <div class="icon">📁</div>
            <div class="name">..</div>
          `;
          parentItem.addEventListener('dblclick', () => this.navigate(parent));
          list.appendChild(parentItem);
        }
        
        // Ordenar: carpetas primero
        const sorted = items.sort((a, b) => {
          if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
          return a.name.localeCompare(b.name);
        });
        
        sorted.forEach(item => {
          const el = document.createElement('div');
          el.className = 'file-item';
          
          const icon = item.type === 'dir' ? '📁' : '📄';
          const size = item.type === 'dir' ? '' : `${(item.size / 1024).toFixed(1)}KB`;
          
          el.innerHTML = `
            <div class="icon">${icon}</div>
            <div class="name">${item.name}</div>
            <div class="size">${size}</div>
          `;
          
          el.addEventListener('click', () => this.selectItem(el, item));
          el.addEventListener('dblclick', () => this.doubleClickItem(item));
          el.addEventListener('contextmenu', (e) => this.selectItem(el, item));
          
          list.appendChild(el);
        });
      }
      
      selectItem(el, item) {
        document.querySelectorAll('.file-item.selected').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        this.selectedItem = item;
      }
      
      doubleClickItem(item) {
        if (item.type === 'dir') {
          this.navigate(item.id);
        } else if (item.name.endsWith('.txt')) {
          this.editItem();
        }
      }
      
      navigate(path) {
        this.currentPath = path;
        this.history = this.history.slice(0, this.historyIndex + 1);
        this.history.push(path);
        this.historyIndex = this.history.length - 1;
        this.loadDirectory();
      }
      
      goBack() {
        if (this.historyIndex > 0) {
          this.historyIndex--;
          this.currentPath = this.history[this.historyIndex];
          this.loadDirectory();
        }
      }
      
      goForward() {
        if (this.historyIndex < this.history.length - 1) {
          this.historyIndex++;
          this.currentPath = this.history[this.historyIndex];
          this.loadDirectory();
        }
      }
      
      async openItem() {
        if (!this.selectedItem) return;
        if (this.selectedItem.type === 'dir') {
          this.navigate(this.selectedItem.id);
        } else if (this.selectedItem.name.endsWith('.txt')) {
          this.editItem();
        }
      }
      
      editItem() {
        if (!this.selectedItem || this.selectedItem.type !== 'file') {
          alert('Selecciona un archivo de texto');
          return;
        }
        // Abrir el editor (será implementado por el shell)
        window.parent.Kernel.emit('app:open-editor', { path: this.selectedItem.id });
      }
      
      showRenameModal() {
        if (!this.selectedItem) return;
        document.getElementById('rename-input').value = this.selectedItem.name;
        this.showModal('rename-modal');
      }
      
      async confirmRename() {
        const newName = document.getElementById('rename-input').value;
        if (!newName) return;
        
        try {
          const parent = this.selectedItem.parent || '/';
          const newPath = parent === '/' ? `/${newName}` : `${parent}/${newName}`;
          await Kernel.fs.move(this.selectedItem.id, newPath);
          this.hideModal('rename-modal');
          this.loadDirectory();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
      
      async deleteItem() {
        if (!this.selectedItem) return;
        if (!confirm(`¿Eliminar ${this.selectedItem.name}?`)) return;
        
        try {
          await Kernel.fs.remove(this.selectedItem.id, { recursive: true });
          this.loadDirectory();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
      
      showNewFileModal() {
        document.getElementById('new-file-input').value = '';
        this.showModal('new-file-modal');
      }
      
      async confirmNewFile() {
        const name = document.getElementById('new-file-input').value;
        if (!name) return;
        
        try {
          const path = this.currentPath === '/' ? `/${name}` : `${this.currentPath}/${name}`;
          await Kernel.fs.write(path, '');
          this.hideModal('new-file-modal');
          this.loadDirectory();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
      
      showNewFolderModal() {
        document.getElementById('new-folder-input').value = '';
        this.showModal('new-folder-modal');
      }
      
      async confirmNewFolder() {
        const name = document.getElementById('new-folder-input').value;
        if (!name) return;
        
        try {
          const path = this.currentPath === '/' ? `/${name}` : `${this.currentPath}/${name}`;
          await Kernel.fs.mkdir(path);
          this.hideModal('new-folder-modal');
          this.loadDirectory();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
      
      showContextMenu(e) {
        const menu = document.getElementById('ctx-menu');
        menu.classList.add('show');
        menu.style.left = e.clientX + 'px';
        menu.style.top = e.clientY + 'px';
        e.preventDefault();
      }
      
      hideContextMenu() {
        document.getElementById('ctx-menu').classList.remove('show');
      }
      
      showModal(id) {
        document.getElementById(id).classList.add('show');
      }
      
      hideModal(id) {
        document.getElementById(id).classList.remove('show');
      }
      
      updateBreadcrumb() {
        document.getElementById('breadcrumb').textContent = this.currentPath;
      }
      
      updateStatus() {
        const count = document.querySelectorAll('.file-item').length - 1; // -1 por el ".."
        this.setStatus(`${count} elemento(s)`);
      }
      
      setStatus(text) {
        document.getElementById('statusbar').textContent = text;
      }
    }
    
    // Inicializar cuando el Kernel esté listo
    if (Kernel.isReady) {
      new FileManager();
    } else {
      Kernel.once('ready', () => new FileManager());
    }
  </script>

</body>
</html>
