<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="128"
    height="128"
    viewBox="0 0 128 128">

    <defs>
        <mask id="cut">
            <!-- Blanco = visible -->
            <rect width="128" height="128" fill="white"/>

            <!-- Negro = transparente -->
            <rect x="18"  y="44" width="17" height="61" fill="black"/>
            <rect x="39"  y="27" width="17" height="78" fill="black"/>
            <rect x="60"  y="56" width="17" height="49" fill="black"/>
            <rect x="81"  y="38" width="17" height="67" fill="black"/>
            <rect x="102" y="71" width="17" height="34" fill="black"/>
        </mask>
    </defs>

<rect
    width="128"
    height="128"
    rx="20"
    ry="20"
    fill="#3AFE82"
    mask="url(#cut)"/>

</svg>