<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal</title>
<script type="application/json" id="wos-manifest">
{
  "id": "terminal",
  "name": "Terminal",
  "version": "1.0.0",
  "icon": "⌨",
  "category": "system",
  "singleton": false,
  "winWidth": 640,
  "winHeight": 420,
  "description": "Terminal de comandos nativa de HUEBOS.",
  "author": "glados"
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;}

:root{
  --g:#00ff88; --g-dim:#00bb66; --cyan:#00d4ff; --amber:#ffcc44; --red:#ff4466;
  --mono:'Share Tech Mono', monospace;
  --glow-sm: 0 0 8px #00ff8866;
}

.native-terminal {
  display:flex; flex-direction:column;
  width:100%; height:100%;
  background:rgba(1,8,4,0.94);
  font-family:var(--mono); font-size:13px; color:var(--g); overflow:hidden;
  position:relative;
}
.native-terminal::before {
  content:'';
  position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(circle at 12% 8%, rgba(0,255,136,0.08), transparent 28%);
}
.nt-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:4px 12px;
  background:rgba(0,10,5,0.96);
  border-bottom:1px solid rgba(0,255,136,0.07);
  font-size:10.5px; color:var(--g-dim); flex-shrink:0;
}
.nt-leds { display:flex; gap:4px; align-items:center; margin-right:8px; }
.nt-led {
  width:5px; height:5px; border-radius:50%;
  background:rgba(0,255,136,0.34);
  box-shadow:0 0 8px rgba(0,255,136,0.35);
  animation: dotPulse 2.4s ease-in-out infinite;
}
.nt-led:nth-child(2) { background:rgba(0,212,255,0.36); animation-delay:-0.8s; }
.nt-led:nth-child(3) { background:rgba(255,204,68,0.36); animation-delay:-1.6s; }
.nt-title-wrap { display:flex; align-items:center; min-width:0; }
.nt-header .nt-title { color:var(--g); opacity:0.8; }
.nt-cwd { color:var(--cyan); font-size:10.5px; }
.nt-output {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:10px 12px; line-height:1.65; font-size:12.5px;
  position:relative;
  background:
    repeating-linear-gradient(0deg, rgba(0,255,136,0.018) 0 1px, transparent 1px 18px),
    linear-gradient(180deg, rgba(0,255,136,0.025), transparent 40%);
}
.nt-line { white-space:pre-wrap; word-break:break-all; min-height:1em; }
.nt-cmd     { color:var(--g); }
.nt-out     { color:#9ecca6; }
.nt-err     { color:var(--red); }
.nt-dir     { color:var(--cyan); }
.nt-file    { color:var(--g-dim); }
.nt-info    { color:var(--amber); }
.nt-dim     { color:var(--g-dim); opacity:0.48; }
.nt-success { color:var(--g); text-shadow:var(--glow-sm); }
.nt-input-wrap {
  display:flex; align-items:center;
  padding:6px 12px;
  border-top:1px solid rgba(0,255,136,0.07);
  background:rgba(0,6,3,0.99); flex-shrink:0; gap:4px;
  position:relative;
}
.nt-input-wrap::before {
  content:'';
  position:absolute; top:0; left:12px; right:12px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(0,255,136,0.45), rgba(0,212,255,0.28), transparent);
}
.nt-prompt { color:var(--g); white-space:nowrap; flex-shrink:0; font-size:12.5px; user-select:none; }
.nt-prompt .nt-ph { color:var(--cyan); }
.nt-prompt .nt-pp { color:var(--g-dim); }
.nt-cmd-input {
  flex:1; background:transparent; border:none; outline:none;
  color:var(--g); font-family:var(--mono); font-size:12.5px;
  caret-color:var(--g); user-select:text;
}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:rgba(0,255,136,0.28);}
@keyframes dotPulse {
  0%,100% { opacity:0.38; transform:scale(0.88); }
  50%      { opacity:1;    transform:scale(1.14); }
}
</style>
</head>
<body>
  <div class="native-terminal">
    <div class="nt-header">
      <div class="nt-title-wrap">
        <span class="nt-leds"><span class="nt-led"></span><span class="nt-led"></span><span class="nt-led"></span></span>
        <span class="nt-title">HUEBOS Terminal</span>
      </div>
      <span class="nt-cwd" id="nt-cwd-label">~</span>
    </div>
    <div class="nt-output" id="nt-output"></div>
    <div class="nt-input-wrap">
      <span class="nt-prompt" id="nt-prompt"></span>
      <input class="nt-cmd-input" id="nt-cmd-input" type="text"
             autocomplete="off" spellcheck="false" autocapitalize="off" />
    </div>
  </div>
  <script>
;(function () {
  'use strict';

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[ch]));
  }

  const TerminalModule=(function(){

    class Parser{
      static parse(line){
        if(!line||!line.trim())return{type:'pipeline',commands:[],operators:[]};
        const tokens=Parser._tokenize(line);
        if(!tokens.length)return{type:'pipeline',commands:[],operators:[]};
        const commands=[];const operators=[];
        let current={name:null,tokens:[],redirects:[]};
        for(let i=0;i<tokens.length;i++){
          const t=tokens[i];
          if(t==='|'){if(current.name){commands.push(current);operators.push('|');current={name:null,tokens:[],redirects:[]};}}
          else if(t==='&&'){if(current.name){commands.push(current);operators.push('&&');current={name:null,tokens:[],redirects:[]};}}
          else if(t==='||'){if(current.name){commands.push(current);operators.push('||');current={name:null,tokens:[],redirects:[]};}}
          else if(t==='>'||t==='>>'||t==='<'){
            const next=tokens[i+1];
            if(next&&!['|','&&','||','>','>>','<'].includes(next)){
              current.redirects.push({op:t,target:next});
              i++;
            }
          }else if(current.name===null){current.name=t;}
          else{current.tokens.push(t);}
        }
        if(current.name)commands.push(current);
        return{type:'pipeline',commands,operators};
      }
      static _tokenize(line){
        const tokens=[];let buf='';let i=0;let inSingle=false,inDouble=false;
        const push=()=>{if(buf!==''){tokens.push(buf);buf='';}};
        while(i<line.length){
          const c=line[i];
          if(inSingle){if(c==="'"){inSingle=false;}else{buf+=c;}i++;continue;}
          if(inDouble){if(c==='"'){inDouble=false;}else if(c==='\\'&&line[i+1]==='"'){buf+='"';i++;}else{buf+=c;}i++;continue;}
          if(c==="'"){inSingle=true;i++;continue;}
          if(c==='"'){inDouble=true;i++;continue;}
          if(c==='\\'&&line[i+1]){buf+=line[i+1];i+=2;continue;}
          if(c==='|'&&line[i+1]==='|'){push();tokens.push('||');i+=2;continue;}
          if(c==='&'&&line[i+1]==='&'){push();tokens.push('&&');i+=2;continue;}
          if(c==='|'){push();tokens.push('|');i++;continue;}
          if(c==='>'&&line[i+1]==='>'){push();tokens.push('>>');i+=2;continue;}
          if(c==='>'){push();tokens.push('>');i++;continue;}
          if(c==='<'){push();tokens.push('<');i++;continue;}
          if(c===' '||c==='\t'){push();i++;continue;}
          buf+=c;i++;
        }
        push();
        return tokens;
      }
    }

    class CommandRegistry{
      constructor(){this._cmds=new Map();this._aliases=new Map();}
      register(spec){
        if(!spec||!spec.name)throw new Error('CommandSpec requires name');
        this._cmds.set(spec.name.toLowerCase(),spec);
        if(spec.aliases)spec.aliases.forEach(a=>this._aliases.set(a.toLowerCase(),spec.name.toLowerCase()));
        return spec;
      }
      registerAll(specs){if(specs)specs.forEach(s=>this.register(s));}
      unregister(name){const n=name.toLowerCase();this._cmds.delete(n);for(const [k,v] of this._aliases){if(v===n)this._aliases.delete(k);}}
      resolve(name){
        if(!name)return null;
        const n=name.toLowerCase();
        const real=this._aliases.get(n)||n;
        return this._cmds.get(real)||null;
      }
      list(){return Array.from(this._cmds.values()).sort((a,b)=>a.name.localeCompare(b.name));}
      names(){return Array.from(this._cmds.keys()).sort();}
    }

    class ArgResolver{
      static resolve(tokens,spec){
        const positionals=[];const flags={};
        const flagDefs=spec?.flags||[];
        for(let i=0;i<tokens.length;i++){
          const t=tokens[i];
          if(t.startsWith('--')){
            const eq=t.indexOf('=');
            if(eq>=0){flags[t.slice(2,eq)]=t.slice(eq+1);}
            else{const def=flagDefs.find(f=>f.long===t.slice(2));if(def&&def.takesValue&&tokens[i+1]){flags[t.slice(2)]=tokens[++i];}else{flags[t.slice(2)]=true;}}
          }else if(t.startsWith('-')&&t.length>1&&!/^\d+$/.test(t.slice(1))){
            for(const ch of t.slice(1)){const def=flagDefs.find(f=>f.short===ch);if(def&&def.takesValue&&tokens[i+1]&&!tokens[i+1].startsWith('-')){flags[ch]=tokens[++i];}else{flags[ch]=true;}}
          }else{positionals.push(t);}
        }
        return{positionals,flags,errors:[]};
      }
    }

    class ErrorHandler{
      static report(err,ctx){
        if(!err)return;
        const msg=err.message||String(err);
        if(err.type==='CommandNotFound')ctx.print(`comando no encontrado: ${err.command}`,'nt-err');
        else if(err.type==='PermissionDenied')ctx.print(`permiso denegado: ${msg}`,'nt-err');
        else if(err.type==='InvalidArgs')ctx.print(`uso inválido: ${msg}`,'nt-err');
        else ctx.print(`Error: ${msg}`,'nt-err');
        return err.exitCode??1;
      }
    }

    class EnvStore{
      constructor(kernel){this.k=kernel;}
      async get(key){return this.k?.env?.get?.(key)??null;}
      async set(key,val){return this.k?.env?.set?.(key,val);}
      async unset(key){return this.k?.env?.unset?.(key);}
      async all(){return this.k?.env?.all?.()??{};}
      expand(str,vars){
        if(!str)return str;
        let out=str;
        out=out.replace(/%(\w+)%/g,(m,n)=>{const v=vars?.[n];return v!==undefined?String(v):m;});
        out=out.replace(/\$\{(\w+)\}/g,(m,n)=>{const v=vars?.[n];return v!==undefined?String(v):m;});
        out=out.replace(/\$(\w+)/g,(m,n)=>{const v=vars?.[n];return v!==undefined?String(v):m;});
        return out;
      }
      async expandAsync(str){const vars=await this.all();return this.expand(str,vars);}
      async expandAsyncWithExtra(str, extra){
        const vars=await this.all();
        return this.expand(str,{...vars,...extra});
      }
    }

    class Redirect{
      static async apply(redirects,ctx){
        if(!redirects||!redirects.length)return null;
        const out=redirects.find(r=>r.op==='>'||r.op==='>>');
        const inp=redirects.find(r=>r.op==='<');
        let savedPrint=ctx.print,savedPrintHTML=ctx.printHTML;
        let buffer=null;
        if(out){
          buffer=[];
          ctx.print=(t,c='nt-out')=>{buffer.push({type:'text',text:t});};
          ctx.printHTML=(h,c='nt-out')=>{buffer.push({type:'html',html:h});};
        }
        let stdinContent=null;
        if(inp){
          try{stdinContent=await ctx.kernel.fs.read(ctx.resolvePath(inp.target));}
          catch{stdinContent='';}
        }
        return{out,inp,buffer,savedPrint,savedPrintHTML,stdinContent,async flush(){
          if(!out||!buffer)return;
          const text=buffer.map(b=>b.type==='text'?b.text:'').join('\n');
          const target=ctx.resolvePath(out.target);
          if(out.op==='>>'){const existing=await ctx.kernel.fs.read(target).catch(()=>'');await ctx.kernel.fs.write(target,existing+(existing?'\n':'')+text);}
          else{await ctx.kernel.fs.write(target,text);}
          ctx.print=savedPrint;ctx.printHTML=savedPrintHTML;
          ctx.print(`redirección → ${target} (${text.length} chars)`,'nt-success');
        }};
      }
    }

    class Pipe{
      static async run(ast,ctx,execCommand){
        const cmds=ast.commands;
        if(cmds.length===1)return execCommand(cmds[0],ctx,null);
        let prevOutput=null;
        for(let i=0;i<cmds.length;i++){
          const cmd=cmds[i];
          const subCtx=Object.create(ctx);
          let collected='';
          const origPrint=ctx.print;
          subCtx.print=(t,c='nt-out')=>{if(i<cmds.length-1){collected+=t+'\n';}else{origPrint(t,c);}};
          subCtx.printHTML=(h,c='nt-out')=>{if(i<cmds.length-1){collected+=h+'\n';}else{ctx.printHTML(h,c);}};
          await execCommand(cmd,subCtx,prevOutput);
          prevOutput=collected;
        }
      }
    }

    class History{
      constructor(kernel){this.k=kernel;this.items=[];this.idx=-1;this.max=200;}
      add(cmd){if(!cmd)return;if(this.items[0]===cmd)return;this.items.unshift(cmd);this.idx=-1;if(this.items.length>this.max)this.items.pop();
        if(this.k)this.k.prefs.set('terminal.history',this.items).catch(()=>{});
      }
      async load(){
        if(!this.k)return;
        const saved=await this.k.prefs.get('terminal.history');
        if(Array.isArray(saved))this.items=saved.slice(0,this.max);
      }
      up(){if(this.idx<this.items.length-1){this.idx++;return this.items[this.idx];}return null;}
      down(){if(this.idx>0){this.idx--;return this.items[this.idx];}this.idx=-1;return null;}
      reset(){this.idx=-1;}
      clear(){this.items=[];this.idx=-1;
        if(this.k)this.k.prefs.set('terminal.history',[]).catch(()=>{});
      }
      list(){return this.items.slice();}
    }

    class Alias{
      constructor(kernel){this.k=kernel;}
      async all(){return (await this.k.prefs.get('terminal.aliases'))||{};}
      async expand(line){
        const all=await this.all();
        const parts=line.split(/\s+/);
        if(!parts.length)return line;
        const cmd=all[parts[0]];
        if(!cmd)return line;
        return cmd+(parts.length>1?' '+parts.slice(1).join(' '):'');
      }
    }

    class Completer{
      static async complete(input,ctx){
        const parts=input.split(/\s+/);
        if(parts.length===0)return null;
        if(parts.length===1&&!input.endsWith(' ')){
          const partial=parts[0].toLowerCase();
          const matches=ctx.registry.names().filter(n=>n.startsWith(partial));
          if(matches.length===1)return{replace:matches[0]+' ',completions:[]};
          if(matches.length>1)return{replace:null,completions:matches};
          return null;
        }
        const lastToken=parts[parts.length-1];
        if(lastToken.startsWith('--')){
          const cmdName=parts[0].toLowerCase();
          const spec=ctx.registry.resolve(cmdName);
          if(spec?.flags){
            const partial=lastToken.slice(2);
            const matches=spec.flags.filter(f=>f.long&&f.long.startsWith(partial)).map(f=>'--'+f.long);
            if(matches.length===1)return{replace:parts.slice(0,-1).join(' ')+' '+matches[0]+' ',completions:[]};
            if(matches.length>1)return{replace:null,completions:matches};
          }
          return null;
        }
        const partial=lastToken;
        const dir=partial.includes('/')?ctx.resolvePath(partial.slice(0,partial.lastIndexOf('/')+1)):ctx.cwd;
        const pfx=partial.includes('/')?partial.slice(partial.lastIndexOf('/')+1):partial;
        try{
          const entries=await ctx.kernel.fs.readdir(dir);
          const matches=entries.filter(e=>e.name.startsWith(pfx));
          if(matches.length===1){
            const prefix=partial.includes('/')?partial.slice(0,partial.lastIndexOf('/')+1):'';
            const completed=prefix+matches[0].name+(matches[0].type==='dir'?'/':'');
            return{replace:parts.slice(0,-1).join(' ')+' '+completed,completions:[]};
          }
          if(matches.length>1){
            return{replace:null,completions:matches.map(m=>m.name+(m.type==='dir'?'/':''))};
          }
        }catch{}
        return null;
      }
    }

    class Renderer{
      constructor(outputEl){this.el=outputEl;}
      print(text,cls='nt-out'){const l=document.createElement('div');l.className='nt-line '+cls;l.textContent=text;this.el.appendChild(l);}
      printHTML(html,cls='nt-out'){const l=document.createElement('div');l.className='nt-line '+cls;l.innerHTML=html;this.el.appendChild(l);}
      clear(){this.el.innerHTML='';}
      scrollBottom(){this.el.scrollTop=this.el.scrollHeight;}
    }

    class TerminalCore{
      constructor(opts){
        this.kernel=opts.kernel;
        this.termProc=opts.termProc;
        this.renderer=opts.renderer;
        this.cmdInput=opts.cmdInput;
        this.promptEl=opts.promptEl||null;
        this.promptPath=opts.promptPath;
        this.cwdDisplay=opts.cwdDisplay;
        this.registry=new CommandRegistry();
        this.env=new EnvStore(this.kernel);
        this.alias=new Alias(this.kernel);
        this.history=new History(this.kernel);
        this.exitCode=0;
        this._cwd=opts.termProc?.cwd||'/home';
        this.promptStyle='default';
      }
      async init(){
        await this.history.load();
        this.promptStyle=await this.kernel.prefs.get('terminal.promptStyle','default');
        this._applyPromptStyle();
      }
      static PROMPT_STYLES={
        default:{html:cwd=>`<span class="nt-ph">huebos</span><span class="nt-pp">@local</span>:<span class="nt-pid nt-ph">${cwd}</span><span class="nt-pp">$</span>`,text:cwd=>`huebos@local:${cwd}$`},
        minimal:{html:cwd=>`<span class="nt-pid nt-ph">${cwd}</span><span class="nt-pp">$</span>`,text:cwd=>`${cwd}$`},
        arrow:{html:cwd=>`<span class="nt-pid nt-ph">${cwd}</span> <span class="nt-pp">➜</span>`,text:cwd=>`${cwd} ➜`},
        full:{html:cwd=>`<span class="nt-pp">[</span><span class="nt-ph">huebos@local</span> <span class="nt-pid nt-ph">${cwd}</span><span class="nt-pp">]$</span>`,text:cwd=>`[huebos@local ${cwd}]$`},
      };
      _currentCwdDisplay(){return this._cwd==='/home'?'~':this._cwd.replace(/^\/home/,'~');}
      _applyPromptStyle(){
        const style=TerminalCore.PROMPT_STYLES[this.promptStyle]||TerminalCore.PROMPT_STYLES.default;
        if(this.promptEl)this.promptEl.innerHTML=style.html(this._currentCwdDisplay());
        this.promptPath=this.promptEl?this.promptEl.querySelector('.nt-pid'):this.promptPath;
      }
      _promptPrefixText(){
        const style=TerminalCore.PROMPT_STYLES[this.promptStyle]||TerminalCore.PROMPT_STYLES.default;
        return style.text(this._currentCwdDisplay());
      }
      get cwd(){return this._cwd;}
      setCwd(p){this._cwd=p;this._applyPromptStyle();if(this.cwdDisplay)this.cwdDisplay.textContent=this._currentCwdDisplay();this.kernel.procs.setCwd(this.termProc.pid,p);}
      resolvePath(p){
        if(!p||p==='~')return'/home';if(p.startsWith('~/'))return'/home/'+p.slice(2);
        if(p.startsWith('/'))return p.replace(/\/+/g,'/').replace(/\/$/,'')||'/';
        const parts=(this._cwd+'/'+p).split('/').filter(Boolean);const stack=[];
        for(const pt of parts){if(pt==='.')continue;if(pt==='..')stack.pop();else stack.push(pt);}
        return'/'+stack.join('/')||'/';
      }
      _makeCtx(){
        return {
          kernel:this.kernel,registry:this.registry,env:this.env,history:this.history,
          termProc:this.termProc,cwd:this._cwd,resolvePath:(p)=>this.resolvePath(p),
          print:(t,c)=>this.renderer.print(t,c),printHTML:(h,c)=>this.renderer.printHTML(h,c),
          clear:()=>this.renderer.clear(),scrollBottom:()=>this.renderer.scrollBottom(),
          exitCode:this.exitCode,setExitCode:(c)=>{this.exitCode=c;},
          escapeHtml:escapeHtml,
        };
      }
      async exec(raw){
        const trimmed=(raw||'').trim();
        if(!trimmed)return;
        const ps=`${this._promptPrefixText()} ${trimmed}`;
        this.renderer.print(ps,'nt-cmd');
        this.history.add(trimmed);
        const aliasExpanded=await this.alias.expand(trimmed);
        const expanded=await this.env.expandAsyncWithExtra(aliasExpanded, {ERRORLEVEL:String(this.exitCode)});
        const ast=Parser.parse(expanded);
        if(!ast.commands.length){this.renderer.scrollBottom();return;}
        const ctx=this._makeCtx();
        await this._runPipeline(ast,ctx);
        this.renderer.scrollBottom();
      }
      async _runPipeline(ast,ctx){
        const {commands,operators}=ast;
        let i=0;
        while(i<commands.length){
          let j=i;
          const segment=[commands[i]];
          while(j<operators.length&&operators[j]==='|'){segment.push(commands[j+1]);j++;}
          await Pipe.run({commands:segment,operators:[]},ctx,(cmd,c,stdin)=>this._execCommand(cmd,c,stdin));
          const lastExit=this.exitCode;
          const boundaryOp=operators[j];
          i=j+1;
          if(boundaryOp==='&&'&&lastExit!==0)break;
          if(boundaryOp==='||'&&lastExit===0)break;
        }
      }
      async _execCommand(cmdSpec,ctx,stdin){
        const spec=this.registry.resolve(cmdSpec.name);
        if(!spec){
          this.renderer.print(`comando no encontrado: ${cmdSpec.name}`,'nt-err');
          this.exitCode=127;return;
        }
        const{positionals,flags}=ArgResolver.resolve(cmdSpec.tokens,spec);
        ctx.args=positionals;ctx.flags=flags;ctx.raw=cmdSpec.tokens;ctx.stdin=stdin;
        let redirectCtx=null;
        try{redirectCtx=await Redirect.apply(cmdSpec.redirects,ctx);}
        catch(e){this.renderer.print(`Error de redirección: ${e.message}`,'nt-err');this.exitCode=1;return;}
        if(redirectCtx?.stdinContent!=null) ctx.stdin=redirectCtx.stdinContent;
        try{
          const result=await spec.execute(ctx);
          this.exitCode=result?.exitCode??0;
        }catch(err){
          this.exitCode=ErrorHandler.report(err,ctx)??1;
        }
        if(redirectCtx)await redirectCtx.flush();
      }
      async handleKey(e){
        if(e.key==='Enter'){const v=this.cmdInput.value;this.cmdInput.value='';this.history.reset();await this.exec(v);}
        else if(e.key==='ArrowUp'){e.preventDefault();const h=this.history.up();if(h!==null){this.cmdInput.value=h;setTimeout(()=>{this.cmdInput.selectionStart=this.cmdInput.selectionEnd=this.cmdInput.value.length;},0);}}
        else if(e.key==='ArrowDown'){e.preventDefault();const h=this.history.down();if(h!==null){this.cmdInput.value=h;}else{this.cmdInput.value='';}}
        else if(e.key==='Tab'){
          e.preventDefault();
          const v=this.cmdInput.value;
          const ctx=this._makeCtx();
          ctx.cwd=this._cwd;
          const result=await Completer.complete(v,ctx);
          if(result?.replace!==null&&result?.replace!==undefined){this.cmdInput.value=result.replace;}
          else if(result?.completions?.length>1){this.renderer.print(v,'nt-dim');this.renderer.printHTML(result.completions.map(c=>`<span class="nt-file">${escapeHtml(c)}</span>`).join('  '));this.renderer.scrollBottom();}
        }
        else if(e.key==='l'&&e.ctrlKey){e.preventDefault();this.renderer.clear();}
      }
    }

          async execute(ctx){

          async execute(ctx){
            ctx.print('uefi: abriendo firmware UEFI…','nt-info');
            const target=new URL('../../uefi.html', window.parent.location.href);
            window.parent.open(target.toString(),'_blank');
            return{exitCode:0};
          }
        },
        {name:'safe-mode',description:'Estado safe mode',usage:'safe-mode',
          async execute(ctx){
            ctx.print(`Safe Mode: ${K.safeMode?'ACTIVO ⚠':'inactivo'}`,'nt-info');
            ctx.print('Use "reboot safe" para iniciar en Safe Mode.','nt-dim');
            return{exitCode:0};
          }
        },
        {name:'ver',description:'Versión del sistema',usage:'ver',
          async execute(ctx){
            ctx.print(`HUEBOS [Versión ${K.version||'0.4.0'}]`,'nt-info');
            ctx.print('(c) HUEBOS. Todos los derechos reservados.','nt-dim');
            return{exitCode:0};
          }
        },
        {name:'systeminfo',description:'Información del sistema',usage:'systeminfo',
          async execute(ctx){
            const upSec=K.uptimeSeconds;
            const upStr=upSec>=3600?`${Math.floor(upSec/3600)}h ${Math.floor((upSec%3600)/60)}m`:`${Math.floor(upSec/60)}m ${upSec%60}s`;
            ctx.print('Información del sistema:','nt-info');
            ctx.print(`  Kernel         : ${K.version||'0.4.0'}`,'nt-out');
            ctx.print(`  Resolución     : ${screen.width}×${screen.height}`,'nt-out');
            ctx.print(`  CPU            : ${navigator.hardwareConcurrency} core(s)`,'nt-out');
            ctx.print(`  Memoria        : ${navigator.deviceMemory?navigator.deviceMemory+' GB':'N/D'}`,'nt-out');
            ctx.print(`  Uptime         : ${upStr}`,'nt-out');
            ctx.print(`  Session        : #${K.session?.count??'?'}`,'nt-out');
            ctx.print(`  Safe Mode      : ${K.safeMode?'ON':'off'}`,'nt-out');
            ctx.print(`  PID Terminal   : ${termProc.pid}`,'nt-out');
            return{exitCode:0};
          }
        },
        {name:'date',description:'Mostrar fecha actual',usage:'date',
          async execute(ctx){ctx.print(new Date().toLocaleDateString('es',{weekday:'long',year:'numeric',month:'long',day:'numeric'}),'nt-out');return{exitCode:0};}
        },
        {name:'time',description:'Mostrar hora actual',usage:'time',
          async execute(ctx){ctx.print(new Date().toLocaleTimeString('es'),'nt-out');return{exitCode:0};}
        },
        {name:'exit',description:'Cerrar terminal',usage:'exit',
          async execute(ctx){
            ctx.print('exit: cerrando terminal…','nt-info');
            window.parent.__wos.closeWindow(termProc.pid);
            return{exitCode:0};
          }
        },
        {name:'find',description:'Buscar texto en archivos',usage:'find <texto> [ruta]',
          async execute(ctx){
            const needle=ctx.args[0];if(!needle){ctx.print('Uso: find <texto> [ruta]','nt-err');return{exitCode:1};}
            const root=ctx.args[1]?resolvePath(ctx.args[1]):core.cwd;
            let count=0;
            async function search(dir){
              const entries=await K.fs.readdir(dir);
              for(const e of entries){
                if(e.type==='dir'){await search(e.id);}
                else if(e.encoding!=='binary'){
                  const content=await K.fs.read(e.id).catch(()=>'');
                  if(content.includes(needle)){ctx.print(`${e.id}`,'nt-file');count++;}
                }
              }
            }
            await search(root);
            if(count===0)ctx.print('(sin coincidencias)','nt-dim');
            else ctx.print(`Encontradas ${count} coincidencia(s)`,'nt-success');
            return{exitCode:0};
          }
        },
        {name:'findstr',description:'Buscar texto (alias de find)',usage:'findstr <texto> [ruta]',
          async execute(ctx){const spec=core.registry.resolve('find');return spec.execute(ctx);}
        },
        {name:'sort',description:'Ordenar líneas',usage:'sort [archivo]',
          flags:[{short:'r',long:'reverse',description:'Orden inverso'}],
          async execute(ctx){
            let input=ctx.stdin||'';
            if(ctx.args[0]){input=await K.fs.read(resolvePath(ctx.args[0])).catch(()=>'');}
            if(!input){ctx.print('(sin entrada)','nt-dim');return{exitCode:0};}
            let lines=input.split('\n').filter(Boolean);
            lines.sort((a,b)=>a.localeCompare(b));
            if(ctx.flags.r||ctx.flags.reverse)lines.reverse();
            lines.forEach(l=>ctx.print(l,'nt-out'));
            return{exitCode:0};
          }
        },
        {name:'more',description:'Mostrar contenido paginado',usage:'more <archivo>',
          async execute(ctx){
            const pa=ctx.args[0];if(!pa){ctx.print('Uso: more <archivo>','nt-err');return{exitCode:1};}
            const target=resolvePath(pa);const content=await K.fs.read(target).catch(()=>null);
            if(content===null){ctx.print(`more: ${target}: No existe`,'nt-err');return{exitCode:1};}
            const lines=content.split('\n');
            const pageSize=20;
            const cmdInput=core.cmdInput;
            function waitEnter(){
              return new Promise(resolve=>{
                const handler=(e)=>{
                  if(e.key==='Enter'){e.preventDefault();cmdInput.removeEventListener('keydown',handler);resolve(true);}
                  else if(e.key==='q'||e.key==='Escape'){e.preventDefault();cmdInput.removeEventListener('keydown',handler);resolve(false);}
                };
                cmdInput.addEventListener('keydown',handler);
              });
            }
            for(let i=0;i<lines.length;i+=pageSize){
              for(let j=i;j<Math.min(i+pageSize,lines.length);j++)ctx.print(lines[j],'nt-out');
              if(i+pageSize<lines.length){
                ctx.print('-- más -- (Enter para continuar, q para salir)','nt-dim');
                ctx.scrollBottom();
                const cont=await waitEnter();
                if(!cont){ctx.print('(more: interrumpido)','nt-dim');return{exitCode:0};}
              }
            }
            return{exitCode:0};
          }
        },
        {name:'assoc',description:'Asociaciones de extensiones',usage:'assoc [ext]',
          async execute(ctx){
            const bindings=Object.fromEntries(K.extensions.list().map(e=>[e.extension,e.handler]));
            const keys=Object.keys(bindings).sort();
            if(ctx.args[0]){
              const ext=ctx.args[0].startsWith('.')?ctx.args[0]:'.'+ctx.args[0];
              const app=bindings[ext];
              if(app)ctx.print(`${ext}=${app}`,'nt-out');
              else ctx.print(`assoc: sin asociación para ${ext}`,'nt-dim');
              return{exitCode:0};
            }
            if(!keys.length){ctx.print('(sin asociaciones)','nt-dim');return{exitCode:0};}
            keys.forEach(k=>ctx.print(`${k}=${bindings[k]}`,'nt-out'));
            return{exitCode:0};
          }
        },
        {name:'start',description:'Iniciar aplicación',usage:'start <appId> [archivo]',
          async execute(ctx){
            const appId=ctx.args[0];if(!appId){ctx.print('Uso: start <appId> [archivo]','nt-err');return{exitCode:1};}
            const app=await K.apps.get(appId);
            if(!app){ctx.print(`start: aplicación '${appId}' no encontrada`,'nt-err');return{exitCode:1};}
            const filePath=ctx.args[1]?resolvePath(ctx.args[1]):null;
            window.parent.__wos.launch(appId,filePath?{filePath}:{});
            ctx.print(`start: ${appId}${filePath?' '+filePath:''} iniciada`,'nt-success');
            return{exitCode:0};
          }
        },
        {name:'prompt',description:'Cambiar estilo de prompt (default, minimal, arrow, full)',usage:'prompt [estilo]',
          async execute(ctx){
            const valid=Object.keys(TerminalCore.PROMPT_STYLES);
            if(!ctx.args[0]){
              ctx.print(`Estilo actual: '${core.promptStyle}'`,'nt-info');
              ctx.print(`Disponibles: ${valid.join(', ')}`,'nt-dim');
              return{exitCode:0};
            }
            const style=ctx.args[0];
            if(!valid.includes(style)){
              ctx.print(`prompt: estilo inválido '${style}'. Usa: ${valid.join(', ')}`,'nt-err');
              return{exitCode:1};
            }
            core.promptStyle=style;
            core._applyPromptStyle();
            await K.prefs.set('terminal.promptStyle',style);
            ctx.print(`prompt: estilo cambiado a '${style}'`,'nt-success');
            return{exitCode:0};
          }
        },
        {name:'color',description:'Cambiar tema de color del sistema (dark, amber, blue)',usage:'color [tema]',
          async execute(ctx){
            const valid=['dark','amber','blue'];
            if(!ctx.args[0]){
              const current=await K.prefs.get('system.theme','dark');
              ctx.print(`Tema actual: '${current}'`,'nt-info');
              ctx.print(`Disponibles: ${valid.join(', ')}`,'nt-dim');
              return{exitCode:0};
            }
            const theme=ctx.args[0];
            if(!valid.includes(theme)){
              ctx.print(`color: tema inválido '${theme}'. Usa: ${valid.join(', ')}`,'nt-err');
              return{exitCode:1};
            }
            await K.prefs.set('system.theme',theme);
            ctx.print(`color: tema del sistema cambiado a '${theme}'`,'nt-success');
            return{exitCode:0};
          }
        },
        {name:'title',description:'Cambiar título de ventana',usage:'title <texto>',
          async execute(ctx){
            const text=ctx.args.join(' ')||'Terminal';
            window.parent.__wos.setWindowTitle(termProc.pid,text);
            ctx.print(`title: ${text}`,'nt-success');
            return{exitCode:0};
          }
        },
        {name:'alias',aliases:['doskey'],description:'Crear/listar alias',usage:'alias [nombre=comando]',
          async execute(ctx){
            const all=await K.prefs.get('terminal.aliases')||{};
            if(ctx.args.length===0){
              const keys=Object.keys(all).sort();
              if(!keys.length){ctx.print('(sin alias)','nt-dim');return{exitCode:0};}
              keys.forEach(k=>ctx.printHTML(`  <span style="color:var(--g)">${k}</span>=<span style="color:var(--amber)">${escapeHtml(all[k])}</span>`));
              return{exitCode:0};
            }
            const kv=ctx.args.join(' ');
            const eq=kv.indexOf('=');
            if(eq<0){const v=all[kv];ctx.print(v||'(undefined)','nt-out');return{exitCode:0};}
            const key=kv.slice(0,eq).trim();const val=kv.slice(eq+1).trim();
            all[key]=val;await K.prefs.set('terminal.aliases',all);
            ctx.print(`alias: ${key}=${val}`,'nt-success');return{exitCode:0};
          }
        },
        {name:'path',description:'Mostrar ruta de búsqueda',usage:'path',
          async execute(ctx){
            const p=await K.env.get('PATH')||'/system/bin:/home/bin';
            p.split(':').forEach(d=>ctx.print(d,'nt-out'));
            return{exitCode:0};
          }
        },
        {name:'chcp',description:'Code page (informativo)',usage:'chcp',
          async execute(ctx){ctx.print('Página de códigos activa: 65001 (UTF-8)','nt-info');return{exitCode:0};}
        },
        {name:'mode',description:'Modo de terminal (informativo)',usage:'mode',
          async execute(ctx){ctx.print('Modo de terminal: 80×24 (emulado)','nt-info');return{exitCode:0};}
        },
        {name:'attrib',description:'Atributos de archivo',usage:'attrib <ruta>',
          async execute(ctx){
            const pa=ctx.args[0];if(!pa){ctx.print('Uso: attrib <ruta>','nt-err');return{exitCode:1};}
            const target=resolvePath(pa);const node=await K.fs.stat(target);
            if(!node){ctx.print(`attrib: ${target}: No existe`,'nt-err');return{exitCode:1};}
            const attrs=[];
            if(node.type==='dir')attrs.push('D');
            if(node.encoding==='binary')attrs.push('B');
            if(node.meta?.protected||node.meta?.systemApp||target.startsWith('/system'))attrs.push('S');
            ctx.print(`  ${attrs.join('')||'---'}  ${target}`,'nt-out');
            return{exitCode:0};
          }
        },
        {name:'comp',aliases:['fc'],description:'Comparar dos archivos',usage:'comp <archivo1> <archivo2>',
          async execute(ctx){
            const[a,b]=ctx.args;
            if(!a||!b){ctx.print('Uso: comp <archivo1> <archivo2>','nt-err');return{exitCode:1};}
            const c1=await K.fs.read(resolvePath(a)).catch(()=>null);
            const c2=await K.fs.read(resolvePath(b)).catch(()=>null);
            if(c1===null){ctx.print(`comp: ${a}: No existe`,'nt-err');return{exitCode:1};}
            if(c2===null){ctx.print(`comp: ${b}: No existe`,'nt-err');return{exitCode:1};}
            if(c1===c2){ctx.print('Los archivos son idénticos.','nt-success');return{exitCode:0};}
            const l1=c1.split('\n'),l2=c2.split('\n');
            const maxLen=Math.max(l1.length,l2.length);
            let diffs=0;
            for(let i=0;i<maxLen;i++){
              if(l1[i]!==l2[i]){ctx.print(`  línea ${i+1}:`,'nt-err');ctx.print(`    < ${l1[i]??'(vacío)'}`,'nt-dim');ctx.print(`    > ${l2[i]??'(vacío)'}`,'nt-dim');diffs++;}
            }
            ctx.print(`Diferencias: ${diffs}`,'nt-info');
            return{exitCode:diffs>0?1:0};
          }
        },
        {name:'errorlevel',description:'Mostrar último código de salida',usage:'errorlevel',
          async execute(ctx){ctx.print(`%ERRORLEVEL% = ${core.exitCode}`,'nt-out');return{exitCode:0};}
        },
        {name:'rem',description:'Comentario (no-op)',usage:'rem [...texto]',
          async execute(ctx){return{exitCode:0};}
        },
        {name:'pause',description:'Pausar hasta presionar Enter',usage:'pause',
          async execute(ctx){
            ctx.print('Presione Enter para continuar…','nt-dim');
            const cmdInput=core.cmdInput;
            return new Promise(resolve=>{
              const handler=(e)=>{if(e.key==='Enter'){e.preventDefault();cmdInput.removeEventListener('keydown',handler);resolve({exitCode:0});}};
              cmdInput.addEventListener('keydown',handler);
            });
          }
        },
      ];
    }

    return{Parser,CommandRegistry,ArgResolver,ErrorHandler,EnvStore,Redirect,Pipe,History,Alias,Completer,Renderer,TerminalCore,buildCommandSpecs};
  })();

  /* ── Boot de la app: se ejecuta dentro del iframe que crea shell.html ── */
  function boot(){
    const K = window.parent.Kernel;
    const params = new URLSearchParams(window.location.search);
    const pid = parseInt(params.get('pid'), 10);
    const termProc = K.procs.get(pid);
    const outputEl = document.getElementById('nt-output');

    if (!termProc) {
      outputEl.innerHTML = '<div class="nt-line nt-err">No se pudo vincular al proceso (pid inválido).</div>';
      return;
    }

    const renderer = new TerminalModule.Renderer(outputEl);
    const core = new TerminalModule.TerminalCore({
      kernel: K,
      termProc,
      renderer,
      cmdInput: document.getElementById('nt-cmd-input'),
      promptEl: document.getElementById('nt-prompt'),
      cwdDisplay: document.getElementById('nt-cwd-label'),
    });
    core.registry.registerAll(TerminalModule.buildCommandSpecs(core));

    core.init().then(() => {
      renderer.print('HUEBOS Terminal — escribe "help" para ver los comandos disponibles.', 'nt-success');
      core.setCwd(termProc.cwd || '/home');
      document.getElementById('nt-cmd-input').focus();
    });

    document.getElementById('nt-cmd-input').addEventListener('keydown', e => core.handleKey(e));
    document.querySelector('.native-terminal').addEventListener('click', () => {
      document.getElementById('nt-cmd-input').focus();
    });
  }

  function waitForParentKernel(){
    if (window.parent && window.parent.Kernel) {
      if (window.parent.Kernel.isReady) boot();
      else window.parent.Kernel.once('ready', boot);
      return;
    }
    let tries = 0;
    const iv = setInterval(() => {
      if (window.parent && window.parent.Kernel) {
        clearInterval(iv);
        if (window.parent.Kernel.isReady) boot();
        else window.parent.Kernel.once('ready', boot);
      }
      if (++tries > 50) clearInterval(iv);
    }, 100);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitForParentKernel);
  } else {
    waitForParentKernel();
  }
})();
  </script>
