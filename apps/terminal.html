<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --green: #00ff88;
      --green-dim: #00aa55;
      --green-faint: #003322;
      --red-err: #ff4444;
      --bg: #030a05;
      --glow-sm: 0 0 4px #00ff8888;
    }
    
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }
    
    body {
      display: flex;
      flex-direction: column;
      padding: 8px;
    }
    
    .terminal {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 0.75rem;
      line-height: 1.5;
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      color: var(--green);
      text-shadow: var(--glow-sm);
      caret-color: var(--green);
      word-break: break-all;
      white-space: pre-wrap;
    }
    
    .terminal::-webkit-scrollbar { width: 5px; }
    .terminal::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 2px; }
    
    .input-line {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    
    .prompt {
      flex-shrink: 0;
      color: var(--green);
      user-select: none;
    }
    
    .input-line input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--green);
      font-family: inherit;
      font-size: inherit;
      outline: none;
      caret-color: var(--green);
    }
    
    .error {
      color: var(--red-err);
      text-shadow: 0 0 4px #ff444488;
    }
    
    .output {
      color: var(--green-dim);
      margin: 2px 0;
    }
    
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="terminal" id="terminal"></div>
  <div class="input-line">
    <span class="prompt" id="prompt">$</span>
    <input type="text" id="input" autocomplete="off" spellcheck="false" />
  </div>

  <script>
    const Kernel = window.parent.Kernel;
    
    class Terminal {
      constructor() {
        this.currentPath = '/home';
        this.history = [];
        this.historyIndex = -1;
        this.input = document.getElementById('input');
        this.output = document.getElementById('terminal');
        this.prompt = document.getElementById('prompt');
        this.init();
      }
      
      init() {
        this.input.addEventListener('keydown', (e) => this.handleKeyDown(e));
        this.updatePrompt();
        this.println('WebOS Terminal v0.1.0');
        this.println('Escribe "help" para ver comandos disponibles');
        this.println('');
        this.input.focus();
      }
      
      handleKeyDown(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          this.executeCommand(this.input.value);
          this.history.push(this.input.value);
          this.historyIndex = this.history.length;
          this.input.value = '';
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (this.historyIndex > 0) {
            this.historyIndex--;
            this.input.value = this.history[this.historyIndex];
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (this.historyIndex < this.history.length - 1) {
            this.historyIndex++;
            this.input.value = this.history[this.historyIndex];
          } else {
            this.historyIndex = this.history.length;
            this.input.value = '';
          }
        }
      }
      
      async executeCommand(cmd) {
        cmd = cmd.trim();
        this.println(`$ ${cmd}`);
        
        if (!cmd) return;
        
        const parts = cmd.split(/\s+/);
        const action = parts[0];
        const args = parts.slice(1);
        
        try {
          switch (action) {
            case 'help':
              this.printHelp();
              break;
            case 'ls':
              await this.cmdList(args);
              break;
            case 'cd':
              await this.cmdCd(args);
              break;
            case 'pwd':
              this.println(this.currentPath);
              break;
            case 'cat':
              await this.cmdCat(args);
              break;
            case 'mkdir':
              await this.cmdMkdir(args);
              break;
            case 'rm':
              await this.cmdRm(args);
              break;
            case 'mv':
              await this.cmdMv(args);
              break;
            case 'echo':
              this.println(args.join(' '));
              break;
            case 'clear':
              this.output.textContent = '';
              break;
            case 'touch':
              await this.cmdTouch(args);
              break;
            default:
              this.printError(`Comando no reconocido: ${action}`);
          }
        } catch (err) {
          this.printError(err.message);
        }
        
        this.updatePrompt();
        this.println('');
        this.scrollToBottom();
      }
      
      async cmdList(args) {
        const path = args[0] || this.currentPath;
        const items = await Kernel.fs.readdir(this.normalizePath(path));
        
        if (items.length === 0) {
          this.println('(vacío)');
          return;
        }
        
        const sorted = items.sort((a, b) => a.name.localeCompare(b.name));
        sorted.forEach(item => {
          const type = item.type === 'dir' ? '/' : '';
          const size = item.type === 'dir' ? '' : `${(item.size / 1024).toFixed(1)}K`;
          const line = `${item.name}${type}`.padEnd(30) + size;
          this.println(line);
        });
      }
      
      async cmdCd(args) {
        if (args.length === 0) {
          this.currentPath = '/home';
          return;
        }
        
        let newPath = this.normalizePath(args[0]);
        const stat = await Kernel.fs.stat(newPath);
        
        if (!stat) throw new Error(`Directorio no encontrado: ${args[0]}`);
        if (stat.type !== 'dir') throw new Error(`No es un directorio: ${args[0]}`);
        
        this.currentPath = newPath;
      }
      
      async cmdCat(args) {
        if (args.length === 0) throw new Error('Especifica un archivo');
        
        const path = this.normalizePath(args[0]);
        const content = await Kernel.fs.read(path);
        this.println(content);
      }
      
      async cmdMkdir(args) {
        if (args.length === 0) throw new Error('Especifica un nombre de directorio');
        
        const path = this.normalizePath(args[0]);
        await Kernel.fs.mkdir(path);
        this.println(`Directorio creado: ${path}`);
      }
      
      async cmdRm(args) {
        if (args.length === 0) throw new Error('Especifica un archivo o directorio');
        
        const recursive = args[0] === '-r' || args[0] === '-rf';
        const target = this.normalizePath(recursive ? args[1] : args[0]);
        
        await Kernel.fs.remove(target, { recursive });
        this.println(`Eliminado: ${target}`);
      }
      
      async cmdMv(args) {
        if (args.length < 2) throw new Error('Especifica origen y destino');
        
        const src = this.normalizePath(args[0]);
        const dst = this.normalizePath(args[1]);
        
        await Kernel.fs.move(src, dst);
        this.println(`Movido: ${src} → ${dst}`);
      }
      
      async cmdTouch(args) {
        if (args.length === 0) throw new Error('Especifica un archivo');
        
        const path = this.normalizePath(args[0]);
        const exists = await Kernel.fs.exists(path);
        
        if (exists) {
          await Kernel.fs.write(path, await Kernel.fs.read(path));
        } else {
          await Kernel.fs.write(path, '');
        }
      }
      
      normalizePath(path) {
        if (path.startsWith('/')) return path;
        if (path === '.') return this.currentPath;
        if (path === '..') {
          const parts = this.currentPath.split('/').filter(p => p);
          parts.pop();
          return '/' + parts.join('/') || '/';
        }
        return this.currentPath === '/' ? `/${path}` : `${this.currentPath}/${path}`;
      }
      
      printHelp() {
        const cmds = [
          'Comandos disponibles:',
          '',
          'ls [path]        - Listar archivos',
          'cd [path]        - Cambiar directorio',
          'pwd              - Mostrar directorio actual',
          'cat <file>       - Mostrar contenido',
          'mkdir <dir>      - Crear directorio',
          'touch <file>     - Crear archivo vacío',
          'rm [-r] <path>   - Eliminar archivo/directorio',
          'mv <src> <dst>   - Mover/renombrar',
          'echo <text>      - Mostrar texto',
          'clear            - Limpiar pantalla',
          'help             - Mostrar esta ayuda',
        ];
        cmds.forEach(cmd => this.println(cmd));
      }
      
      updatePrompt() {
        const name = this.currentPath === '/' ? '/' : this.currentPath.split('/').pop();
        this.prompt.textContent = `${name} $`;
      }
      
      println(text = '') {
        const line = document.createElement('div');
        line.className = 'output';
        line.textContent = text;
        this.output.appendChild(line);
      }
      
      printError(text) {
        const line = document.createElement('div');
        line.className = 'error output';
        line.textContent = text;
        this.output.appendChild(line);
      }
      
      scrollToBottom() {
        this.output.parentElement.scrollTop = this.output.parentElement.scrollHeight;
      }
    }
    
    if (Kernel.isReady) {
      new Terminal();
    } else {
      Kernel.once('ready', () => new Terminal());
    }
  </script>

</body>
</html>
