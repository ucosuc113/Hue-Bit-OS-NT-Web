<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WebOS · Terminal</title>
  <script type="application/json" id="wos-manifest">
  {
    "id":          "terminal",
    "name":        "Terminal",
    "version":     "0.1.0",
    "icon":        "⌨️",
    "category":    "system",
    "singleton":   false,
    "description": "Terminal de línea de comandos",
    "winWidth":    640,
    "winHeight":   420,
    "author":      "WebOS"
  }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #00ff88; --green-dim: #00aa55; --green-faint: #003322;
      --green-dark: #001a0e; --amber: #ffb300; --red-err: #ff4444;
      --blue: #00ccff; --bg: #030a05;
      --font: 'Share Tech Mono', monospace;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--green);
      font-family: var(--font); font-size: 13px;
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    #term-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 10px; border-bottom: 1px solid rgba(0,255,136,0.12);
      background: var(--green-dark); font-size: 11px;
      color: var(--green-dim); flex-shrink: 0;
    }
    #term-header .title { color: var(--green-dim); }
    #cwd-display { color: var(--green); font-size: 11px; }

    /* ── Output ── */
    #output {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 8px 10px; font-size: 12.5px; line-height: 1.55;
      scroll-behavior: smooth;
    }

    .tl { white-space: pre-wrap; word-break: break-all; min-height: 1em; }
    .tc { color: var(--green); }            /* command echo */
    .to { color: #9ec9b4; }                 /* normal output */
    .te { color: var(--red-err); }          /* error */
    .td { color: var(--blue); }             /* directory */
    .tf { color: var(--green-dim); }        /* file */
    .ti { color: var(--amber); }            /* info/highlight */
    .ts { color: var(--green-dim); opacity: 0.55; } /* system/dim */

    /* ── Input line ── */
    #input-wrap {
      display: flex; align-items: center; padding: 5px 10px;
      border-top: 1px solid rgba(0,255,136,0.12);
      background: var(--green-dark); flex-shrink: 0;
    }
    #prompt {
      color: var(--green); white-space: nowrap; flex-shrink: 0;
      font-size: 12.5px; margin-right: 4px;
    }
    #prompt .ph { color: var(--blue); }
    #prompt .pp { color: var(--green-dim); }
    #cmd-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--green); font-family: var(--font); font-size: 12.5px;
      caret-color: var(--green);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--green-faint); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }
  </style>
</head>
<body>

<div id="term-header">
  <span class="title">⌨ WebOS Terminal v0.1.0</span>
  <span id="cwd-display">/home</span>
</div>

<div id="output"></div>

<div id="input-wrap">
  <span id="prompt"><span class="ph">webos</span><span class="pp">@local</span>:<span id="prompt-path" class="ph">~</span><span id="prompt-symbol" class="pp">$</span></span>&nbsp;
  <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" autofocus />
</div>

<script>
;(function () {
  'use strict';

  const DEFAULT_PREFS = {
    'system.theme': 'dark',
    'system.fontSize': 14,
    'shell.prompt': '$ ',
    'shell.history': [],
  };

  const THEME_PALETTES = {
    dark: {
      green: '#00ff88',
      greenDim: '#00aa55',
      greenFaint: '#003322',
      greenDark: '#001a0e',
      amber: '#ffb300',
      red: '#ff4444',
      blue: '#00ccff',
      bg: '#030a05',
    },
    amber: {
      green: '#ffbf47',
      greenDim: '#c98a18',
      greenFaint: '#3a2300',
      greenDark: '#221300',
      amber: '#ffd36b',
      red: '#ff6868',
      blue: '#ffd36b',
      bg: '#0b0601',
    },
    blue: {
      green: '#6ee7ff',
      greenDim: '#2ea9d6',
      greenFaint: '#062433',
      greenDark: '#041824',
      amber: '#7de3ff',
      red: '#ff6b6b',
      blue: '#00ccff',
      bg: '#020912',
    },
  };

  const outputEl       = document.getElementById('output');
  const inp            = document.getElementById('cmd-input');
  const ppEl           = document.getElementById('prompt-path');
  const promptSymbolEl = document.getElementById('prompt-symbol');
  const cwdEl          = document.getElementById('cwd-display');

  let K           = null;
  let cwd         = '/home';
  let cmdHistory  = [];
  let histIdx     = -1;
  let locked      = false;
  let promptValue = DEFAULT_PREFS['shell.prompt'];

  function getKernel() {
    if (window.parent && window.parent !== window && window.parent.Kernel?.isReady) return window.parent.Kernel;
    if (window.Kernel?.isReady) return window.Kernel;
    return null;
  }

  function waitForKernel(cb) {
    const k = getKernel();
    if (k) { cb(k); return; }

    const check = () => {
      const next = getKernel();
      if (next) { cb(next); return; }
      setTimeout(check, 100);
    };

    if (window.parent !== window && window.parent.Kernel?.once) {
      window.parent.Kernel.once('ready', () => cb(window.parent.Kernel));
      return;
    }

    setTimeout(check, 100);
  }

  /* ═══════════════════════ PRINT UTILS ═══════════════════════ */

  function print(text = '', cls = 'to') {
    const el = document.createElement('pre');
    el.className = 'tl ' + cls;
    el.textContent = text;
    outputEl.appendChild(el);
    scrollEnd();
    return el;
  }

  function printHTML(html, cls = 'to') {
    const el = document.createElement('pre');
    el.className = 'tl ' + cls;
    el.innerHTML = html;
    outputEl.appendChild(el);
    scrollEnd();
    return el;
  }

  function printBlank() { print(''); }

  function scrollEnd() { outputEl.scrollTop = outputEl.scrollHeight; }

  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function normalizePrompt(value) {
    const clean = String(value || DEFAULT_PREFS['shell.prompt']).trim();
    return (clean || '$') + ' ';
  }

  function currentPromptText() {
    const display = cwd.startsWith('/home') ? '~' + cwd.slice(5) : cwd;
    return `webos@local:${display || '/'}${normalizePrompt(promptValue)}`;
  }

  function applyTheme(theme) {
    const palette = THEME_PALETTES[theme] || THEME_PALETTES[DEFAULT_PREFS['system.theme']];
    const root = document.documentElement.style;
    root.setProperty('--green', palette.green);
    root.setProperty('--green-dim', palette.greenDim);
    root.setProperty('--green-faint', palette.greenFaint);
    root.setProperty('--green-dark', palette.greenDark);
    root.setProperty('--amber', palette.amber);
    root.setProperty('--red-err', palette.red);
    root.setProperty('--blue', palette.blue);
    root.setProperty('--bg', palette.bg);
  }

  function applyFontSize(size) {
    const nextSize = Math.max(10, Math.min(24, Number(size) || DEFAULT_PREFS['system.fontSize']));
    document.documentElement.style.fontSize = `${nextSize}px`;
    outputEl.style.fontSize = `${nextSize}px`;
    inp.style.fontSize = `${nextSize}px`;
  }

  function applyPrompt(value) {
    promptValue = normalizePrompt(value);
    promptSymbolEl.textContent = promptValue.trim();
  }

  async function saveHistory() {
    if (!K) return;
    try {
      await K.prefs.set('shell.history', cmdHistory.slice(0, 500));
    } catch (_) {}
  }

  async function applyPrefs() {
    const all = await K.prefs.all();
    applyTheme(all['system.theme'] ?? DEFAULT_PREFS['system.theme']);
    applyFontSize(all['system.fontSize'] ?? DEFAULT_PREFS['system.fontSize']);
    applyPrompt(all['shell.prompt'] ?? DEFAULT_PREFS['shell.prompt']);
    cmdHistory = Array.isArray(all['shell.history']) ? all['shell.history'].slice(0, 500) : [];
    histIdx = -1;
    updatePrompt();
  }

  /* ═══════════════════════ PROMPT ═══════════════════════ */

  function updatePrompt() {
    const display = cwd.startsWith('/home') ? '~' + cwd.slice(5) : cwd;
    ppEl.textContent = display || '/';
    cwdEl.textContent = cwd;
    promptSymbolEl.textContent = promptValue.trim();
  }

  /* ═══════════════════════ PATH HELPERS ═══════════════════════ */

  function resolvePath(raw) {
    if (!raw || raw === '~') return '/home';
    if (raw.startsWith('~/')) return '/home' + raw.slice(1);
    if (raw.startsWith('/')) return K.fs._normalize(raw);
    if (raw === '..') return K.fs._dirname(cwd) || '/';
    if (raw === '.') return cwd;
    return K.fs._normalize(cwd + '/' + raw);
  }

  function fmtSize(b) {
    if (!b) return '0';
    if (b < 1024) return b + 'B';
    if (b < 1048576) return (b / 1024).toFixed(1) + 'K';
    return (b / 1048576).toFixed(1) + 'M';
  }

  function fmtDateLong(ts) {
    if (!ts) return '   ?  ?  ??:??';
    const d = new Date(ts);
    const mo  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    const day = String(d.getDate()).padStart(2,' ');
    const hh  = String(d.getHours()).padStart(2,'0');
    const mm  = String(d.getMinutes()).padStart(2,'0');
    return `${mo} ${day} ${hh}:${mm}`;
  }

  /* ═══════════════════════ COMMANDS ═══════════════════════ */

  const COMMANDS = {

    async pwd() {
      print(cwd);
    },

    async ls(args) {
      const flags   = args.filter(a => a.startsWith('-'));
      const targets = args.filter(a => !a.startsWith('-'));
      const path    = targets.length ? resolvePath(targets[0]) : cwd;
      const long    = flags.some(f => f.includes('l'));

      let stat;
      try { stat = await K.fs.stat(path); }
      catch { print(`ls: ${path}: No existe`, 'te'); return; }

      if (!stat) { print(`ls: ${path}: No existe`, 'te'); return; }

      if (stat.type === 'file') {
        if (long) print(`-rw-r--r--  ${fmtSize(stat.size).padStart(7)}  ${fmtDateLong(stat.mtime)}  ${stat.name}`);
        else      print(stat.name);
        return;
      }

      let entries;
      try { entries = await K.fs.readdir(path); }
      catch (e) { print(`ls: ${e.message}`, 'te'); return; }

      entries.sort((a, b) => {
        if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });

      if (!entries.length) { print('(vacío)', 'ts'); return; }

      if (long) {
        entries.forEach(e => {
          const t    = e.type === 'dir' ? 'd' : '-';
          const perm = e.type === 'dir' ? 'rwxr-xr-x' : 'rw-r--r--';
          const name = e.type === 'dir' ? e.name + '/' : e.name;
          const cls  = e.type === 'dir' ? 'td' : 'tf';
          print(`${t}${perm}  ${fmtSize(e.size).padStart(7)}  ${fmtDateLong(e.mtime)}  ${name}`, cls);
        });
      } else {
        const maxLen = Math.max(...entries.map(e => e.name.length + (e.type === 'dir' ? 1 : 0))) + 2;
        const cols   = Math.max(1, Math.floor(76 / maxLen));
        let row = '', htmlRow = '';

        entries.forEach((e, i) => {
          const name  = e.type === 'dir' ? e.name + '/' : e.name;
          const cls   = e.type === 'dir' ? 'td' : 'tf';
          htmlRow += `<span class="${cls}">${escH(name.padEnd(maxLen))}</span>`;
          if ((i + 1) % cols === 0 || i === entries.length - 1) {
            printHTML(htmlRow.trimEnd());
            htmlRow = '';
          }
        });
      }
    },

    async dir(args) {
      return COMMANDS.ls(args);
    },

    async cd(args) {
      const target = resolvePath(args[0] || '~');
      try {
        const s = await K.fs.stat(target);
        if (!s)                { print(`cd: ${target}: No existe`, 'te'); return; }
        if (s.type !== 'dir')  { print(`cd: ${target}: No es un directorio`, 'te'); return; }
        cwd = target;
        updatePrompt();
      } catch (e) { print(`cd: ${e.message}`, 'te'); }
    },

    async cat(args) {
      if (!args.length) { print('Uso: cat <archivo> [archivo2…]', 'te'); return; }
      for (const arg of args) {
        const path = resolvePath(arg);
        try {
          const content = await K.fs.read(path);
          if (args.length > 1) print(`==> ${arg} <==`, 'ti');
          print(content !== '' ? content : '(archivo vacío)', 'to');
        } catch (e) { print(`cat: ${arg}: ${e.message}`, 'te'); }
      }
    },

    async mkdir(args) {
      const paths = args.filter(a => !a.startsWith('-'));
      if (!paths.length) { print('Uso: mkdir <directorio>', 'te'); return; }
      for (const arg of paths) {
        try {
          await K.fs.mkdir(resolvePath(arg));
          print(`mkdir: directorio creado → '${resolvePath(arg)}'`, 'ts');
        } catch (e) { print(`mkdir: ${e.message}`, 'te'); }
      }
    },

    async touch(args) {
      if (!args.length) { print('Uso: touch <archivo>', 'te'); return; }
      for (const arg of args) {
        const path = resolvePath(arg);
        try {
          const exists = await K.fs.exists(path);
          if (!exists) {
            await K.fs.write(path, '');
            print(`touch: creado '${path}'`, 'ts');
          } else {
            const c = await K.fs.read(path);
            await K.fs.write(path, c); // update mtime
          }
        } catch (e) { print(`touch: ${e.message}`, 'te'); }
      }
    },

    async rm(args) {
      const flags = args.filter(a => a.startsWith('-'));
      const paths = args.filter(a => !a.startsWith('-'));
      const r     = flags.some(f => /r/i.test(f));

      if (!paths.length) { print('Uso: rm [-r] <ruta…>', 'te'); return; }

      const PROTECTED = new Set(['/', '/home', '/sys', '/tmp', '/home/apps', '/home/docs', '/home/media']);

      for (const arg of paths) {
        const path = resolvePath(arg);
        if (PROTECTED.has(path)) { print(`rm: no se puede eliminar '${path}': protegido`, 'te'); continue; }
        try {
          const s = await K.fs.stat(path);
          if (!s) { print(`rm: '${arg}': No existe`, 'te'); continue; }
          if (s.type === 'dir' && !r) { print(`rm: '${arg}': es directorio, usa rm -r`, 'te'); continue; }
          await K.fs.remove(path, { recursive: r });
          print(`rm: eliminado '${path}'`, 'ts');
        } catch (e) { print(`rm: ${e.message}`, 'te'); }
      }
    },

    async rmdir(args) {
      if (!args.length) { print('Uso: rmdir <directorio>', 'te'); return; }
      for (const arg of args) {
        const path = resolvePath(arg);
        try {
          await K.fs.remove(path);
          print(`rmdir: eliminado '${path}'`, 'ts');
        } catch (e) { print(`rmdir: ${e.message}`, 'te'); }
      }
    },

    async mv(args) {
      const paths = args.filter(a => !a.startsWith('-'));
      if (paths.length < 2) { print('Uso: mv <origen> <destino>', 'te'); return; }
      const src = resolvePath(paths[0]);
      let   dst = resolvePath(paths[1]);
      try {
        const dstStat = await K.fs.stat(dst);
        if (dstStat && dstStat.type === 'dir') dst = dst + '/' + K.fs._basename(src);
        await K.fs.move(src, dst);
        print(`'${src}' → '${dst}'`, 'ts');
      } catch (e) { print(`mv: ${e.message}`, 'te'); }
    },

    async cp(args) {
      const paths = args.filter(a => !a.startsWith('-'));
      if (paths.length < 2) { print('Uso: cp <origen> <destino>', 'te'); return; }
      const src = resolvePath(paths[0]);
      let   dst = resolvePath(paths[1]);
      try {
        const srcStat = await K.fs.stat(src);
        if (!srcStat) { print(`cp: '${paths[0]}': No existe`, 'te'); return; }
        if (srcStat.type === 'dir') { print(`cp: copia recursiva de directorios no soportada`, 'te'); return; }
        const content = await K.fs.read(src);
        const dstStat = await K.fs.stat(dst);
        if (dstStat && dstStat.type === 'dir') dst = dst + '/' + K.fs._basename(src);
        await K.fs.write(dst, content);
        print(`'${src}' → '${dst}'`, 'ts');
      } catch (e) { print(`cp: ${e.message}`, 'te'); }
    },

    async echo(args) {
      /* Handle redirects: echo text > file | echo text >> file */
      const gtgt = args.indexOf('>>');
      const gt   = args.indexOf('>');

      if (gtgt !== -1 && args[gtgt + 1]) {
        const text    = args.slice(0, gtgt).join(' ');
        const path    = resolvePath(args[gtgt + 1]);
        let   current = '';
        try { current = await K.fs.read(path); } catch {}
        await K.fs.write(path, current + (current ? '\n' : '') + text);
        return;
      }
      if (gt !== -1 && args[gt + 1]) {
        const text = args.slice(0, gt).join(' ');
        const path = resolvePath(args[gt + 1]);
        await K.fs.write(path, text);
        return;
      }

      print(args.join(' '));
    },

    async write(args) {
      /* write <file> — opens a tiny inline editor */
      if (!args.length) { print('Uso: write <archivo>', 'te'); return; }
      const path = resolvePath(args[0]);
      const text = prompt(`Contenido para '${path}':\n(Ctrl+Enter para confirmar)`);
      if (text === null) { print('write: cancelado', 'ts'); return; }
      await K.fs.write(path, text);
      print(`Escrito: '${path}' (${new Blob([text]).size}B)`, 'ts');
    },

    async date() {
      print(new Date().toLocaleString('es', {
        weekday:'long', year:'numeric', month:'long',
        day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'
      }));
    },

    async history() {
      if (!cmdHistory.length) { print('(sin historial)', 'ts'); return; }
      cmdHistory.slice().reverse().forEach((cmd, i) => {
        print(`  ${String(cmdHistory.length - i).padStart(4,' ')}  ${cmd}`, 'to');
      });
    },

    async open(args) {
      if (!args.length) { print('Uso: open <archivo>', 'te'); return; }
      const path = resolvePath(args[0]);
      try {
        const s = await K.fs.stat(path);
        if (!s) { print(`open: '${path}': No existe`, 'te'); return; }
        if (s.type === 'dir') {
          if (window.parent.__wos) window.parent.__wos.launch('files', { startPath: path });
          else K.emit('shell:launch', { appId: 'files', startPath: path });
          print(`Abriendo directorio '${path}' en Archivos…`, 'ts');
        } else {
          if (window.parent.__wos) window.parent.__wos.launch('text-editor', { filePath: path });
          else K.emit('shell:launch', { appId: 'text-editor', filePath: path });
          print(`Abriendo '${path}' en Editor…`, 'ts');
        }
      } catch (e) { print(`open: ${e.message}`, 'te'); }
    },

    async clear() { outputEl.innerHTML = ''; },

    async neofetch() {
      const mem  = navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'N/A';
      const cpu  = navigator.hardwareConcurrency + ' cores';
      const res  = `${screen.width}×${screen.height}`;
      const ua   = navigator.userAgent.split(' ').slice(-1)[0];
      const up   = Math.round(performance.now() / 1000);
      const fsN  = (await K.db.list(K.STORES.FS)).length;
      const proc = K.procs.list().length;

      const ART = [
        ' ██╗    ██╗███████╗██████╗  ██████╗ ███████╗',
        ' ██║    ██║██╔════╝██╔══██╗██╔═══██╗██╔════╝',
        ' ██║ █╗ ██║█████╗  ██████╔╝██║   ██║███████╗',
        ' ██║███╗██║██╔══╝  ██╔══██╗██║   ██║╚════██║',
        ' ╚███╔███╔╝███████╗██████╔╝╚██████╔╝███████║',
        '  ╚══╝╚══╝ ╚══════╝╚═════╝  ╚═════╝ ╚══════╝',
        '',
      ];
      const INFO = [
        `OS:        WebOS v0.1.0`,
        `Kernel:    ${K.version}`,
        `Shell:     WebOS Shell`,
        `Memoria:   ${mem}`,
        `CPU:       ${cpu}`,
        `Resolución:${res}`,
        `FS nodos:  ${fsN}`,
        `Procesos:  ${proc}`,
        `Uptime:    ${up}s`,
        `Motor:     ${ua}`,
        `───────────────────────────────`,
        `\x1b████  ████  ████  ████  ████  ████`,
      ];

      ART.forEach((line, i) => {
        const infoStr = i < INFO.length ? INFO[i] : '';
        printHTML(
          `<span style="color:#00ff88">${escH(line)}</span>` +
          `  <span style="color:#00aa55">${escH(infoStr)}</span>`
        );
      });
      INFO.slice(ART.length).forEach(l => print('                                    ' + l, 'tf'));
      printBlank();
    },

    async help() {
      print('╔══════════════════════════════════════════════════╗', 'ts');
      print('║            COMANDOS DISPONIBLES                  ║', 'ti');
      print('╠══════════════════════════════════════════════════╣', 'ts');

      const cmds = [
        ['ls [-l] [path]',    'Lista archivos del directorio'],
        ['dir [path]',        'Alias de ls'],
        ['cd <path>',         'Cambia directorio de trabajo'],
        ['pwd',               'Muestra directorio actual'],
        ['cat <file…>',       'Muestra contenido de archivo(s)'],
        ['mkdir <dir…>',      'Crea directorio(s)'],
        ['touch <file…>',     'Crea archivo vacío / actualiza mtime'],
        ['rm [-r] <path…>',   'Elimina archivo o directorio (-r recursivo)'],
        ['rmdir <dir>',       'Elimina directorio vacío'],
        ['mv <src> <dst>',    'Mueve o renombra'],
        ['cp <src> <dst>',    'Copia archivo'],
        ['echo <texto>',      'Imprime texto. Soporta > y >>'],
        ['write <file>',      'Escribe contenido a un archivo'],
        ['open <path>',       'Abre en Editor o Files'],
        ['date',              'Fecha y hora actual'],
        ['history',           'Muestra historial de comandos'],
        ['neofetch',          'Info del sistema al estilo retro'],
        ['clear  (Ctrl+L)',   'Limpia la pantalla'],
        ['help',              'Muestra esta ayuda'],
      ];

      cmds.forEach(([cmd, desc]) => {
        printHTML(
          `  <span class="ti">${escH(cmd.padEnd(22))}</span>  <span class="tf">${escH(desc)}</span>`
        );
      });

      print('╠══════════════════════════════════════════════════╣', 'ts');
      print('║  ↑↓ historial  ·  Tab: completado  ·  Ctrl+L: limpiar  ║', 'ts');
      print('╚══════════════════════════════════════════════════╝', 'ts');
      printBlank();
    },
  };

  /* ═══════════════════════ EXECUTE ═══════════════════════ */

  async function execute(raw) {
    raw = raw.trim();
    if (!raw) return;

    /* Tokenize (respeta comillas simples/dobles) */
    const parts = raw.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || [];
    if (!parts.length) return;

    const cmd  = parts[0].toLowerCase();
    const args = parts.slice(1).map(a => a.replace(/^['"]|['"]$/g, ''));

    if (COMMANDS[cmd]) {
      try { await COMMANDS[cmd](args); }
      catch (e) { print(`Error inesperado: ${e.message}`, 'te'); }
    } else {
      print(`${cmd}: comando no encontrado. Escribe 'help'.`, 'te');
    }
  }

  /* ═══════════════════════ TAB COMPLETION ═══════════════════════ */

  async function tabComplete() {
    const val   = inp.value;
    const parts = val.split(/\s+/);
    if (parts.length < 2) return;

    const partial = parts[parts.length - 1];
    const dirPart = partial.includes('/') ? partial.substring(0, partial.lastIndexOf('/') + 1) : '';
    const namePart= partial.includes('/') ? partial.substring(partial.lastIndexOf('/') + 1) : partial;
    const dir     = dirPart ? resolvePath(dirPart) : cwd;

    try {
      const entries  = await K.fs.readdir(dir);
      const matches  = entries.filter(e => e.name.startsWith(namePart));

      if (matches.length === 1) {
        const suffix  = matches[0].type === 'dir' ? '/' : ' ';
        const newPart = dirPart + matches[0].name + suffix;
        parts[parts.length - 1] = newPart;
        inp.value = parts.join(' ');
      } else if (matches.length > 1) {
        printBlank();
        const names = matches.map(m => m.name + (m.type === 'dir' ? '/' : '')).join('  ');
        print(names, 'tf');
        print(currentPromptText() + val, 'tc');
      }
    } catch {}
  }

  /* ═══════════════════════ INPUT HANDLER ═══════════════════════ */

  inp.addEventListener('keydown', async e => {
    if (locked && e.key !== 'Escape') { e.preventDefault(); return; }

    if (e.key === 'Enter') {
      const val = inp.value;
      inp.value = '';
      histIdx   = -1;

      /* Echo command */
      const p = currentPromptText();
      printHTML(`<span class="tc">${escH(p + val)}</span>`);

      if (val.trim()) {
        if (cmdHistory[0] !== val.trim()) {
          cmdHistory.unshift(val.trim());
          if (cmdHistory.length > 500) cmdHistory.pop();
          saveHistory();
        }
        locked = true;
        await execute(val);
        locked = false;
      }
      scrollEnd();

    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (histIdx < cmdHistory.length - 1) {
        histIdx++;
        inp.value = cmdHistory[histIdx] || '';
      }

    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx > 0) {
        histIdx--;
        inp.value = cmdHistory[histIdx];
      } else {
        histIdx   = -1;
        inp.value = '';
      }

    } else if (e.key === 'Tab') {
      e.preventDefault();
      await tabComplete();

    } else if (e.ctrlKey && e.key === 'l') {
      e.preventDefault();
      outputEl.innerHTML = '';

    } else if (e.ctrlKey && e.key === 'c') {
      if (val !== '') {
        print('^C', 'te');
        inp.value = '';
        histIdx   = -1;
      }
    }
  });

  /* ═══════════════════════ FOCUS ═══════════════════════ */

  document.addEventListener('click', e => {
    if (!e.target.closest('#ctx-menu')) inp.focus();
  });

  /* ═══════════════════════ BOOT MESSAGE ═══════════════════════ */

  print('╔═══════════════════════════════════════╗', 'ts');
  print('║   WebOS Terminal  ·  v0.1.0           ║', 'ti');
  print('╠═══════════════════════════════════════╣', 'ts');
  print("║   Escribe 'help' para ver comandos    ║", 'ts');
  print('╚═══════════════════════════════════════╝', 'ts');
  printBlank();

  async function init(kernel) {
    K = kernel;
    await applyPrefs();

    K.on('prefs:change', ({ key, value }) => {
      if (key === 'shell.prompt') applyPrompt(value);
      if (key === 'shell.history') {
        cmdHistory = Array.isArray(value) ? value.slice(0, 500) : [];
        histIdx = -1;
      }
      if (key === 'system.theme') applyTheme(value);
      if (key === 'system.fontSize') applyFontSize(value);
      updatePrompt();
    });

    K.on('prefs:delete', ({ key }) => {
      if (key === 'shell.prompt') applyPrompt(DEFAULT_PREFS['shell.prompt']);
      if (key === 'shell.history') {
        cmdHistory = [];
        histIdx = -1;
      }
      if (key === 'system.theme') applyTheme(DEFAULT_PREFS['system.theme']);
      if (key === 'system.fontSize') applyFontSize(DEFAULT_PREFS['system.fontSize']);
      updatePrompt();
    });

    updatePrompt();
    inp.focus();
  }

  waitForKernel(init);

})();
</script>
