    /* ══ NATIVE TERMINAL ══ */
    function createNativeTerminal(parentPid){
      const termProc=Kernel.procs.spawn('terminal',{title:'Terminal',icon:'⌨',cwd:'/home',parentPid:parentPid??null});
      const wrap=document.createElement('div'); wrap.className='native-terminal';
      const header=document.createElement('div'); header.className='nt-header';
      header.innerHTML=`<span class="nt-title-wrap"><span class="nt-leds"><span class="nt-led"></span><span class="nt-led"></span><span class="nt-led"></span></span><span class="nt-title">⌨ HUEBOS Terminal v0.4.0</span></span><span class="nt-cwd">/home</span>`;
      const cwdDisplay=header.querySelector('.nt-cwd');
      const output=document.createElement('div'); output.className='nt-output';
      const inputWrap=document.createElement('div'); inputWrap.className='nt-input-wrap';
      inputWrap.innerHTML=`<span class="nt-prompt"><span class="nt-ph">huebos</span><span class="nt-pp">@local</span>:<span class="nt-pid nt-ph">~</span><span class="nt-pp">$</span></span>&nbsp;<input class="nt-cmd-input" type="text" autocomplete="off" spellcheck="false" />`;
      const promptPath=inputWrap.querySelector('.nt-pid');
      const cmdInput=inputWrap.querySelector('.nt-cmd-input');
      wrap.appendChild(header); wrap.appendChild(output); wrap.appendChild(inputWrap);

      let cwd='/home'; const history=[]; let histIdx=-1;
      function setCwd(p){cwd=p;const d=cwd==='/home'?'~':cwd.replace(/^\/home/,'~');promptPath.textContent=d;cwdDisplay.textContent=cwd;Kernel.procs.setCwd(termProc.pid,cwd);}
      function resolvePath(p){
        if(!p||p==='~')return'/home';if(p.startsWith('~/'))return'/home/'+p.slice(2);
        if(p.startsWith('/'))return p.replace(/\/+/g,'/').replace(/\/$/,'')||'/';
        const parts=(cwd+'/'+p).split('/').filter(Boolean);const stack=[];
        for(const pt of parts){if(pt==='.')continue;if(pt==='..')stack.pop();else stack.push(pt);}
        return'/'+stack.join('/')||'/';
      }
      function print(t,c='nt-out'){const l=document.createElement('div');l.className='nt-line '+c;l.textContent=t;output.appendChild(l);}
      function printHTML(h,c='nt-out'){const l=document.createElement('div');l.className='nt-line '+c;l.innerHTML=h;output.appendChild(l);}
      function scrollBottom(){output.scrollTop=output.scrollHeight;}

      printHTML(`<span style="color:var(--g);text-shadow:0 0 8px #00ff88aa">HUEBOS Terminal</span> <span style="color:var(--g-dim)">v0.4.0 · pid=${termProc.pid}</span>`);
      print('Escribe "help" para ver los comandos disponibles.','nt-dim');
      print('','nt-line');

      async function exec(raw){
        const trimmed=raw.trim(); if(!trimmed)return;
        const ps=`huebos@local:${cwd==='/home'?'~':cwd.replace(/^\/home/,'~')}$ ${trimmed}`;
        print(ps,'nt-cmd'); history.unshift(trimmed); histIdx=-1;
        if(history.length>200)history.pop();
        const [cmd,...args]=trimmed.split(/\s+/);
        if(!COMMANDS[cmd]){
          print(`bash: ${cmd}: command not found`,'nt-err');
          scrollBottom();
          return;
        }
        try{await COMMANDS[cmd](args);}
        catch(err){print(`Error: ${err.message}`,'nt-err');}
        scrollBottom();
      }

      const COMMANDS={
        async help(){
          const cmds=[
            ['ls [path]','Listar directorio'],['cd [path]','Cambiar directorio'],['pwd','Mostrar ruta actual'],
            ['cat <path>','Mostrar contenido'],['mkdir <path>','Crear directorio'],['rm [-r] <path>','Eliminar'],
            ['mv <src> <dst>','Mover/renombrar'],['cp <src> <dst>','Copiar'],['touch <path>','Crear vacío'],
            ['write <path> ...','Escribir texto'],['stat <path>','Info detallada'],['tree [path]','Árbol'],
            ['echo [...txt]','Imprimir'],['ps','Listar procesos'],['kill <pid>','Matar proceso'],
            ['history','Historial'],['neofetch','Info sistema'],['clear','Limpiar'],
            ['env [key=val]','Ver/poner variables'],['whoami','Usuario actual'],
            ['useradd <id> <name>','Crear usuario'],['passwd [id]','Cambiar contraseña'],
            ['reboot [safe]','Reiniciar sistema'],['uefi','Abrir firmware UEFI'],
            ['safe-mode','Estado safe mode'],
          ];
          print('Comandos disponibles:','nt-info');
          cmds.forEach(([c,d])=>{const pad=c.padEnd(22,' ');printHTML(`  <span style="color:var(--g)">${pad}</span><span style="color:var(--g-dim)">${d}</span>`);});
        },
        async ls([pa]){
          const target=pa?resolvePath(pa):cwd;const node=await Kernel.fs.stat(target);
          if(!node){print(`ls: no se puede acceder a '${target}': No existe`,'nt-err');return;}
          if(node.type==='file'){print(node.name+(node.encoding==='binary'?` [${node.mime||'bin'}]`:''),'nt-file');return;}
          const entries=await Kernel.fs.readdir(target);
          if(!entries.length){print('(directorio vacío)','nt-dim');return;}
          const dirs=entries.filter(e=>e.type==='dir').sort((a,b)=>a.name.localeCompare(b.name));
          const files=entries.filter(e=>e.type==='file').sort((a,b)=>a.name.localeCompare(b.name));
          const parts=[];
          dirs.forEach(d=>parts.push(`<span class="nt-dir">${escapeHtml(d.name)}/</span>`));
          files.forEach(f=>parts.push(`<span class="nt-file">${escapeHtml(f.name)}</span>${f.encoding==='binary'?`<span style="color:var(--amber);font-size:0.85em"> [bin]</span>`:''}`));
          printHTML(parts.join('  '));
        },
        async cd([pa]){
          const target=pa?resolvePath(pa):'/home';const node=await Kernel.fs.stat(target);
          if(!node){print(`cd: ${target}: No existe`,'nt-err');return;}
          if(node.type!=='dir'){print(`cd: ${target}: No es un directorio`,'nt-err');return;}
          setCwd(target);
        },
        async pwd(){print(cwd,'nt-out');},
        async cat([pa]){
          if(!pa){print('Uso: cat <ruta>','nt-err');return;}
          const target=resolvePath(pa);const node=await Kernel.fs.stat(target);
          if(!node){print(`cat: ${target}: No existe`,'nt-err');return;}
          if(node.type==='dir'){print(`cat: ${target}: Es un directorio`,'nt-err');return;}
          if(node.encoding==='binary'){print(`(binario: ${node.mime||'application/octet-stream'}, ${node.size} bytes)`,'nt-info');return;}
          const content=await Kernel.fs.read(target);
          content.split('\n').forEach(l=>print(l,'nt-out'));
        },
        async mkdir([pa]){if(!pa){print('Uso: mkdir <ruta>','nt-err');return;}await Kernel.fs.mkdir(resolvePath(pa));print(`mkdir: creado '${resolvePath(pa)}'`,'nt-success');},
        async rm(args){
          const r=args[0]==='-r'||args[0]==='-rf';const pa=r?args[1]:args[0];
          if(!pa){print('Uso: rm [-r] <ruta>','nt-err');return;}
          await Kernel.fs.remove(resolvePath(pa),{recursive:r});print(`rm: eliminado '${resolvePath(pa)}'`,'nt-success');
        },
        async mv([src,dst]){
          if(!src||!dst){print('Uso: mv <origen> <destino>','nt-err');return;}
          await Kernel.fs.move(resolvePath(src),resolvePath(dst));print(`mv: '${src}' → '${dst}'`,'nt-success');
        },
async cp([src,dst]){
          if(!src||!dst){print('Uso: cp <origen> <destino>','nt-err');return;}
          const sp=resolvePath(src);let dp=resolvePath(dst);const node=await Kernel.fs.stat(sp);
          if(!node||node.type!=='file'){print(`cp: '${src}': no es un archivo regular`,'nt-err');return;}
          const dNode=await Kernel.fs.stat(dp);
          if(dNode&&dNode.type==='dir')dp=`${dp}/${node.name}`.replace(/\/+/g,'/');
          if(node.encoding==='binary'){const blob=await Kernel.fs.readBlob(sp);await Kernel.fs.writeBinary(dp,blob,node.mime);}
          else{const c=await Kernel.fs.read(sp);await Kernel.fs.write(dp,c);}
          print(`cp: '${src}' → '${dp}'`,'nt-success');
        },
        async touch([pa]){
          if(!pa){print('Uso: touch <ruta>','nt-err');return;}
          const target=resolvePath(pa);const exists=await Kernel.fs.exists(target);
          if(!exists)await Kernel.fs.write(target,'');
          else{const c=await Kernel.fs.read(target).catch(()=>'');await Kernel.fs.write(target,c);}
          print(`touch: '${target}'`,'nt-success');
        },
        async write([pa,...rest]){
          if(!pa){print('Uso: write <ruta> <texto...>','nt-err');return;}
          const target=resolvePath(pa);const text=rest.join(' ');
          await Kernel.fs.write(target,text);print(`write: '${target}' (${text.length} chars)`,'nt-success');
        },
        async stat([pa]){
          if(!pa){print('Uso: stat <ruta>','nt-err');return;}
          const target=resolvePath(pa);const node=await Kernel.fs.stat(target);
          if(!node){print(`stat: '${target}': No existe`,'nt-err');return;}
          print(`  Ruta   : ${node.id}`,'nt-info'); print(`  Tipo   : ${node.type}`,'nt-out');
          if(node.encoding)print(`  Encoding: ${node.encoding}`,'nt-out');
          if(node.mime)print(`  MIME    : ${node.mime}`,'nt-out');
          print(`  Tamaño : ${node.size} bytes`,'nt-out');
          print(`  Creado : ${new Date(node.ctime).toLocaleString('es')}`,'nt-dim');
          print(`  Modificado: ${new Date(node.mtime).toLocaleString('es')}`,'nt-dim');
        },
        async tree([pa]){
          const root=pa?resolvePath(pa):cwd;const node=await Kernel.fs.stat(root);
          if(!node||node.type!=='dir'){print(`tree: '${root}': no es directorio`,'nt-err');return;}
          async function printTree(dir,prefix){
            const entries=await Kernel.fs.readdir(dir);
            const all=[...entries.filter(e=>e.type==='dir').sort((a,b)=>a.name.localeCompare(b.name)),...entries.filter(e=>e.type==='file').sort((a,b)=>a.name.localeCompare(b.name))];
            for(let i=0;i<all.length;i++){
              const e=all[i];const isLast=i===all.length-1;const sym=isLast?'└── ':'├── ';
              const cls=e.type==='dir'?'nt-dir':'nt-file';
              const tag=e.encoding==='binary'?` <span style="color:var(--amber);font-size:0.85em">[bin]</span>`:'';
printHTML(`${prefix}${sym}<span class="${cls}">${escapeHtml(e.name)}${e.type==='dir'?'/':''}</span>${tag}`);
              if(e.type==='dir')await printTree(e.id,prefix+(isLast?'    ':'│   '));
            }
          }
          printHTML(`<span class="nt-dir">${root}/</span>`); await printTree(root,'');
        },
        async echo(args){print(args.join(' '),'nt-out');},
        async ps(){
          const procs=Kernel.procs.list();
          print(`  PID   APP                  TÍTULO                  CWD`,'nt-info');
          print(`  ────  ───────────────────  ──────────────────────  ───`,'nt-dim');
          procs.forEach(p=>{
            const pid=String(p.pid).padStart(4,' ');const app=p.appId.padEnd(20,' ').slice(0,20);
            const title=(p.title||'').padEnd(22,' ').slice(0,22);const cw=p.cwd||'-';
            const myF=p.pid===termProc.pid?' ◄':'';const pF=p.parentPid!==null?` (↑${p.parentPid})`:'';
            print(`  ${pid}  ${app}  ${title}  ${cw}${myF}${pF}`,'nt-out');
          });
          print(`Total: ${procs.length} proceso(s)`,'nt-dim');
        },
        async kill([pa]){
          if(!pa){print('Uso: kill <pid>','nt-err');return;}
          const pid=parseInt(pa,10);
          if(pid===termProc.pid){print(`kill: no puedes matar tu propia terminal`,'nt-err');return;}
          const ok=Kernel.procs.kill(pid);
          if(ok)print(`kill: proceso ${pid} terminado`,'nt-success');
          else print(`kill: pid ${pid} no encontrado`,'nt-err');
        },
        async history(){
          if(!history.length){print('(historial vacío)','nt-dim');return;}
          history.slice().reverse().forEach((cmd,i)=>{print(`  ${String(i+1).padStart(3)}  ${cmd}`,i%2===0?'nt-out':'nt-dim');});
        },
        async neofetch(){
          const session=Kernel.session;const upSec=Kernel.uptimeSeconds;
          const upStr=upSec>=3600?`${Math.floor(upSec/3600)}h ${Math.floor((upSec%3600)/60)}m`:`${Math.floor(upSec/60)}m ${upSec%60}s`;
          const lines=[``,
            `   ██╗  ██╗██╗   ██╗███████╗██████╗  ██████╗ ███████╗`,
            `   ██║  ██║██║   ██║██╔════╝██╔══██╗██╔═══██╗██╔════╝`,
            `   ███████║██║   ██║█████╗  ██████╔╝██║   ██║███████╗`,
            `   ██╔══██║██║   ██║██╔══╝  ██╔══██╗██║   ██║╚════██║`,
            `   ██║  ██║╚██████╔╝███████╗██████╔╝╚██████╔╝███████║`,
            `   ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚═════╝  ╚═════╝ ╚══════╝`,``];
          const info=[``,`OS: HUEBOS v0.4.0 Cyberhacker Glass`,`Kernel: HUEBOS Kernel v0.4.0 (UEFI)`,
            `Shell: Cyberhacker+Aero Glass`,`Resolution: ${screen.width}×${screen.height}`,
            `CPU: ${navigator.hardwareConcurrency} core(s)`,
            `Memory: ${navigator.deviceMemory?navigator.deviceMemory+' GB':'N/D'}`,
            `Uptime: ${upStr}`,`Session: #${session.count??'?'}`,`PID: ${termProc.pid}`,`CWD: ${cwd}`,
            `Safe Mode: ${Kernel.safeMode?'ON':'off'}`];
          lines.forEach((l,i)=>{
            const inf=info[i-1]||'';
            printHTML(`<span style="color:var(--g);opacity:0.9">${l}</span>  <span style="color:var(--amber)">${inf}</span>`);
          });
          print('','nt-line');
        },
        async clear(){output.innerHTML='';},
        async env(args){
          if(args.length===0){
            const all=await Kernel.env.all();
            const keys=Object.keys(all).sort();
            if(!keys.length){print('(sin variables de entorno)','nt-dim');return;}
            keys.forEach(k=>printHTML(`  <span style="color:var(--g)">${k}</span>=<span style="color:var(--amber)">${escapeHtml(String(all[k]))}</span>`));
          }else{
            const kv=args.join(' ');
            const eq=kv.indexOf('=');
            if(eq<0){const v=await Kernel.env.get(kv);print(v===null?'(undefined)':String(v),'nt-out');return;}
            const key=kv.slice(0,eq).trim();const val=kv.slice(eq+1).trim();
            if(!key){print('Uso: env KEY=VAL o env KEY','nt-err');return;}
            await Kernel.env.set(key,val);print(`env: ${key}=${val}`,'nt-success');
          }
        },
        async whoami(){
          const u=await Kernel.users.current();
          if(u)printHTML(`  <span style="color:var(--g)">${u.id}</span> <span style="color:var(--g-dim)">(${u.name})</span> <span style="color:var(--amber)">[${u.role}]</span>`);
          else print('(no autenticado)','nt-dim');
        },
        async useradd(args){
          const id=args[0];const name=args.slice(1).join(' ')||id;
          if(!id){print('Uso: useradd <id> [nombre]','nt-err');return;}
          try{const u=await Kernel.users.create(id,name);print(`useradd: usuario '${u.id}' creado`,'nt-success');}
          catch(e){print(`useradd: ${e.message}`,'nt-err');}
        },
        async passwd(args){
          const id=args[0]||(await Kernel.users.current())?.id;
          if(!id){print('Uso: passwd [id]  (sin sesión activa, especifica id)','nt-err');return;}
          const user=await Kernel.users.get(id);
          if(!user){print(`passwd: usuario '${id}' no existe`,'nt-err');return;}
          /* Prompt inline simple */
          print(`passwd: escriba nueva contraseña para '${id}':`,'nt-info');
          cmdInput.type='password';cmdInput.value='';cmdInput.placeholder='nueva contraseña…';
          const handler=async(e)=>{
            if(e.key==='Enter'){
              e.preventDefault();cmdInput.removeEventListener('keydown',handler);
              const pw=cmdInput.value;cmdInput.value='';cmdInput.type='text';cmdInput.placeholder='';
              user.password=pw;
              const list=await Kernel.users.list();
              const idx=list.findIndex(u=>u.id===id);
              if(idx>=0){list[idx]=user;await Kernel.prefs.set('users.list',list);}
              print(`passwd: contraseña actualizada para '${id}'`,'nt-success');
            }
          };
          cmdInput.addEventListener('keydown',handler);
        },
        async reboot(args){
          const safe=args[0]==='safe';
          if(safe){sessionStorage.setItem('huebos_safe_mode','1');print('reboot: reiniciando en SAFE MODE…','nt-amber');}
          else{sessionStorage.removeItem('huebos_safe_mode');print('reboot: reiniciando…','nt-info');}
          setTimeout(()=>window.location.href='./index.html',800);
        },
        async uefi(){
          print('uefi: abriendo firmware UEFI…','nt-info');
          window.open('./uefi.html','_blank');
        },
        async safe_mode(){
          print(`Safe Mode: ${Kernel.safeMode?'ACTIVO ⚠':'inactivo'}`,'nt-info');
          print('Use "reboot safe" para iniciar en Safe Mode.','nt-dim');
        },
      };

      cmdInput.addEventListener('keydown',async e=>{
        if(e.key==='Enter'){const v=cmdInput.value;cmdInput.value='';histIdx=-1;await exec(v);}
        else if(e.key==='ArrowUp'){e.preventDefault();if(histIdx<history.length-1){histIdx++;cmdInput.value=history[histIdx]||'';setTimeout(()=>{cmdInput.selectionStart=cmdInput.selectionEnd=cmdInput.value.length;},0);}}
        else if(e.key==='ArrowDown'){e.preventDefault();if(histIdx>0){histIdx--;cmdInput.value=history[histIdx]||'';}else{histIdx=-1;cmdInput.value='';}}
        else if(e.key==='Tab'){
          e.preventDefault();
          const v=cmdInput.value;const parts=v.split(/\s+/);if(parts.length<=1)return;
          const partial=parts[parts.length-1];
          const dir=partial.includes('/')?resolvePath(partial.slice(0,partial.lastIndexOf('/')+1)):cwd;
          const pfx=partial.includes('/')?partial.slice(partial.lastIndexOf('/')+1):partial;
          try{
            const entries=await Kernel.fs.readdir(dir);const matches=entries.filter(e=>e.name.startsWith(pfx));
            if(matches.length===1){parts[parts.length-1]=(partial.includes('/')?partial.slice(0,partial.lastIndexOf('/')+1):'')+matches[0].name+(matches[0].type==='dir'?'/':'');cmdInput.value=parts.join(' ');}
            else if(matches.length>1){print(parts.join(' '),'nt-dim');printHTML(matches.map(m=>`<span class="${m.type==='dir'?'nt-dir':'nt-file'}">${escapeHtml(m.name)}${m.type==='dir'?'/':''}</span>`).join('  '));scrollBottom();}          }catch{}
        }
        else if(e.key==='l'&&e.ctrlKey){e.preventDefault();output.innerHTML='';}
      });
      output.addEventListener('click',()=>cmdInput.focus());
      wrap.addEventListener('click',e=>{if(e.target!==cmdInput)cmdInput.focus();});

      WM.createWindow(termProc,{title:'Terminal',icon:'⌨',width:700,height:480,content:wrap});
      setTimeout(()=>cmdInput.focus(),100);
      return termProc;
    }

    /* ══ KERNEL INTEGRATION ══ */
    let _shellReady=false;
    let _desktopReady=false;

    async function loadAppsFromIndex(){
      const res=await fetch('./apps/index.json',{cache:'no-store'});
      if(!res.ok)throw new Error('No se pudo leer apps/index.json');
      const data=await res.json();const loadedApps=[];
      for(const file of data.apps||[]){
        const htmlRes=await fetch(`./apps/${file}`,{cache:'no-store'});
        if(!htmlRes.ok)continue;
        const html=await htmlRes.text();
        const match=html.match(/<script[^>]+id=["']wos-manifest["'][^>]*>([\s\S]*?)<\/script>/i);
        if(!match)continue;
        const manifest=JSON.parse(match[1].trim());
        loadedApps.push({
          id:manifest.id,name:manifest.name||manifest.id,version:manifest.version||'0.1.0',
          icon:manifest.icon||'▪',category:manifest.category||'utility',
          singleton:manifest.singleton??false,entry:`./apps/${file}`,
          meta:{description:manifest.description||'',winWidth:manifest.winWidth||660,winHeight:manifest.winHeight||480,author:manifest.author||'',sourceFile:file},
        });
      }
      return loadedApps;
    }

async function resolveShellApps(kernel){
  try{
    const raw=await loadAppsFromIndex();
    if(raw.length){
      const unique=[...new Map(raw.map(a=>[a.id,a])).values()];
      return withNativeSystemApps(unique);
    }
  }catch(_){}
  const raw=await kernel.apps.list();
  const unique=[...new Map(
    raw.filter(app=>app?.entry&&app.entry.startsWith('./apps/')).map(a=>[a.id,a])
  ).values()];
  return withNativeSystemApps(unique);
}

    function renderRegisteredApps(apps){
      _runtimeApps=new Map(apps.map(app=>[app.id,app]));
      StartMenu.setApps(apps);
      Desktop.refreshDesktop().catch(()=>{});
    }

    function shellInit(kernel){
      if(_shellReady)return; _shellReady=true;
      window.__toast=Toast.show.bind(Toast);

      /* ══ LOCK SCREEN ══ */
      const lockScreen=document.getElementById('lock-screen');
      const lockTime=document.getElementById('lock-time');
      const lockDate=document.getElementById('lock-date');
      const lockAvatar=document.getElementById('lock-avatar');
      const lockUsername=document.getElementById('lock-username');
      const lockPassword=document.getElementById('lock-password');
      const lockUnlockBtn=document.getElementById('lock-unlock-btn');
      const lockHint=document.getElementById('lock-hint');
      const lockSafeBadge=document.getElementById('lock-safe-badge');

      let _lockClockInterval=null;
      function updateLockClock(){
        const now=new Date();
        const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
        const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        if(lockTime)lockTime.textContent=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        if(lockDate)lockDate.textContent=`${days[now.getDay()]}, ${now.getDate()} de ${months[now.getMonth()]}`;
      }

      /* Actualizar reloj y foco inmediatamente, sin esperar al Kernel */
      updateLockClock();
      if(_lockClockInterval)clearInterval(_lockClockInterval);
      _lockClockInterval=setInterval(updateLockClock,1000);
      if(lockUsername)lockUsername.textContent='Invitado';
      setTimeout(()=>{if(lockPassword&&!lockScreen.classList.contains('hidden'))lockPassword.focus();},100);

      async function showLockScreen(animate){
        if(!lockScreen)return;
        const user=await kernel.users.current();
        if(user){
          lockUsername.textContent=user.name||user.id;
          lockAvatar.textContent=user.role==='admin'?'🛡':'👤';
        }else{
          lockUsername.textContent='Invitado';
          lockAvatar.textContent='👤';
        }
        if(kernel.safeMode){lockSafeBadge.style.display='block';}
        else{lockSafeBadge.style.display='none';}
        /* Determinar si hay que pedir contraseña */
        const requirePwd=await kernel.prefs.get('security.lockPassword')||false;
        const secPwd=await kernel.prefs.get('security.password')||'';
        let userPwd='';
        if(user){const u=await kernel.users.get(user.id);userPwd=u?.password||'';}
        const storedPwd=secPwd||userPwd;
        const needPassword=requirePwd&&storedPwd;
        lockPassword.value='';
        if(needPassword){
          lockPassword.style.display='';
          lockUnlockBtn.style.display='';
          lockHint.textContent='Introduce tu contraseña para desbloquear';
          lockHint.style.color='';
        }else{
          lockPassword.style.display='none';
          lockUnlockBtn.style.display='none';
          lockHint.textContent='Presiona cualquier tecla para desbloquear';
          lockHint.style.color='';
        }
        document.body.classList.add('locked');
        lockScreen.classList.remove('hidden');
        if(animate){lockScreen.classList.add('animate-in');lockScreen.addEventListener('animationend',()=>lockScreen.classList.remove('animate-in'),{once:true});}
        updateLockClock();
        if(_lockClockInterval)clearInterval(_lockClockInterval);
        _lockClockInterval=setInterval(updateLockClock,1000);
        setTimeout(()=>{if(needPassword)lockPassword.focus();},100);
      }

      async function tryUnlock(){
        const requirePwd=await kernel.prefs.get('security.lockPassword')||false;
        const secPwd=await kernel.prefs.get('security.password')||'';
        /* También validar contra user.password de users.list */
        const cur=await kernel.users.current();
        let userPwd='';
        if(cur){
          const user=await kernel.users.get(cur.id);
          userPwd=user?.password||'';
        }
        const storedPwd=secPwd||userPwd;
        /* Si hay contraseña configurada y el flag está activo, validar */
        if(requirePwd&&storedPwd){
          const pw=lockPassword.value;
          if(pw!==storedPwd){
            lockPassword.classList.add('lock-error');
            lockHint.textContent='Contraseña incorrecta';
            lockHint.style.color='var(--red,#ff4466)';
            setTimeout(()=>lockPassword.classList.remove('lock-error'),400);
            lockPassword.value='';
            lockPassword.focus();
            return;
          }
        }
        /* Sin contraseña o validación correcta = desbloquear */
        lockScreen.classList.add('hidden');
        document.body.classList.remove('locked');
        if(_lockClockInterval){clearInterval(_lockClockInterval);_lockClockInterval=null;}
        Toast.show('Sesión desbloqueada','ok','LOCK');
        /* Inicializar el escritorio solo después de autenticarse */
        initDesktop(kernel);
      }

      if(lockUnlockBtn)lockUnlockBtn.addEventListener('click',tryUnlock);
      if(lockPassword)lockPassword.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryUnlock();}});
      /* Cualquier tecla desbloquea cuando NO hay contraseña configurada.
         Si hay contraseña, solo Enter en el campo la valida. */
      let _unlocking=false;
      document.addEventListener('keydown',async function _lockKeyHandler(e){
        if(!document.body.classList.contains('locked'))return;
        if(_unlocking)return;
        /* Ignorar teclas modificadoras solas y combinaciones de bloqueo */
        if(e.key==='Meta'||e.key==='Control'||e.key==='Alt'||e.key==='Shift')return;
        if((e.metaKey||(e.ctrlKey&&e.altKey))&&e.key.toLowerCase()==='l')return;
        const requirePwd=await kernel.prefs.get('security.lockPassword')||false;
        const secPwd=await kernel.prefs.get('security.password')||'';
        const cur=await kernel.users.current();
        let userPwd='';
        if(cur){const user=await kernel.users.get(cur.id);userPwd=user?.password||'';}
        const storedPwd=secPwd||userPwd;
        if(requirePwd&&storedPwd){
          /* Hay contraseña: si el evento viene del campo, Enter ya lo maneja.
             Si viene de fuera, enfocar el campo. */
          if(e.target!==lockPassword){
            e.preventDefault();
            if(lockPassword)lockPassword.focus();
          }
          return;
        }
        /* Sin contraseña: cualquier tecla desbloquea */
        e.preventDefault();
        _unlocking=true;
        try{ await tryUnlock(); }catch(_){}
        _unlocking=false;
      });

      /* Botón reiniciar en lock screen */
      const lockRebootBtn=document.getElementById('lock-reboot-btn');
      if(lockRebootBtn)lockRebootBtn.addEventListener('click',()=>{
        if(confirm('¿Reiniciar HUEBOS?'))location.reload();
      });

      /* Win+L = bloquear (solo si NO estamos ya en lock screen) */
      document.addEventListener('keydown',e=>{
        if(document.body.classList.contains('locked'))return;
        if(e.metaKey&&e.key.toLowerCase()==='l'){e.preventDefault();showLockScreen(true);}
        if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='l'){e.preventDefault();showLockScreen(true);}
      });

      /* Mostrar lock al arrancar si la preferencia está activa (default ON) */
      /* La lock screen ya está visible desde el HTML (sin hidden) y body.locked oculta el escritorio */
      (async()=>{
        const uefi=await kernel.prefs.get('uefi.config')||{};
        const lockOnBoot=uefi.lockScreen!==false; /* default ON */
        if(lockOnBoot){
          await showLockScreen(false); /* sin animación: ya está visible desde el HTML */
        } else {
          lockScreen.classList.add('hidden'); /* ocultar si la preferencia está desactivada */
          document.body.classList.remove('locked');
          initDesktop(kernel); /* sin lock screen: inicializar escritorio directamente */
        }
        /* Fade-out del overlay negro tras decidir el estado del lock screen */
        const overlay=document.getElementById('boot-fade-overlay');
        if(overlay){
          overlay.classList.add('fade-out');
          overlay.addEventListener('transitionend',()=>overlay.remove(),{once:true});
          /* Fallback: remover tras 1s por si transitionend no dispara */
          setTimeout(()=>{if(overlay.parentNode)overlay.remove();},1000);
        }
      })();

      /* Exponer para uso desde apps */
      window.__wos_lock=()=>showLockScreen(true);
    }

    /* ══ ESCRITORIO — solo se inicializa tras autenticación ══ */
    function initDesktop(kernel){
      if(_desktopReady)return; _desktopReady=true;

      document.addEventListener('keydown',e=>{
        if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();createNativeTerminal(null);}
      });
      window.addEventListener('message',event=>{
        if(event.origin!==window.location.origin)return;
        const{type,url}=event.data||{};
        if(type==='wos:reboot'&&typeof url==='string'){
          try{const p=new URL(url);if(p.origin===window.location.origin)window.location.href=url;}
          catch{console.warn('[shell] wos:reboot: URL inválida ignorada',url);}
        }
        if(type==='wos:lock'){window.__wos_lock&&window.__wos_lock();}
      });
      const startLockBtn=document.getElementById('start-lock');
      if(startLockBtn)startLockBtn.addEventListener('click',()=>{window.__wos_lock&&window.__wos_lock();});
      window.__wos={
        launch(appId,opts={}){
          Promise.resolve(_runtimeApps.get(appId)).then(app=>app||kernel.apps.get(appId)).then(app=>{
            if(!app){Toast.show(`App "${appId}" no encontrada`,'error');return;} launchApp(app,opts);
          });
        },
        toast:Toast.show.bind(Toast),
      };
      kernel.on('shell:launch',async({appId,filePath,startPath})=>{
        const app=_runtimeApps.get(appId)||await kernel.apps.get(appId);
        if(!app){Toast.show(`App "${appId}" no encontrada`,'error');return;}
        const isSys=p=>typeof p==='string'&&(p.startsWith('/system')||p.startsWith('/sys'));
        launchApp(app, (isSys(filePath)||isSys(startPath)) ? {} : {filePath,startPath});
      });
      applyShellPrefs(kernel).catch(()=>{Object.entries(DEFAULT_PREFS).forEach(([k,v])=>applyShellPref(k,v));});
      kernel.on('prefs:change',({key,value})=>applyShellPref(key,value));
      kernel.on('prefs:delete',({key})=>{if(Object.prototype.hasOwnProperty.call(DEFAULT_PREFS,key))applyShellPref(key,DEFAULT_PREFS[key]);});

      resolveShellApps(kernel).then(renderRegisteredApps).catch(()=>{
        Toast.show('No se pudieron cargar las apps del sistema','error','APPS');
      });
      kernel.on('apps:registered',async()=>{const apps=await resolveShellApps(kernel);renderRegisteredApps(apps);});
      kernel.on('apps:unregistered',async()=>{const apps=await resolveShellApps(kernel);renderRegisteredApps(apps);});
      kernel.on('fs:write',()=>Desktop.refreshDesktop().catch(()=>{}));
      kernel.on('fs:remove',()=>Desktop.refreshDesktop().catch(()=>{}));
      kernel.on('fs:mkdir',()=>Desktop.refreshDesktop().catch(()=>{}));
      kernel.on('fs:move',()=>Desktop.refreshDesktop().catch(()=>{}));
      kernel.on('procs:spawn',({pid})=>{
        const wd=WM.getWindow(pid);
        if(!wd){const proc=kernel.procs.get(pid);if(proc&&proc.autoWindow)WM.createWindow(proc,proc.windowOpts||{});}
      });

      setTimeout(()=>{
        if(kernel.safeMode){
          Toast.show('⚠ SAFE MODE activo — configuración omitida','amber','SAFE MODE',6000);
        }
        Toast.show('HUEBOS Cyberhacker Glass activa','ok','SISTEMA');
      },400);
      setTimeout(()=>{
        if(Kernel.session.firstRun){
          Toast.show('Bienvenido a HUEBOS. Doble clic para apps. Ctrl+Alt+T terminal.','info','BIENVENIDA',7000);
        }
      },1200);
    }

    function waitForKernel(){
      if(window.Kernel&&window.Kernel.isReady){shellInit(window.Kernel);}
      else if(window.Kernel){window.Kernel.once('ready',()=>shellInit(window.Kernel));}
      else{
        document.addEventListener('DOMContentLoaded',()=>{
          if(window.Kernel){
            if(window.Kernel.isReady)shellInit(window.Kernel);
            else window.Kernel.once('ready',()=>shellInit(window.Kernel));
          } else {
            let tries=0;
            const poll=setInterval(()=>{
              if(window.Kernel){clearInterval(poll);
                if(window.Kernel.isReady)shellInit(window.Kernel);
                else window.Kernel.once('ready',()=>shellInit(window.Kernel));}
              if(++tries>50){clearInterval(poll);Toast.show('No se pudo conectar con el Kernel','error','ERROR');}
            },100);
          }
        });
      }
    }

    waitForKernel();
  })();
  </script>
