<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUEBOS · Shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Cyberhacker + aero glass: green terminal core with cold signal accents */
      --g          : #00ff88;
      --g-dim      : #00bb66;
      --g-faint    : #002e18;
      --g-dark     : #000f08;
      --cyan       : #00d4ff;
      --violet     : #7b4fff;
      --pink       : #ff2d78;
      --amber      : #ffcc44;
      --acid       : #baff29;
      --red        : #ff4466;
      --bg         : #020c06;

      /* Glass: dark green, dense, terminal-tinted */
      --glass      : rgba(4, 20, 12, 0.60);
      --glass2     : rgba(2, 12, 6, 0.82);
      --glass-menu : rgba(3, 14, 8, 0.90);

      /* Borders */
      --border     : rgba(0,255,136,0.16);
      --border-hot : rgba(0,255,136,0.50);
      --border-c   : rgba(0,212,255,0.22);

      /* Glows */
      --glow       : 0 0 14px #00ff8888, 0 0 40px #00ff8822;
      --glow-sm    : 0 0 8px #00ff8866;
      --glow-cyan  : 0 0 10px #00d4ffaa;
      --glow-v     : 0 0 12px #7b4fffaa;

      /* Aero glass shine layer */
      --aero-shine : linear-gradient(
        160deg,
        rgba(255,255,255,0.10) 0%,
        rgba(255,255,255,0.04) 40%,
        transparent 60%
      );

      /* Holo border: green -> cyan -> violet -> green */
      --holo       : linear-gradient(135deg,
        #00ff88cc, #00d4ffcc, #7b4fffcc, #ff2d78aa, #00ff88cc
      );

      --taskbar-h  : 58px;
      --title-h    : 34px;
      --r          : 10px;
      --r-lg       : 16px;
      --mono       : 'Share Tech Mono', monospace;
      --display    : 'Orbitron', monospace;
      --vt         : 'VT323', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--g);
      font-family: var(--mono);
      user-select: none;
    }

    /* CRT scanlines (base cyberhacker, kept subtle over wallpaper) */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px,
        transparent 1px, transparent 4px
      );
      animation: scanroll 18s linear infinite;
    }
    @keyframes scanroll { to { background-position: 0 160px; } }

    /* ── Vignette ── */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 9998;
      pointer-events: none;
      background: radial-gradient(ellipse 95% 90% at 50% 50%,
        transparent 48%, rgba(0,0,0,0.70) 100%
      );
    }

    /* ── Holographic corners ── */
    #chrome-overlay {
      position: fixed; inset: 0; z-index: 9997; pointer-events: none;
      background:
        radial-gradient(ellipse 35% 35% at 0% 0%, rgba(0,255,136,0.075) 0%, transparent 70%),
        radial-gradient(ellipse 35% 35% at 100% 0%, rgba(0,212,255,0.055) 0%, transparent 70%),
        radial-gradient(ellipse 35% 35% at 100% 100%, rgba(123,79,255,0.045) 0%, transparent 70%),
        radial-gradient(ellipse 35% 35% at 0% 100%, rgba(0,255,136,0.045) 0%, transparent 70%);
    }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; }
    #hacker-svg-layer {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none; overflow: hidden;
      opacity: 0.76;
    }
    .hud-bracket {
      position:absolute; width:96px; height:96px;
      border-color: rgba(0,255,136,0.34);
      border-style: solid;
      filter: drop-shadow(0 0 10px rgba(0,255,136,0.30));
      animation: bracketFlicker 4.8s steps(2,end) infinite;
    }
    .hud-bracket.tl { top:18px; left:18px; border-width:2px 0 0 2px; }
    .hud-bracket.tr { top:18px; right:18px; border-width:2px 2px 0 0; animation-delay:-0.9s; }
    .hud-bracket.bl { bottom:calc(var(--taskbar-h) + 18px); left:18px; border-width:0 0 2px 2px; animation-delay:-1.8s; }
    .hud-bracket.br { bottom:calc(var(--taskbar-h) + 18px); right:18px; border-width:0 2px 2px 0; animation-delay:-2.7s; }
    @keyframes bracketFlicker {
      0%, 92%, 100% { opacity:0.70; transform:none; }
      94% { opacity:0.18; transform:translateX(2px); }
      96% { opacity:0.88; transform:translateX(-1px); }
    }

    /* ════════════════════════════
       ANIMATION 1 · ICON FLOAT
       Icons bob gently at rest
    ════════════════════════════ */
    @keyframes iconFloat {
      0%, 100% { transform: translateY(0px);   }
      50%       { transform: translateY(-7px);  }
    }

    /* ════════════════════════════════════
       ANIMATION 2 · WINDOW GLITCH-IN
       RGB-split chromatic flash on open
    ════════════════════════════════════ */
    @keyframes winGlitchIn {
      0%   { opacity:0; transform:scale(0.9); filter:none; }
      8%   { opacity:1; transform:scale(1.02) translateX(-4px);
             filter:hue-rotate(80deg) saturate(3) brightness(1.4);
             clip-path:inset(12% 0 22% 0); }
      16%  { transform:scale(1.01) translateX(4px);
             filter:hue-rotate(-80deg) saturate(3) brightness(1.2);
             clip-path:inset(40% 0 8% 0); }
      24%  { transform:scale(0.99); filter:none; clip-path:inset(0); }
      100% { opacity:1; transform:none; filter:none; clip-path:inset(0); }
    }

    /* ═══════════════════════════════════════
       ANIMATION 3 · HOLO BORDER SPIN
       Focused windows get a spinning gradient
    ═══════════════════════════════════════ */
    @keyframes holoBorderSpin {
      0%   { background-position:   0%   0%; }
      100% { background-position: 400% 400%; }
    }
    @keyframes holoGlowPulse {
      0%,100% {
        box-shadow:
          0 32px 100px rgba(0,0,0,0.9),
          0 0 0 1px rgba(0,255,136,0.15),
          0 0 30px rgba(0,255,136,0.07);
      }
      33% {
        box-shadow:
          0 32px 100px rgba(0,0,0,0.9),
          0 0 0 1px rgba(0,212,255,0.25),
          0 0 40px rgba(0,212,255,0.10);
      }
      66% {
        box-shadow:
          0 32px 100px rgba(0,0,0,0.9),
          0 0 0 1px rgba(123,79,255,0.22),
          0 0 36px rgba(123,79,255,0.09);
      }
    }

    /* ── Desktop ── */
    #desktop {
      position: fixed; top:0; left:0; right:0;
      bottom: var(--taskbar-h); z-index: 1;
    }
    #desktop.drop-active {
      outline: 2px dashed rgba(0,255,136,0.3);
      outline-offset: -12px;
    }
    .drop-zone-hint {
      position: absolute; inset: 24px;
      border: 1px dashed rgba(0,255,136,0.18);
      border-radius: 22px; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; letter-spacing: 0.38em;
      color: rgba(0,255,136,0.28);
      opacity: 0; transition: opacity 0.22s;
    }
    #desktop.drop-active .drop-zone-hint { opacity: 1; }

    /* ── Desktop icons ── */
    #desktop-icons {
      position: absolute; top: 18px; left: 18px;
      display: flex; flex-direction: column;
      gap: 6px; align-items: center;
    }
    #desktop-icons.grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      grid-auto-rows: minmax(96px, auto);
      width: min(550px, calc(100vw - 40px));
      align-items: start; justify-items: center;
    }

    .desktop-icon {
      display: flex; flex-direction: column;
      align-items: center; gap: 7px;
      cursor: pointer; padding: 11px 13px;
      border-radius: 16px;
      border: 1px solid transparent;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
                  background 0.22s, border-color 0.22s, box-shadow 0.22s;
      min-width: 80px; position: relative;
      /* ANIMATION 1 — float idle */
      animation: iconFloat 3.6s ease-in-out infinite;
    }
    .desktop-icon .icon-wrap {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      position: relative;
      border: 1px solid rgba(0,255,136,0.12);
      border-radius: 11px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), transparent 48%),
        radial-gradient(circle at 50% 18%, rgba(0,255,136,0.13), rgba(0,0,0,0.16) 68%);
      box-shadow: inset 0 0 18px rgba(0,255,136,0.035);
    }
    .desktop-icon .icon-wrap::before,
    .desktop-icon .icon-wrap::after {
      content: '';
      position: absolute; inset: 5px;
      border-color: rgba(0,255,136,0.36);
      border-style: solid;
      opacity: 0;
      transition: opacity 0.18s, transform 0.18s;
    }
    .desktop-icon .icon-wrap::before { border-width: 1px 0 0 1px; transform: translate(-2px,-2px); }
    .desktop-icon .icon-wrap::after { border-width: 0 1px 1px 0; transform: translate(2px,2px); }
    /* Stagger float per child */
    .desktop-icon:nth-child(2)  { animation-delay: -0.7s; }
    .desktop-icon:nth-child(3)  { animation-delay: -1.4s; }
    .desktop-icon:nth-child(4)  { animation-delay: -2.1s; }
    .desktop-icon:nth-child(5)  { animation-delay: -2.8s; }
    .desktop-icon:nth-child(6)  { animation-delay: -0.3s; }
    .desktop-icon:nth-child(7)  { animation-delay: -1.0s; }
    .desktop-icon:nth-child(8)  { animation-delay: -1.8s; }
    .desktop-icon:nth-child(9)  { animation-delay: -2.5s; }
    .desktop-icon:nth-child(10) { animation-delay: -0.5s; }

    /* Aero glass shine */
    .desktop-icon::before {
      content: '';
      position: absolute; inset: 0; border-radius: 16px;
      background: var(--aero-shine);
      opacity: 0; transition: opacity 0.22s;
      pointer-events: none;
    }
    /* Signal border pseudo — green/cyan only */
    .desktop-icon::after {
      content: ''; position: absolute; inset: -1px;
      border-radius: 17px;
      background: linear-gradient(135deg,
        rgba(0,255,136,0.68),
        rgba(0,212,255,0.42),
        rgba(0,255,136,0.34)
      );
      opacity: 0; z-index: -1;
      transition: opacity 0.22s;
    }
    .desktop-icon:hover {
      /* override float, keep hover lift */
      animation: none;
      transform: translateY(-6px) scale(1.08);
      background: rgba(0,255,136,0.08);
      backdrop-filter: blur(14px);
      border-color: rgba(0,255,136,0.22);
      box-shadow:
        0 14px 44px rgba(0,0,0,0.55),
        var(--glow-sm),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .desktop-icon:hover::before { opacity: 1; }
    .desktop-icon:hover::after  { opacity: 1; }
    .desktop-icon.active {
      animation: none;
      background: rgba(0,255,136,0.12);
      backdrop-filter: blur(16px);
      border-color: rgba(0,255,136,0.32);
      box-shadow: 0 0 0 1px rgba(0,212,255,0.2), var(--glow-sm);
    }
    .desktop-icon .icon {
      font-size: 2.15rem; line-height: 1;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.65));
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
      position: relative; z-index: 1;
    }
    .desktop-icon:hover .icon { transform: scale(1.16); }
    .desktop-icon:hover .icon-wrap {
      border-color: rgba(0,255,136,0.32);
      box-shadow: inset 0 0 22px rgba(0,255,136,0.06), var(--glow-sm);
    }
    .desktop-icon:hover .icon-wrap::before,
    .desktop-icon:hover .icon-wrap::after { opacity: 1; transform: none; }
    .desktop-icon .label {
      font-size: 0.60rem; color: rgba(220,255,238,0.92);
      text-shadow: 0 1px 8px #000a, 0 0 12px rgba(0,255,136,0.28);
      text-align: center; white-space: nowrap; letter-spacing: 0.05em;
      background: rgba(0,0,0,0.48);
      padding: 2px 8px; border-radius: 5px;
      backdrop-filter: blur(5px);
    }
    .desktop-icon .shortcut-badge {
      position: absolute; top: -2px; right: -2px;
      width: 16px; height: 16px; border-radius: 50%;
      display: grid; place-items: center; font-size: 0.58rem;
      background: rgba(0,212,255,0.95); color: #041018;
      box-shadow: 0 0 10px rgba(0,212,255,0.4);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* ── WM layer ── */
    #wm-layer {
      position: fixed; top:0; left:0; right:0;
      bottom: var(--taskbar-h); z-index: 10;
      pointer-events: none;
    }

    /* ── Window ── */
    .wm-window {
      position: absolute;
      min-width: 300px; min-height: 180px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow:
        0 28px 90px rgba(0,0,0,0.88),
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex; flex-direction: column;
      overflow: hidden; pointer-events: all;
      will-change: transform;
      backdrop-filter: blur(32px) saturate(1.4);
      -webkit-backdrop-filter: blur(32px) saturate(1.4);
      transition: box-shadow 0.3s, border-color 0.3s;
    }
    /* Aero inner top shine */
    .wm-window::before {
      content: '';
      position: absolute; top:0; left:0; right:0; height:55%;
      background: var(--aero-shine);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      pointer-events: none; z-index: 0;
    }
    /* ANIMATION 3 — holo glow on focused windows */
    .wm-window.focused {
      border-color: rgba(0,255,136,0.28);
      animation: holoGlowPulse 4s ease-in-out infinite;
    }
    .wm-window.minimized {
      opacity: 0; pointer-events: none;
      transform: scale(0.82) translateY(34px);
      transition: opacity 0.22s, transform 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    .wm-window.maximized {
      top:0!important; left:0!important;
      width:100%!important; height:100%!important;
      border-radius: 0;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    /* ANIMATION 2 — glitch-in on open */
    .wm-window.animating-in {
      animation: winGlitchIn 0.36s cubic-bezier(0.34,1.2,0.64,1) forwards;
    }
    .wm-window.animating-close {
      animation: winOut 0.18s cubic-bezier(0.4,0,1,1) forwards;
    }
    @keyframes winOut { to { opacity:0; transform:scale(0.9) translateY(14px); } }

    /* Titlebar — green-tinted Aero chrome */
    .wm-titlebar {
      height: var(--title-h);
      display: flex; align-items: center;
      padding: 0 10px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.11) 0%,
        rgba(0,200,120,0.18)   30%,
        rgba(0,120,70,0.14)    70%,
        rgba(0,60,30,0.10)     100%
      );
      border-bottom: 1px solid rgba(0,255,136,0.12);
      cursor: move; flex-shrink: 0; gap: 8px;
      position: relative; z-index: 1;
    }
    .wm-titlebar .win-icon,
    .wm-titlebar .win-title,
    .wm-titlebar .win-meta,
    .wm-controls { position: relative; z-index: 1; }
    /* Top reflection bar */
    .wm-titlebar::before {
      content: '';
      position: absolute; top:0; left:0; right:0; height:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, transparent 100%);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      pointer-events: none;
    }
    /* Bottom accent — green → cyan gradient */
    .wm-titlebar::after {
      content: '';
      position: absolute; bottom:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0,255,136,0.35) 30%,
        rgba(0,212,255,0.25) 70%,
        transparent
      );
    }
    .wm-titlebar .win-title::after {
      content:'';
      display:inline-block;
      width:6px; height:1em;
      margin-left:6px;
      vertical-align:-0.16em;
      background:var(--g);
      box-shadow:var(--glow-sm);
      animation: titleCursor 1.2s steps(1,end) infinite;
    }
    .wm-window.focused .wm-titlebar {
      background: linear-gradient(180deg,
        rgba(255,255,255,0.15) 0%,
        rgba(0,220,140,0.24)   30%,
        rgba(0,150,90,0.18)    70%,
        rgba(0,80,40,0.12)     100%
      );
    }
    .wm-titlebar .win-icon {
      font-size: 1rem; flex-shrink: 0;
      filter: drop-shadow(0 0 6px rgba(0,255,136,0.65));
    }
    .wm-titlebar .win-title {
      flex:1; font-size:0.68rem;
      font-family: var(--display);
      color: rgba(210,255,235,0.95);
      letter-spacing: 0.13em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-shadow: 0 0 14px rgba(0,255,136,0.5), 0 1px 2px rgba(0,0,0,0.8);
    }
    .win-meta {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 5px;
      padding: 2px 7px;
      border: 1px solid rgba(0,255,136,0.14);
      border-radius: 5px;
      background: rgba(0,0,0,0.20);
      color: rgba(0,212,255,0.74);
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-shadow: 0 0 8px rgba(0,212,255,0.28);
    }
    .win-meta::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--g);
      box-shadow: var(--glow-sm);
      animation: dotPulse 2s ease-in-out infinite;
    }
    .wm-controls { display: flex; gap: 6px; flex-shrink: 0; }
    .wm-btn {
      width: 14px; height: 14px; border-radius: 50%;
      border: none; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .wm-btn:hover { transform: scale(1.28); }
    .wm-btn.min {
      background: radial-gradient(circle, #ffe066 20%, #e8aa00 100%);
      box-shadow: 0 1px 4px rgba(230,170,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .wm-btn.min:hover { box-shadow: 0 0 12px rgba(255,220,0,0.9); }
    .wm-btn.max {
      background: radial-gradient(circle, #44ff88 20%, #00cc55 100%);
      box-shadow: 0 1px 4px rgba(0,200,90,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .wm-btn.max:hover { box-shadow: 0 0 12px rgba(0,255,100,0.9); }
    .wm-btn.cls {
      background: radial-gradient(circle, #ff6688 20%, #dd2233 100%);
      box-shadow: 0 1px 4px rgba(255,40,60,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .wm-btn.cls:hover { box-shadow: 0 0 12px rgba(255,40,60,0.9); }
    .wm-controls:hover .wm-btn.min::before { content: '─'; }
    .wm-controls:hover .wm-btn.max::before { content: '□'; }
    .wm-controls:hover .wm-btn.cls::before { content: '✕'; }
    .wm-btn::before {
      font-size: 7px; color: rgba(0,0,0,0.68);
      font-weight: 900; line-height: 1; position: relative; z-index:1;
    }

    .wm-content { flex:1; overflow:auto; position:relative; z-index:1; }
    .wm-content::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      background:
        linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0,255,136,0.018) 1px, transparent 1px);
      background-size: 34px 34px;
      opacity: 0;
      transition: opacity 0.22s;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.55), transparent 55%);
    }
    .wm-window.focused .wm-content::before { opacity: 0.34; }
    .wm-content iframe { width:100%; height:100%; border:none; background:transparent; }
    .wm-placeholder {
      padding:28px; font-size:0.75rem;
      color: var(--g-dim); line-height:1.8;
    }
    .wm-placeholder h2 {
      font-family: var(--display); font-size:1.1rem;
      color: var(--g); text-shadow: var(--glow-sm);
      margin-bottom:14px; letter-spacing:0.1em;
    }

    /* Resize handles */
    .wm-resize { position:absolute; background:transparent; z-index:10; }
    .wm-resize.n  { top:-4px; left:14px; right:14px; height:8px; cursor:n-resize; }
    .wm-resize.s  { bottom:-4px; left:14px; right:14px; height:8px; cursor:s-resize; }
    .wm-resize.e  { top:14px; right:-4px; bottom:14px; width:8px; cursor:e-resize; }
    .wm-resize.w  { top:14px; left:-4px; bottom:14px; width:8px; cursor:w-resize; }
    .wm-resize.ne { top:-4px; right:-4px; width:16px; height:16px; cursor:ne-resize; }
    .wm-resize.nw { top:-4px; left:-4px; width:16px; height:16px; cursor:nw-resize; }
    .wm-resize.se { bottom:-4px; right:-4px; width:16px; height:16px; cursor:se-resize; }
    .wm-resize.sw { bottom:-4px; left:-4px; width:16px; height:16px; cursor:sw-resize; }
    .wm-resize.se::after {
      content:''; position:absolute; bottom:5px; right:5px;
      width:7px; height:7px;
      border-right:1.5px solid rgba(0,255,136,0.22);
      border-bottom:1.5px solid rgba(0,255,136,0.22);
    }

    /* ═══════════════════════════════════
       TASKBAR — frosted glass dock
    ═══════════════════════════════════ */
    #taskbar {
      position: fixed; bottom:0; left:0; right:0;
      height: var(--taskbar-h);
      background: rgba(1,8,4,0.88);
      border-top: 1px solid rgba(0,255,136,0.10);
      display: flex; align-items: center;
      z-index: 1000;
      backdrop-filter: blur(40px) saturate(1.6);
      -webkit-backdrop-filter: blur(40px) saturate(1.6);
      box-shadow: 0 -1px 0 rgba(255,255,255,0.04), 0 -10px 50px rgba(0,0,0,0.65);
    }
    /* Top glow — green→cyan gradient */
    #taskbar::before {
      content:'';
      position:absolute; top:0; left:8%; right:8%; height:1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0,255,136,0.45) 30%,
        rgba(0,212,255,0.30) 55%,
        rgba(123,79,255,0.20) 80%,
        transparent
      );
    }
    /* Aero inner highlight */
    #taskbar::after {
      content:'';
      position:absolute; top:1px; left:4%; right:4%; height:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      pointer-events:none;
    }

    #start-zone {
      display:flex; align-items:center;
      padding:0 8px; height:100%; flex-shrink:0;
      border-right:1px solid rgba(0,255,136,0.07);
    }
    #start-btn {
      display:flex; align-items:center; gap:8px;
      font-family: var(--display);
      font-size:0.76rem; font-weight:700;
      background: linear-gradient(135deg,
        rgba(0,255,136,0.10) 0%,
        rgba(0,212,255,0.07) 100%
      );
      border:1px solid rgba(0,255,136,0.20);
      color: var(--g); padding:0 17px; height:38px;
      cursor:pointer; border-radius:9px;
      letter-spacing:0.15em;
      text-shadow: var(--glow-sm);
      transition:all 0.2s;
      white-space:nowrap; position:relative; overflow:hidden;
    }
    #start-btn::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 100%);
      border-radius:9px 9px 0 0; opacity:0.7;
    }
    #start-btn:hover, #start-btn.active {
      background: linear-gradient(135deg,
        rgba(0,255,136,0.18) 0%,
        rgba(0,212,255,0.12) 100%
      );
      border-color:rgba(0,255,136,0.48);
      box-shadow: var(--glow-sm), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .start-logo-img {
      width:18px; height:18px; object-fit:contain;
      filter:drop-shadow(0 0 5px var(--g));
      animation: logoPulse 3.2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { filter:drop-shadow(0 0 4px #00ff88aa); }
      50%      { filter:drop-shadow(0 0 12px #00ff88ff) drop-shadow(0 0 20px #00d4ffaa); }
    }
    #start-btn.active::after {
      content:'';
      position:absolute; bottom:-1px; left:20%; right:20%; height:2px;
      background: linear-gradient(90deg, var(--g), var(--cyan));
      box-shadow: var(--glow-sm); border-radius:2px;
    }

    #taskbar-apps {
      flex:1; display:flex; gap:4px;
      overflow-x:auto; overflow-y:hidden;
      align-items:center; padding:0 10px;
    }
    #taskbar-apps::-webkit-scrollbar { display:none; }

    .tb-app {
      display:flex; align-items:center; gap:7px;
      height:36px; padding:0 13px;
      background: rgba(0,255,136,0.04);
      border:1px solid rgba(0,255,136,0.09);
      border-radius:8px; cursor:pointer;
      font-size:0.65rem; font-family: var(--mono);
      color: rgba(0,200,110,0.65);
      letter-spacing:0.07em;
      white-space:nowrap; max-width:184px;
      overflow:hidden; text-overflow:ellipsis;
      transition:all 0.18s; flex-shrink:0; position:relative;
      backdrop-filter:blur(10px);
      transform-origin: bottom center;
    }
    .tb-app .tb-label,
    .tb-app .tb-icon { position:relative; z-index:1; }
    .tb-app .tb-signal {
      position:absolute; left:10px; right:10px; bottom:2px;
      height:1px; overflow:hidden; opacity:0.55;
      background:rgba(0,255,136,0.10);
    }
    .tb-app .tb-signal::before {
      content:''; display:block; height:100%; width:38%;
      background:linear-gradient(90deg, transparent, var(--g), var(--cyan), transparent);
      transform:translateX(-120%);
      animation: signalSweep 2.8s linear infinite;
    }
    .tb-app::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
      border-radius:8px 8px 0 0;
    }
    .tb-app::after {
      content:'';
      position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
      width:4px; height:4px; border-radius:50%;
      background: var(--g-dim); transition:all 0.2s;
    }
    .tb-app .tb-icon { font-size:1rem; flex-shrink:0; }
    .tb-app:hover {
      background: rgba(0,255,136,0.10);
      border-color: rgba(0,255,136,0.26);
      color: var(--g); transform:translateY(-3px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4), var(--glow-sm);
    }
    .tb-app.focused {
      background: linear-gradient(135deg,
        rgba(0,255,136,0.12), rgba(0,212,255,0.08)
      );
      border-color:rgba(0,255,136,0.36);
      color: var(--g);
      box-shadow: 0 2px 14px rgba(0,255,136,0.12), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .tb-app.focused::after { background:var(--g); box-shadow:var(--glow-sm); width:20px; }
    .tb-app.focused .tb-signal { opacity:1; }
    .tb-app.minimized { opacity:0.46; transform:translateY(3px) scale(0.96); }
    .tb-app.minimized::after { background:rgba(0,255,136,0.3); }
    .tb-app.tb-enter {
      animation: tbBootIn 0.42s cubic-bezier(0.18,1.35,0.32,1) both;
    }
    .tb-app.tb-closing {
      pointer-events:none;
      animation: tbShutdown 0.24s cubic-bezier(0.4,0,1,1) both;
    }
    .tb-app.tb-min-pulse {
      animation: tbMinPulse 0.26s ease-out;
    }

    #taskbar-sys {
      display:flex; align-items:center;
      padding:0 8px; flex-shrink:0;
      border-left:1px solid rgba(0,255,136,0.07); height:100%;
    }
    #taskbar-sys::before {
      content:'SYS';
      color:rgba(0,212,255,0.34);
      font-size:0.52rem;
      letter-spacing:0.18em;
      margin-left:8px;
    }
    .sys-indicator {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:0 13px; height:100%;
      cursor:default; position:relative;
    }
    .sys-indicator::after {
      content:'';
      position:absolute; top:7px; right:0; bottom:7px; width:1px;
      background:rgba(0,255,136,0.07);
    }
    #taskbar-clock-time {
      font-family: var(--display); font-size:0.95rem; font-weight:700;
      color: var(--g); text-shadow: var(--glow-sm);
      letter-spacing:0.12em; line-height:1;
      /* Subtle neon flicker */
      animation: neonFlicker 8s ease-in-out infinite;
    }
    @keyframes neonFlicker {
      0%,94%,96%,100% { text-shadow: var(--glow-sm); }
      95%  { text-shadow: none; opacity:0.7; }
    }
    #taskbar-clock-date {
      font-size:0.53rem; color:var(--g-dim);
      letter-spacing:0.10em; margin-top:2px;
    }
    .sys-dots { display:flex; gap:3px; align-items:center; padding:0 12px; }
    .sys-dot {
      width:5px; height:5px; border-radius:50%;
      animation: dotPulse 2.6s ease-in-out infinite;
    }
    .sys-dot:nth-child(1) { background:rgba(0,255,136,0.4); }
    .sys-dot:nth-child(2) { background:rgba(0,212,255,0.45); animation-delay:0.32s; }
    .sys-dot:nth-child(3) { background:rgba(123,79,255,0.40); animation-delay:0.64s; }
    @keyframes dotPulse {
      0%,100% { opacity:0.38; transform:scale(0.88); }
      50%      { opacity:1;    transform:scale(1.14); }
    }
    @keyframes signalSweep {
      to { transform:translateX(280%); }
    }
    @keyframes tbBootIn {
      0% {
        opacity:0;
        transform:translateY(18px) scaleX(0.36) scaleY(0.72);
        filter:brightness(2.2) saturate(1.8);
        clip-path:inset(0 50% 0 50%);
      }
      42% {
        opacity:1;
        transform:translateY(-4px) scaleX(1.08) scaleY(1);
        clip-path:inset(0);
      }
      68% { transform:translateY(1px) scaleX(0.98); }
      100% { opacity:1; transform:none; filter:none; clip-path:inset(0); }
    }
    @keyframes tbShutdown {
      0% { opacity:1; transform:none; filter:none; clip-path:inset(0); }
      38% {
        opacity:0.9;
        transform:translateY(-2px) scaleX(1.04);
        filter:brightness(1.8) hue-rotate(18deg);
        clip-path:inset(34% 0 24% 0);
      }
      100% {
        opacity:0;
        transform:translateY(14px) scaleX(0.25) scaleY(0.72);
        filter:brightness(0.7);
        clip-path:inset(0 48% 0 48%);
      }
    }
    @keyframes tbMinPulse {
      0% { transform:translateY(-2px) scale(1.02); filter:brightness(1.7); }
      100% { transform:translateY(3px) scale(0.96); filter:none; }
    }

    /* ══ Start Menu ══ */
    #start-menu {
      position:fixed;
      bottom:calc(var(--taskbar-h) + 12px); left:8px;
      width:368px; max-height:555px;
      background: var(--glass-menu);
      border:1px solid rgba(0,255,136,0.18);
      border-radius:18px;
      box-shadow:
        0 -6px 80px rgba(0,0,0,0.92),
        0 0 0 1px rgba(255,255,255,0.04),
        0 0 55px rgba(0,255,136,0.05),
        inset 0 1px 0 rgba(255,255,255,0.07);
      backdrop-filter:blur(44px) saturate(1.7);
      -webkit-backdrop-filter:blur(44px) saturate(1.7);
      z-index:2000; display:flex; flex-direction:column;
      overflow:hidden; transform-origin:bottom left;
      transition:opacity 0.22s cubic-bezier(0.4,0,0.2,1),
                 transform 0.22s cubic-bezier(0.34,1.2,0.64,1);
    }
    #start-menu::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:65px;
      background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 100%);
      border-radius:18px 18px 0 0; pointer-events:none;
    }
    #start-menu::after {
      content:'';
      position:absolute; top:0; left:12%; right:12%; height:1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0,255,136,0.5) 30%,
        rgba(0,212,255,0.35) 70%,
        transparent
      );
    }
    #start-menu.hidden { opacity:0; pointer-events:none; transform:scale(0.94) translateY(13px); }

    .start-header {
      display:flex; align-items:center; gap:12px;
      padding:17px 17px 13px;
      border-bottom:1px solid rgba(0,255,136,0.07);
      position:relative; z-index:1;
    }
    .start-header::after {
      content:'ACCESS:USER / APPS:REGISTRY';
      position:absolute; right:16px; bottom:8px;
      color:rgba(0,212,255,0.34);
      font-size:0.48rem; letter-spacing:0.14em;
    }
    .start-header-logo {
      width:40px; height:40px; object-fit:contain;
      filter:drop-shadow(0 0 8px #00ff88cc) drop-shadow(0 0 18px #00d4ffaa);
      animation:logoPulse 3.2s ease-in-out infinite;
    }
    .start-title {
      font-family:var(--display); font-size:1.3rem;
      color:var(--g); text-shadow:var(--glow);
      letter-spacing:0.22em; line-height:1; display:block;
    }
    .start-version { font-size:0.57rem; color:var(--g-dim); letter-spacing:0.15em; opacity:0.65; }

    .start-search-wrap {
      padding:10px 14px;
      border-bottom:1px solid rgba(0,255,136,0.06);
      position:relative; z-index:1;
    }
    #start-search {
      width:100%;
      background:rgba(0,255,136,0.05);
      border:1px solid rgba(0,255,136,0.16);
      border-radius:9px; padding:8px 13px;
      color:var(--g); font-family:var(--mono);
      font-size:0.73rem; outline:none;
      caret-color:var(--g); letter-spacing:0.05em;
      transition:border-color 0.2s, box-shadow 0.2s;
      backdrop-filter:blur(8px);
    }
    #start-search:focus {
      border-color:rgba(0,255,136,0.44);
      box-shadow: var(--glow-sm), inset 0 0 22px rgba(0,255,136,0.03);
    }
    #start-search::placeholder { color:rgba(0,180,90,0.36); }

    #start-apps {
      flex:1; overflow-y:auto; padding:10px 12px;
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:4px; align-content:start; position:relative; z-index:1;
      background:
        linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0,255,136,0.018) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    #start-apps::-webkit-scrollbar { width:3px; }
    #start-apps::-webkit-scrollbar-thumb { background:rgba(0,180,90,0.28); border-radius:2px; }

    .start-app-item {
      display:flex; flex-direction:column;
      align-items:center; gap:5px;
      padding:12px 6px; border-radius:12px;
      cursor:pointer; border:1px solid transparent;
      transition:all 0.18s cubic-bezier(0.34,1.4,0.64,1);
      position:relative; overflow:hidden;
    }
    .start-app-item::after {
      content: attr(data-app-id);
      position:absolute; left:7px; right:7px; bottom:4px;
      color:rgba(0,212,255,0.28);
      font-size:0.43rem; letter-spacing:0.08em;
      text-align:center; overflow:hidden; text-overflow:ellipsis;
      opacity:0; transform:translateY(4px);
      transition:opacity 0.18s, transform 0.18s;
    }
    .start-app-item::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 100%);
      border-radius:12px 12px 0 0; opacity:0; transition:opacity 0.18s;
    }
    .start-app-item:hover {
      background: linear-gradient(135deg,
        rgba(0,255,136,0.10), rgba(0,212,255,0.06)
      );
      border-color:rgba(0,255,136,0.22);
      transform:translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .start-app-item:hover::before { opacity:1; }
    .start-app-item:hover::after { opacity:1; transform:none; }
    .start-app-item .sa-icon {
      font-size:1.72rem;
      transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
      filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));
      position:relative; z-index:1;
    }
    .start-app-item:hover .sa-icon { transform:scale(1.22); }
    .start-app-item .sa-name { font-size:0.59rem; color:rgba(0,200,110,0.72); text-align:center; line-height:1.3; letter-spacing:0.04em; padding-bottom:6px; }
    .start-app-item:hover .sa-name { color:var(--g); }

    .start-footer {
      padding:10px 14px;
      border-top:1px solid rgba(0,255,136,0.07);
      display:flex; justify-content:flex-end; align-items:center;
      gap:8px; position:relative; z-index:1;
    }
    .start-footer-label { font-size:0.58rem; color:rgba(0,180,80,0.36); letter-spacing:0.1em; flex:1; }
    #start-lock, #start-shutdown {
      width:34px; height:34px; border-radius:8px; cursor:pointer;
      transition:all 0.18s; display:flex; align-items:center; justify-content:center;
      font-size:1rem;
    }
    #start-lock {
      background:rgba(255,200,60,0.07); border:1px solid rgba(255,200,60,0.22);
      color:rgba(255,200,100,0.75);
    }
    #start-lock:hover {
      background:rgba(255,200,60,0.18); border-color:rgba(255,200,60,0.5);
      color:#ffdd66; box-shadow:0 0 14px rgba(255,200,60,0.22);
      transform:scale(1.1);
    }
    #start-shutdown {
      background:rgba(255,60,70,0.07); border:1px solid rgba(255,60,70,0.22);
      color:rgba(255,100,110,0.75);
    }
    #start-shutdown:hover {
      background:rgba(255,60,70,0.18); border-color:rgba(255,60,70,0.5);
      color:var(--red); box-shadow:0 0 14px rgba(255,60,70,0.22);
      transform:scale(1.1);
    }

    /* ══ Context Menu ══ */
    #ctx-menu {
      position:fixed; min-width:192px;
      background:rgba(2,12,7,0.97);
      border:1px solid rgba(0,255,136,0.18);
      border-radius:13px;
      box-shadow:
        0 18px 65px rgba(0,0,0,0.92),
        0 0 0 1px rgba(255,255,255,0.03),
        inset 0 1px 0 rgba(255,255,255,0.06);
      z-index:5000; overflow:hidden;
      backdrop-filter:blur(30px) saturate(1.6);
      transition:opacity 0.12s, transform 0.12s;
      transform-origin:top left;
    }
    #ctx-menu::before {
      content:'';
      position:absolute; top:0; left:15%; right:15%; height:1px;
      background:linear-gradient(90deg, transparent, rgba(0,255,136,0.35) 40%, rgba(0,212,255,0.22) 70%, transparent);
    }
    #ctx-menu.hidden { opacity:0; pointer-events:none; transform:scale(0.94); }
    .ctx-item {
      display:flex; align-items:center; gap:10px;
      padding:9px 16px; font-size:0.70rem;
      color:rgba(0,200,110,0.72); cursor:pointer;
      letter-spacing:0.06em;
      transition:background 0.12s, color 0.12s, padding-left 0.12s;
    }
    .ctx-item .ctx-icon { font-size:0.85rem; width:18px; text-align:center; opacity:0.76; }
    .ctx-item:hover {
      background:linear-gradient(90deg, rgba(0,255,136,0.10), rgba(0,212,255,0.05));
      color:var(--g); padding-left:20px;
    }
    .ctx-separator { height:1px; background:rgba(0,255,136,0.07); margin:4px 0; }
    .ctx-label { padding:6px 16px 3px; font-size:0.56rem; color:rgba(0,180,80,0.38); letter-spacing:0.2em; }

    /* ══ Toast ══ */
    #toast-container {
      position:fixed; top:16px; right:16px;
      z-index:6000; display:flex; flex-direction:column;
      gap:8px; pointer-events:none;
    }
    .toast {
      min-width:264px; max-width:368px;
      padding:12px 16px;
      background:rgba(2,12,7,0.96);
      border:1px solid rgba(0,255,136,0.16);
      border-radius:13px;
      box-shadow:
        0 10px 48px rgba(0,0,0,0.88),
        0 0 0 1px rgba(255,255,255,0.03),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter:blur(26px) saturate(1.6);
      display:flex; align-items:flex-start; gap:10px;
      pointer-events:all; position:relative; overflow:hidden;
      animation:toastIn 0.28s cubic-bezier(0.34,1.4,0.64,1) forwards;
    }
    .toast .toast-code {
      flex-shrink: 0;
      margin-left: 6px;
      color: rgba(0,212,255,0.42);
      font-size: 0.52rem;
      letter-spacing: 0.13em;
      align-self: flex-start;
    }
    .toast::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:38%;
      background:linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
    }
    .toast::after {
      content:'';
      position:absolute; bottom:0; left:0; height:2px;
      background:linear-gradient(90deg, var(--g), var(--cyan));
      animation:toastProgress var(--toast-dur, 3.5s) linear forwards;
      width:100%;
    }
    .toast-left-bar {
      position:absolute; left:0; top:0; bottom:0; width:3px;
      background:linear-gradient(180deg, var(--g), var(--cyan));
      border-radius:13px 0 0 13px;
    }
    .toast.toast-warn  .toast-left-bar { background:var(--amber); }
    .toast.toast-warn::after            { background:var(--amber); }
    .toast.toast-error .toast-left-bar  { background:var(--red); }
    .toast.toast-error::after           { background:var(--red); }
    .toast.toast-info  .toast-left-bar  { background:var(--violet); }
    .toast.toast-info::after            { background:var(--violet); }
    .toast.toast-out { animation:toastOut 0.22s cubic-bezier(0.4,0,1,1) forwards; }
    @keyframes toastProgress { to { width:0%; } }
    @keyframes toastIn  { from { opacity:0; transform:translateX(30px) scale(0.94); } to { opacity:1; transform:none; } }
    @keyframes toastOut { to   { opacity:0; transform:translateX(30px) scale(0.91); } }
    .toast-icon { font-size:1.1rem; flex-shrink:0; margin-top:1px; margin-left:4px; }
    .toast-body { flex:1; }
    .toast-title {
      font-family:var(--display); font-size:0.67rem;
      color:var(--g); margin-bottom:3px; letter-spacing:0.1em;
    }
    .toast.toast-warn  .toast-title { color:var(--amber); }
    .toast.toast-error .toast-title { color:var(--red); }
    .toast.toast-info  .toast-title { color:var(--violet); }
    .toast-msg { font-size:0.63rem; color:rgba(0,195,110,0.72); line-height:1.55; }

    /* ══ Loading ══ */
    #shell-loading {
      position:fixed; inset:0; z-index:8000;

        greenDark:'#030c18', amber:'#7de3ff', red:'#ff6b6b',
        blue:'#00ccff', bg:'#020912',
        glass:'rgba(3,10,28,0.68)', border:'rgba(110,231,255,0.18)',
      },
    };

    let currentPalette = THEME_PALETTES.dark;

    /* ══ BG Canvas — base cyberhacker aurora ══ */
    const BG = (() => {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let W=0,H=0,stars=[],mode=DEFAULT_PREFS['desktop.wallpaper'];

      function resize(){
        W=canvas.width=window.innerWidth;
        H=canvas.height=window.innerHeight;
        buildStars();
      }
      function buildStars(n=260){
        stars=Array.from({length:n},()=>({
          x:Math.random()*W, y:Math.random()*H,
          r:Math.random()*1.2+0.1,
          a:Math.random(), da:(Math.random()-0.5)*0.005,
          hue:[145,190,270][Math.floor(Math.random()*3)],
        }));
      }
      function rgba(hex,alpha){
        const raw=String(hex||'#00ff88').replace('#','');
        const full=raw.length===3?raw.split('').map(c=>c+c).join(''):raw.padEnd(6,'0').slice(0,6);
        const n=parseInt(full,16);
        return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
      }
      function drawBg(){
        /* Smoked violet base with neon pockets */
        const bg=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.5,Math.max(W,H)*0.78);
        bg.addColorStop(0,currentPalette.greenDark);
        bg.addColorStop(1,currentPalette.bg);
        ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

        const neb=ctx.createRadialGradient(W*0.72,H*0.22,0,W*0.72,H*0.22,W*0.30);
        neb.addColorStop(0,'rgba(80,20,160,0.07)');
        neb.addColorStop(1,'transparent');
        ctx.fillStyle=neb; ctx.fillRect(0,0,W,H);

        const neb2=ctx.createRadialGradient(W*0.18,H*0.72,0,W*0.18,H*0.72,W*0.24);
        neb2.addColorStop(0,'rgba(0,180,220,0.06)');
        neb2.addColorStop(1,'transparent');
        ctx.fillStyle=neb2; ctx.fillRect(0,0,W,H);

        const acid=ctx.createRadialGradient(W*0.54,H*0.86,0,W*0.54,H*0.86,W*0.34);
        acid.addColorStop(0,'rgba(214,255,63,0.045)');
        acid.addColorStop(1,'transparent');
        ctx.fillStyle=acid; ctx.fillRect(0,0,W,H);
      }
      function drawAurora(t){
        [
          {s:0.008,f:0.006,a:0.14,hex:'#00ff88',y:0.15},
          {s:0.005,f:0.004,a:0.09,hex:'#00d4ff',y:0.21},
          {s:0.011,f:0.008,a:0.05,hex:'#7b4fff',y:0.11},
        ].forEach(({s,f,a,hex,y},b)=>{
          const yBase=H*y+b*H*0.04;
          const g=ctx.createLinearGradient(0,yBase-72,0,yBase+95);
          g.addColorStop(0,rgba(hex,0));
          g.addColorStop(0.38,rgba(hex,a));
          g.addColorStop(0.72,rgba(hex,a*0.42));
          g.addColorStop(1,rgba(hex,0));
          ctx.beginPath(); ctx.moveTo(0,yBase);
          for(let x=0;x<=W;x+=18){
            const y2=yBase+Math.sin(x*f+t*s)*44+Math.sin(x*f*0.4+t*s*0.58+b)*26;
            ctx.lineTo(x,y2);
          }
          ctx.lineTo(W,0); ctx.lineTo(0,0); ctx.closePath();
          ctx.fillStyle=g; ctx.fill();
        });
      }
      function drawGrid(t){
        ctx.save(); ctx.lineWidth=0.5;
        const sp=42,drift=(t*18)%sp;
        ctx.strokeStyle='rgba(0,255,136,0.09)';
        for(let x=-sp;x<=W+sp;x+=sp){ctx.beginPath();ctx.moveTo(x+drift,0);ctx.lineTo(x+drift,H);ctx.stroke();}
        ctx.strokeStyle='rgba(0,212,255,0.05)';
        for(let y=-sp;y<=H+sp;y+=sp){ctx.beginPath();ctx.moveTo(0,y+drift*0.32);ctx.lineTo(W,y+drift*0.32);ctx.stroke();}
        ctx.restore();
      }
      function setMode(m){mode=['default','solid','grid'].includes(m)?m:DEFAULT_PREFS['desktop.wallpaper'];}
      function frame(ts){
        const t=ts*0.001;
        ctx.clearRect(0,0,W,H); drawBg();
        if(mode==='default')drawAurora(t);
        if(mode!=='solid')drawGrid(t);
        if(mode!=='solid')stars.forEach(s=>{
          s.a+=s.da; if(s.a<=0.05||s.a>=1)s.da*=-1;
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle=`hsla(${s.hue},100%,78%,${s.a*0.8})`;
          ctx.fill();
        });
        requestAnimationFrame(frame);
      }
      window.addEventListener('resize',resize); resize(); requestAnimationFrame(frame);
      return {setMode};
    })();

    function applyTheme(theme){
      const p=THEME_PALETTES[theme]||THEME_PALETTES.dark; currentPalette=p;
      const r=document.documentElement.style;
      r.setProperty('--g',p.green); r.setProperty('--g-dim',p.greenDim);
      r.setProperty('--g-faint',p.greenFaint); r.setProperty('--g-dark',p.greenDark);
      r.setProperty('--amber',p.amber); r.setProperty('--red',p.red);
      r.setProperty('--cyan',p.blue); r.setProperty('--bg',p.bg);
      r.setProperty('--glass',p.glass); r.setProperty('--border',p.border);
    }
    function applyFontSize(size){document.documentElement.style.fontSize=`${Math.max(10,Math.min(24,Number(size)||14))}px`;}
    function applyDesktopGrid(e){document.getElementById('desktop-icons').classList.toggle('grid-layout',e!==false);}
    function applyWallpaper(m){BG.setMode(m||DEFAULT_PREFS['desktop.wallpaper']);}
    function applyShellPref(k,v){
      if(k==='system.theme')applyTheme(v);
      if(k==='system.fontSize')applyFontSize(v);
      if(k==='desktop.grid')applyDesktopGrid(v);
      if(k==='desktop.wallpaper')applyWallpaper(v);
    }
    async function applyShellPrefs(kernel){
      const all=await kernel.prefs.all();
      Object.entries(DEFAULT_PREFS).forEach(([k,fb])=>applyShellPref(k,all[k]!==undefined?all[k]:fb));
    }

    /* ══ TOAST ══ */
    const Toast=(()=>{
      const container=document.getElementById('toast-container');
      const ICONS={ok:'✓',warn:'⚠',error:'✕',info:'ℹ'};
      function show(msg,type='ok',title=null,duration=3500){
        const t=document.createElement('div');
        const cls=type==='warn'?'toast-warn':type==='error'?'toast-error':type==='info'?'toast-info':'';
        t.className=`toast ${cls}`; t.style.setProperty('--toast-dur',duration+'ms');
        const ttl=title||(type==='warn'?'AVISO':type==='error'?'ERROR':type==='info'?'INFO':'OK');
        const code=type==='error'?'ERR':type==='warn'?'WRN':type==='info'?'INF':'OK';
        t.innerHTML=`<div class="toast-left-bar"></div><span class="toast-icon">${ICONS[type]??'●'}</span>
          <div class="toast-body"><div class="toast-title">${ttl}</div><div class="toast-msg">${msg}</div></div><span class="toast-code">${code}</span>`;
        container.appendChild(t); t.addEventListener('click',()=>dismiss(t)); setTimeout(()=>dismiss(t),duration);
      }
      function dismiss(t){if(!t.parentNode)return;t.classList.add('toast-out');setTimeout(()=>t.remove(),230);}
      return {show};
    })();

    /* ══ CONTEXT MENU ══ */
    const CtxMenu=(()=>{
      const el=document.getElementById('ctx-menu'); let _open=false;
      function show(x,y,items){
        el.innerHTML='';
        items.forEach(item=>{
          if(item==='sep'){const s=document.createElement('div');s.className='ctx-separator';el.appendChild(s);}
          else if(item.label&&!item.action){const l=document.createElement('div');l.className='ctx-label';l.textContent=item.label;el.appendChild(l);}
          else{const d=document.createElement('div');d.className='ctx-item';
            d.innerHTML=`<span class="ctx-icon">${item.icon||''}</span>${item.text}`;
            if(item.action)d.addEventListener('click',()=>{hide();item.action();}); el.appendChild(d);}
        });
        el.classList.remove('hidden'); _open=true;
        const vw=window.innerWidth,vh=window.innerHeight;
        let lx=x,ly=y;
        if(lx+200>vw)lx=vw-206; if(ly+el.offsetHeight>vh-60)ly=ly-el.offsetHeight;
        el.style.left=lx+'px'; el.style.top=ly+'px';
      }
      function hide(){el.classList.add('hidden');_open=false;}
      document.addEventListener('click',e=>{if(_open&&!el.contains(e.target))hide();});
      document.addEventListener('contextmenu',()=>{if(_open)hide();});
      return {show,hide};
    })();

    /* ══ WINDOW MANAGER ══ */
    const WM=(()=>{
      const layer=document.getElementById('wm-layer');
      let _zTop=100; const _windows={};
      const HANDLES=['n','ne','e','se','s','sw','w','nw'];

      function focus(pid){
        Object.keys(_windows).forEach(p=>{
          const w=_windows[p]; if(!w)return;
          const wasFocused=w.el.classList.contains('focused');
          w.el.classList.toggle('focused',+p===+pid);
          if(+p===+pid&&!wasFocused){
            w.el.classList.add('focus-ripple');
            setTimeout(()=>w.el.classList.remove('focus-ripple'),420);
          }
          updateTaskbarItem(+p);
        });
        if(_windows[pid])_windows[pid].el.style.zIndex=++_zTop;
      }

function makeDraggable(titlebar,win,pidRef){
        let ox,oy,dragging=false;
        const shield=document.getElementById('drag-shield');
        titlebar.addEventListener('mousedown',e=>{
          if(e.button!==0||e.target.classList.contains('wm-btn'))return;
          const w=_windows[pidRef.pid]; if(!w||w.maximized)return;
          dragging=true; const r=win.getBoundingClientRect();
          ox=e.clientX-r.left; oy=e.clientY-r.top; focus(pidRef.pid);
          shield.style.display='block'; shield.style.cursor='grabbing'; e.preventDefault();
        });
        function onMove(e){
          if(!dragging)return;
          const maxH=window.innerHeight-58;
          let nx=Math.max(0,Math.min(e.clientX-ox,window.innerWidth-60));
          let ny=Math.max(0,Math.min(e.clientY-oy,maxH-20));
          win.style.left=nx+'px'; win.style.top=ny+'px';
          const w=_windows[pidRef.pid]; if(w){w.state.x=nx;w.state.y=ny;}
        }
        function onUp(){dragging=false;shield.style.display='none';}
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
        titlebar.addEventListener('dblclick',e=>{if(!e.target.classList.contains('wm-btn'))toggleMaximize(pidRef.pid);});
        return {onMove,onUp};
      }

      function makeResizable(win,pidRef){
        const shield=document.getElementById('drag-shield');
        HANDLES.forEach(dir=>{
          const h=document.createElement('div'); h.className=`wm-resize ${dir}`; win.appendChild(h);
          let sX,sY,sW,sH,sL,sT;
          h.addEventListener('mousedown',e=>{
            if(e.button!==0)return;
            const w=_windows[pidRef.pid]; if(!w||w.maximized)return;
            sX=e.clientX;sY=e.clientY; const r=win.getBoundingClientRect();
            sW=r.width;sH=r.height;sL=r.left;sT=r.top; focus(pidRef.pid);
            shield.style.display='block'; shield.style.cursor=getComputedStyle(h).cursor;
            e.preventDefault(); e.stopPropagation();
            const onMove=ev=>{
              const dx=ev.clientX-sX,dy=ev.clientY-sY;
              let w2=sW,h2=sH,l=sL,t=sT; const minW=300,minH=180,tbH=58;
              if(dir.includes('e'))w2=Math.max(minW,sW+dx);
              if(dir.includes('s'))h2=Math.max(minH,Math.min(sH+dy,window.innerHeight-sT-tbH));
              if(dir.includes('w')){w2=Math.max(minW,sW-dx);l=sL+sW-w2;}
              if(dir.includes('n')){h2=Math.max(minH,sH-dy);t=Math.max(0,Math.min(sT+sH-minH,sT+dy));}
              win.style.width=w2+'px';win.style.height=h2+'px';
              win.style.left=l+'px';win.style.top=t+'px';
              const wd=_windows[pidRef.pid]; if(wd)wd.state={x:l,y:t,w:w2,h:h2};
            };
            const onUp=()=>{shield.style.display='none';document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);};
            document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
          });
        });
      }

      function minimize(pid){
        const w=_windows[pid]; if(!w)return;
        w.minimized=!w.minimized; w.el.classList.toggle('minimized',w.minimized);
        updateTaskbarItem(pid);
        const tb=document.querySelector(`.tb-app[data-pid="${pid}"]`);
        if(tb){
          tb.classList.remove('tb-min-pulse');
          void tb.offsetWidth;
          tb.classList.add('tb-min-pulse');
          setTimeout(()=>tb.classList.remove('tb-min-pulse'),280);
        }
        if(!w.minimized)focus(pid);
      }
      function toggleMaximize(pid){
        const w=_windows[pid]; if(!w)return;
        if(w.maximized){
          w.maximized=false; const ps=w.prevState;
          w.el.style.width=ps.w+'px';w.el.style.height=ps.h+'px';
          w.el.style.left=ps.x+'px';w.el.style.top=ps.y+'px';
          w.el.classList.remove('maximized'); w.state={...ps};
        } else {
          w.prevState={...w.state}; w.maximized=true;
          w.el.style.width='';w.el.style.height='';
          w.el.style.left='0';w.el.style.top='0';
          w.el.classList.add('maximized');
        }
        focus(pid);
      }
function close(pid){
        const w=_windows[pid]; if(!w)return;
        w.el.classList.add('animating-close');
        setTimeout(()=>{
          if(w.dragHandlers){
            document.removeEventListener('mousemove',w.dragHandlers.onMove);
            document.removeEventListener('mouseup',w.dragHandlers.onUp);
          }
          w.el.remove();delete _windows[pid];removeTaskbarItem(pid);if(window.Kernel)Kernel.procs.kill(pid);
        },200);
      }
      function updateTaskbarItem(pid){
        const tb=document.querySelector(`.tb-app[data-pid="${pid}"]`); if(!tb)return;
        const w=_windows[pid]; if(!w)return;
        tb.classList.toggle('focused',w.el.classList.contains('focused'));
        tb.classList.toggle('minimized',!!w.minimized);
      }
      function removeTaskbarItem(pid){
        const tb=document.querySelector(`.tb-app[data-pid="${pid}"]`);
        if(!tb)return;
        tb.classList.remove('tb-enter','tb-min-pulse');
        tb.classList.add('tb-closing');
        setTimeout(()=>tb.remove(),240);
      }

      function createWindow(proc,opts={}){
        const pid=proc.pid;
        const vw=window.innerWidth,vh=window.innerHeight-58;
        const W0=opts.width||Math.min(660,vw*0.6);
        const H0=opts.height||Math.min(480,vh*0.6);
        const X0=opts.x??Math.max(0,Math.min(40+(pid%6)*36,vw-W0-20));
        const Y0=opts.y??Math.max(0,Math.min(30+(pid%6)*26,vh-H0-20));

        const win=document.createElement('div');
        win.className='wm-window animating-in';
        win.style.cssText=`left:${X0}px;top:${Y0}px;width:${W0}px;height:${H0}px;z-index:${++_zTop}`;
        win.dataset.pid=pid;

        const titlebar=document.createElement('div'); titlebar.className='wm-titlebar';
        titlebar.innerHTML=`
          <div class="wm-controls">
            <div class="wm-btn cls" title="Cerrar"></div>
            <div class="wm-btn min" title="Minimizar"></div>
            <div class="wm-btn max" title="Maximizar"></div>
          </div>
          <span class="win-icon">${proc.icon||opts.icon||'▪'}</span>
          <span class="win-title">${proc.title||opts.title||proc.appId}</span>
          <span class="win-meta">PID ${pid}</span>`;

        const content=document.createElement('div'); content.className='wm-content';
        if(opts.url){
          const iframe=document.createElement('iframe'); iframe.src=opts.url;
          iframe.sandbox='allow-scripts allow-same-origin allow-forms allow-modals';
          content.appendChild(iframe);
        } else {
          const ph=document.createElement('div'); ph.className='wm-placeholder';
          ph.innerHTML=`<h2>${proc.icon||'▪'} ${proc.title||proc.appId}</h2>
            <p>PID: ${pid} · App: <strong>${proc.appId}</strong></p>
            <p style="margin-top:10px;opacity:0.45;font-size:0.68rem">Ventana lista para contenido.<br>
            Conecta via <code>opts.url</code> o <code>opts.content</code>.</p>`;
          if(opts.content){ph.innerHTML='';if(typeof opts.content==='string')ph.innerHTML=opts.content;else ph.appendChild(opts.content);}
          content.appendChild(ph);
        }

        win.appendChild(titlebar); win.appendChild(content); layer.appendChild(win);
const pidRef={pid};
        makeResizable(win,pidRef);
        const dragHandlers=makeDraggable(titlebar,win,pidRef);
        titlebar.querySelector('.min').addEventListener('click',e=>{e.stopPropagation();minimize(pid);});
        titlebar.querySelector('.max').addEventListener('click',e=>{e.stopPropagation();toggleMaximize(pid);});
        titlebar.querySelector('.cls').addEventListener('click',e=>{e.stopPropagation();close(pid);});
        win.addEventListener('mousedown',e=>{if(!e.target.classList.contains('wm-btn'))focus(pid);});
        setTimeout(()=>win.classList.remove('animating-in'),380);

        _windows[pid]={el:win,proc,state:{x:X0,y:Y0,w:W0,h:H0},minimized:false,maximized:false,prevState:null,dragHandlers};
        addTaskbarItem(proc,pid); focus(pid);
        return _windows[pid];
      }

      function addTaskbarItem(proc,pid){
        const tbApps=document.getElementById('taskbar-apps');
        const btn=document.createElement('div');
        btn.className='tb-app focused tb-enter'; btn.dataset.pid=pid;
        btn.innerHTML=`<span class="tb-icon">${proc.icon||'▪'}</span><span class="tb-label">${proc.title||proc.appId}</span><span class="tb-signal"></span>`;
        setTimeout(()=>btn.classList.remove('tb-enter'),460);
        btn.addEventListener('click',()=>{
          const w=_windows[pid]; if(!w)return;
          if(w.minimized)minimize(pid);
          else if(w.el.classList.contains('focused'))minimize(pid);
          else focus(pid);
        });
        btn.addEventListener('contextmenu',e=>{
          e.preventDefault();
          CtxMenu.show(e.clientX,e.clientY,[
            {icon:'─',text:'Minimizar',action:()=>{const w=_windows[pid];if(w&&!w.minimized)minimize(pid);}},
            {icon:'□',text:'Maximizar',action:()=>toggleMaximize(pid)},
            'sep',{icon:'✕',text:'Cerrar',action:()=>close(pid)},
          ]);
        });
        tbApps.appendChild(btn);
      }

      return {createWindow,close,minimize,toggleMaximize,focus,getWindow:pid=>_windows[pid],windows:_windows};
    })();

        const Dialog = (() => {
      const _ok  = 'padding:7px 20px;border-radius:7px;border:1px solid rgba(0,255,136,0.30);background:rgba(0,255,136,0.10);color:var(--g);font-family:var(--mono);font-size:0.70rem;cursor:pointer;letter-spacing:0.08em;transition:all 0.18s;';
      const _bad = 'padding:7px 20px;border-radius:7px;border:1px solid rgba(255,68,102,0.28);background:rgba(255,68,102,0.07);color:rgba(255,68,102,0.78);font-family:var(--mono);font-size:0.70rem;cursor:pointer;letter-spacing:0.08em;transition:all 0.18s;';
      const _inp = 'width:100%;background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.20);border-radius:8px;padding:8px 13px;color:var(--g);font-family:var(--mono);font-size:0.76rem;outline:none;caret-color:var(--g);box-sizing:border-box;';
      const _row = 'display:flex;gap:8px;justify-content:flex-end;margin-top:auto;';
      const _wrap = 'padding:22px 24px;display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box;';

      function prompt(msg, { placeholder = '', title = 'Entrada', defaultValue = '' } = {}) {
        return new Promise(resolve => {
          const proc = Kernel.procs.spawn('_dialog', { title, icon: '✏' });
          const pid  = proc.pid;
          const div  = document.createElement('div');
          div.style.cssText = _wrap;
          div.innerHTML = `
            <p style="font-size:0.75rem;color:var(--g-dim);line-height:1.7;">${msg}</p>
            <input id="dlg-i-${pid}" type="text" style="${_inp}"
              placeholder="${placeholder}" value="${defaultValue}"
              autocomplete="off" spellcheck="false"/>
            <div style="${_row}">
              <button id="dlg-x-${pid}" style="${_bad}">CANCELAR</button>
              <button id="dlg-o-${pid}" style="${_ok}">ACEPTAR</button>
            </div>`;
          WM.createWindow(proc, { title, icon: '✏', width: 390, height: 214, content: div });
          const done = v => { WM.close(pid); resolve(v); };
          const inp  = () => document.getElementById(`dlg-i-${pid}`);
          document.getElementById(`dlg-o-${pid}`).addEventListener('click', () => done(inp()?.value.trim() || null));

      function confirm(msg, { title = 'Confirmar', icon = '❓' } = {}) {
        return new Promise(resolve => {
          const proc = Kernel.procs.spawn('_dialog', { title, icon });
          const pid  = proc.pid;
          const div  = document.createElement('div');
          div.style.cssText = _wrap;
          div.innerHTML = `
            <p style="font-size:0.75rem;color:var(--g-dim);line-height:1.7;">${msg}</p>
            <div style="${_row}">
              <button id="dlg-n-${pid}" style="${_bad}">NO</button>
              <button id="dlg-y-${pid}" style="${_ok}">SÍ</button>
            </div>`;
          WM.createWindow(proc, { title, icon, width: 370, height: 185, content: div });
          const done = v => { WM.close(pid); resolve(v); };
          document.getElementById(`dlg-y-${pid}`).addEventListener('click', () => done(true));
          document.getElementById(`dlg-n-${pid}`).addEventListener('click', () => done(false));
        });
      }

      return { prompt, confirm };
    })();

    /* ══ START MENU ══ */
    const StartMenu=(()=>{
      const menu=document.getElementById('start-menu');
      const btn=document.getElementById('start-btn');
      const search=document.getElementById('start-search');
      const grid=document.getElementById('start-apps');

      function toggle(){

    })();

    /* ══ DESKTOP ══ */
    const Desktop=(()=>{

        entries.forEach(item=>{
    const isShortcut=item.type==='shortcut' || item.meta?.isDesktopShortcut;

const icon = item.meta?.icon || item.icon || (isShortcut ? '🔗' : isExe ? '⚙' : (item.type==='dir' ? '📁' : '📄'));

    });
          ic.addEventListener('click',()=>{
            document.querySelectorAll('.desktop-icon').forEach(d=>d.classList.remove('active'));
            ic.classList.add('active');
          });
          ic.addEventListener('contextmenu',e=>{
            e.preventDefault();
            const actions=[{icon:icon,text:`Abrir ${safeLabel}`,action:async()=>{
              if(isShortcut){
                const appId=item.meta?.appId;

            } else {

            }
            CtxMenu.show(e.clientX,e.clientY,actions);
          });
          iconsEl.appendChild(ic);
        });
      }

      async function refreshDesktop(){
        if(!window.Kernel?.isReady)return;
        try{
          const items=await window.Kernel.fs.readdir('/home/desktop');

        }catch(err){
          console.warn('[shell:desktop] no se pudo actualizar',err);

      }
      desktop.addEventListener('contextmenu',e=>{
        if(e.target!==desktop&&!e.target.closest('#desktop-icons')&&!e.target.classList.contains('drop-zone-hint'))return;

        CtxMenu.show(e.clientX,e.clientY,[
          {label:'ESCRITORIO'},
{icon:'📁',text:'Nueva carpeta',action:async()=>{

            }
            catch(err){Toast.show(err.message||'No se pudo crear la carpeta','error');}
          }},
{icon:'📄',text:'Nuevo archivo',action:async()=>{
            const name=await Dialog.prompt('Nombre del archivo:',{placeholder:'documento.txt',title:'Nuevo archivo'});
            if(!name)return;

          {icon:'�',text:'Bloquear pantalla',action:()=>{if(window.__wos_lock)window.__wos_lock();}},
          {icon:'�🔄',text:'Actualizar escritorio',action:()=>refreshDesktop().catch(()=>{})},
          'sep',
          {icon:'⚙️',text:'Preferencias del sistema',action:()=>openPrefsWindow()},
          {icon:'📋',text:'Información del sistema',action:()=>openSysInfoWindow()},
        ]);

      desktop.addEventListener('click',e=>{
        if(e.target===desktop||e.target.classList.contains('drop-zone-hint'))
          document.querySelectorAll('.desktop-icon').forEach(d=>d.classList.remove('active'));
      });
      desktop.addEventListener('dragover',e=>{e.preventDefault();desktop.classList.add('drop-active');});
      desktop.addEventListener('dragleave',()=>desktop.classList.remove('drop-active'));
const DROP_TEXT_EXTENSIONS = ['.txt','.md','.js','.ts','.html','.css','.json','.csv','.log','.sh','.py','.xml','.yaml','.yml','.ini','.cfg','.conf','.env'];
      desktop.addEventListener('drop',async e=>{
        e.preventDefault(); desktop.classList.remove('drop-active');

    })();

    /* ══ APP LAUNCHER ══ */
    const _singletons={};
    function launchApp(app,opts={}){
      if(app.id==='terminal'||app.entry==='native:shell-terminal'){
        createNativeTerminal(opts.parentPid??null);
        return;
      }
      if(app.singleton&&_singletons[app.id]){
        const ep=_singletons[app.id]; const wd=WM.getWindow(ep);
        if(wd){if(wd.minimized)WM.minimize(ep);WM.focus(ep);Toast.show(`${app.name} ya está abierta`,'info');return;}
      }
      const proc=Kernel.procs.spawn(app.id,{title:app.name,icon:app.icon});
      if(app.singleton)_singletons[app.id]=proc.pid;
      const winOpts={title:app.name,icon:app.icon,width:app.meta?.winWidth||660,height:app.meta?.winHeight||480};
      if(app.entry&&app.entry!=='shell.html'){
        const url=new URL(app.entry,window.location.href);
        const p=new URLSearchParams();
        if(opts.filePath)p.set('path',opts.filePath);
        if(opts.startPath)p.set('startPath',opts.startPath);
        p.set('_ts',String(Date.now())); url.search=p.toString(); winOpts.url=url.toString();
      }
      const wdata=WM.createWindow(proc,winOpts);
      if((opts.filePath||opts.startPath)&&winOpts.url){
        const iframe=wdata.el.querySelector('iframe');
        if(iframe){iframe.addEventListener('load',()=>{
          if(opts.filePath)iframe.contentWindow.postMessage({type:'editor:open',path:opts.filePath},'*');
          if(opts.startPath)iframe.contentWindow.postMessage({type:'files:navigate',path:opts.startPath},'*');
        },{once:true});}
      }
      Toast.show(`${app.name} iniciada`,'ok');
    }
